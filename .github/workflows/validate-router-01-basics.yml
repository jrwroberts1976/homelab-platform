name: Validate router-01 offline IaC

on:
  pull_request:
    paths:
      - 'IaC/ansible/roles/router_basics/**'
      - 'IaC/ansible/playbooks/router-01-*.yml'
      - 'IaC/ansible/inventory/router-01-staging.yml'
      - 'IaC/ansible/inventory/router-01-prestage.yml'
      - 'IaC/ansible/router-01/files/**'
      - 'scripts/validate-router-01-basics.py'
      - '.github/workflows/validate-router-01-basics.yml'
  workflow_dispatch:

jobs:
  syntax-and-render:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install CLI syntax validators
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nftables unbound kea-dhcp4-server shellcheck
          python3 -m pip install --user --break-system-packages 'ansible-core>=2.19,<2.21'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Offline router contract checks (no SSH, no production)
        run: python3 scripts/validate-router-01-basics.py
      - name: Ansible syntax checks (no host contact)
        working-directory: IaC/ansible
        run: |
          ansible-playbook -i inventory/router-01-staging.yml playbooks/router-01-readonly.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-docker-retirement-readonly.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-inplace-dependencies-readonly.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-docker-retirement-approved.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-retirement-config-readonly.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-pppoe-install-inplace.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-pppoe-connect-inplace.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-pppoe-stop-inplace.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-pppoe-health-readonly.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-dhcp-trial-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-dhcp-trial-arm.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-dhcp-install-inplace.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-wan-guard-inplace.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-firewall-stage-inplace.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-lan-stage-inplace.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml playbooks/router-01-lan-arm-inplace.yml --syntax-check
          ansible-playbook -i inventory/router-01-cutover-new.yml playbooks/router-01-lan-confirm-inplace.yml --syntax-check
          ansible-playbook -i inventory/router-01-prestage.yml playbooks/router-01-prestage.yml --syntax-check
          ansible-playbook -i inventory/router-01-prestage.yml playbooks/router-01-pppoe-prestage.yml --syntax-check
          ansible-playbook -i localhost, -c local playbooks/router-01-pppoe-local-validate.yml --syntax-check
          ansible-playbook -i inventory/router-01-prestage.yml playbooks/router-01-package-stage.yml --syntax-check
          ansible-playbook -i inventory/router-01-prestage.yml playbooks/router-01-rollback-prepare.yml --syntax-check
          ansible-playbook -i inventory/router-01-staging.yml playbooks/router-01-basics.yml --syntax-check
      - name: Exercise local-only PPPoE rendering with fake credentials (NO devices)
        working-directory: IaC/ansible
        run: |
          ansible-playbook -i localhost, -c local playbooks/router-01-pppoe-local-validate.yml \
            -e router_pppoe_username=ci-fixture@example.invalid \
            -e router_pppoe_password=ci-not-a-real-secret
      - name: Shell static and syntax verification (NO hardware)
        run: |
          bash -n IaC/ansible/router-01/files/router-01-lan-cutover.sh
          shellcheck IaC/ansible/router-01/files/router-01-lan-cutover.sh
          bash -n IaC/ansible/router-01/files/router-01-nm-cutover.sh
          shellcheck IaC/ansible/router-01/files/router-01-nm-cutover.sh
          bash -n IaC/ansible/router-01/files/router-01-dhcp-trial.sh
          shellcheck IaC/ansible/router-01/files/router-01-dhcp-trial.sh
          sudo nft -c -f IaC/ansible/router-01/templates/nftables-pppoe-inplace.conf.j2
          sudo nft -c -f IaC/ansible/router-01/files/router-wan-guard.nft
