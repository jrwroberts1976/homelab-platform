name: Validate network discovery and legacy retirement

on:
  push:
    branches:
      - main
      - feature/network-all-hosts-grafana
      - feature/grafana-network-host-tiles
      - feature/hostname-first-grafana-hosts
      - feature/host-dashboards-data-only
      - fix/grafana-host-panels-per-device
      - feature/restore-network-hosts-data-driven
      - feature/grafana-nmap-os-fingerprint-evidence
      - fix/legacy-nmap-profile-timestamps
      - plan/move-network-discovery-to-monitor-01
      - feature/stage-network-discovery-on-monitor01
      - chore/retire-legacy-network-collectors-20261103
  pull_request:
    paths:
      - "IaC/ansible/roles/monitoring_stack/**"
      - "IaC/monitoring/**"
      - "IaC/komodo/stacks/monitoring/grafana/**"
      - "IaC/ansible/playbooks/network-host-monitor01-preflight.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-stage.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-proxmox-tls.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-proxmox-guests-check.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-proxmox-snapshot.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-proxmox-identity-stage.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-proxmox-refresh-stage.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-refresh-units-stage.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-firstseen-preflight.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-firstseen-notifier-stage.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-firstseen-notifier-verify.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-cutover-preflight.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-source-freeze.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-final-transfer.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-activate.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-targeted-profiler-stage.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-rollback.yml"
      - "IaC/ansible/playbooks/network-host-monitor01-preactivation-recover.yml"
      - "IaC/ansible/playbooks/postcutover-estate-evidence.yml"
      - "IaC/ansible/roles/network_host_collector/**"
      - "IaC/ansible/roles/network_host_enrichment/**"
      - "IaC/ansible/roles/network_host_deep_profiler/**"
      - "IaC/ansible/roles/network_host_dns_evidence/**"
      - "IaC/ansible/playbooks/network-host-dns-evidence-stage.yml"
      - "IaC/ansible/playbooks/network-host-dhcp-reset-preflight.yml"
      - "IaC/ansible/playbooks/network-host-dhcp-discovery-reset.yml"
      - "IaC/ansible/playbooks/network-host-dhcp-collector-repair.yml"

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python3 -m pip install "PyYAML==6.0.2" "ansible-core>=2.19,<2.20"

      - name: Validate focused Ansible dashboard deployment syntax
        run: |
          cd IaC/ansible
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-grafana.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-os-fingerprints.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-preflight.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-targeted-profiler-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-dns-evidence-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-dhcp-reset-preflight.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-dhcp-discovery-reset.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-dhcp-collector-repair.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-proxmox-tls.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-proxmox-guests-check.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-proxmox-snapshot.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-proxmox-identity-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-proxmox-refresh-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-refresh-units-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-firstseen-preflight.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-firstseen-notifier-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-firstseen-notifier-verify.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-cutover-preflight.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-source-freeze.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-final-transfer.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-activate.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-rollback.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/network-host-monitor01-preactivation-recover.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/postcutover-estate-evidence.yml --syntax-check

      - name: Validate exporter syntax and unit tests
        run: |
          python3 -m py_compile IaC/ansible/roles/network_host_deep_profiler/files/os-fingerprint-evidence-exporter.py IaC/ansible/roles/network_host_enrichment/files/proxmox_guest_identity.py IaC/ansible/roles/network_host_enrichment/files/proxmox-guest-mac-refresh.py
          python3 -m py_compile IaC/monitoring/audits/postcutover_network_scan.py IaC/monitoring/audits/compare_live_estate.py IaC/monitoring/audits/build_device_catalogue.py IaC/monitoring/audits/reconcile_unknown_devices.py
          python3 -m unittest discover -s IaC/monitoring/tests -p 'test_*.py' -v
          python3 IaC/ansible/roles/network_host_deep_profiler/test_deep_profiler.py
          python3 IaC/ansible/roles/network_host_deep_profiler/test_worker_recovery.py
          python3 IaC/ansible/roles/network_host_dns_evidence/test_dns_evidence.py

      - name: Verify active network monitoring and fail-closed retirement guards
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          base = Path("IaC/ansible/roles/monitoring_stack")
          defaults = yaml.safe_load((base / "defaults/main.yml").read_text())
          tasks = yaml.safe_load((base / "tasks/main.yml").read_text())
          task_names = {task["name"] for task in tasks}
          assert "Install network inventory publishing timer" not in task_names
          assert "Enable network inventory publishing timer" not in task_names
          assert "Install MAC-linked Grafana dashboard generator" not in task_names
          assert "Generate a dedicated Grafana dashboard for each retained MAC" not in task_names

          retired_files = (
              "homelab-network-host-tiles.json",
              "homelab-mac-device-detail.json",
              "homelab-all-network-devices.json",
              "homelab-physical-network.json",
              "homelab-network-device-detail.json",
          )
          retired_sources = (
              "files/network-device-inventory-exporter.py",
              "files/network-host-dashboard-generator.py",
              "files/host-profile-template.json",
              "files/homelab-network-device-inventory.service",
              "files/homelab-network-device-inventory.timer",
              "files/homelab-network-host-dashboards.service",
              "files/homelab-network-host-dashboards.timer",
          )
          assert all(not (base / item).exists() for item in retired_sources)
          assert not Path("IaC/ansible/roles/asus_network_inventory").exists()
          assert not Path("IaC/ansible/roles/hp_switch_collector").exists()

          retired_uids = tuple(name.removesuffix(".json") for name in retired_files)
          assert all(name not in defaults["monitoring_grafana_dashboard_files"]
                     for name in retired_files)
          assert all(uid not in defaults["monitoring_grafana_dashboard_uids"]
                     for uid in retired_uids)

          # These are separate, still-supported network/host dashboards.
          active_dashboards = (
              ("homelab-router-dhcp.json", "homelab-router-dhcp"),
              ("homelab-network-hosts.json", "homelab-network-hosts"),
              ("homelab-node-detail.json", "homelab-node-detail"),
          )
          for filename, uid in active_dashboards:
              assert filename in defaults["monitoring_grafana_dashboard_files"]
              assert uid in defaults["monitoring_grafana_dashboard_uids"]
              data = json.loads((base / "files/grafana/dashboards" / filename).read_text())
              assert data["uid"] == uid
              assert data["panels"]

          provider = (base / "templates/grafana-dashboard-provider.yml.j2").read_text()
          assert "name: Homelab" in provider
          assert "name: Homelab Production" in provider
          assert "homelab-generated-network-hosts" not in provider
          assert "/etc/grafana/provisioning/dashboards/network-hosts" not in provider

          retired_playbooks = (
              "asus-network-inventory.yml",
              "hp-switch-collector.yml",
              "network-host-grafana.yml",
              "network-host-monitor01-router-hostname-update.yml",
              "zabbix-network-inventory-exporter.yml",
          )
          for name in retired_playbooks:
              spec = yaml.safe_load((Path("IaC/ansible/playbooks") / name).read_text())
              assert len(spec) == 1 and spec[0]["hosts"] == "localhost", name
              assert len(spec[0]["tasks"]) == 1, name
              assert "ansible.builtin.fail" in spec[0]["tasks"][0], name
              assert "systemd_service" not in str(spec), name

          host_template = Path(
              "IaC/ansible/roles/network_host_collector/templates/"
              "homelab-network-host-collector.py.j2").read_text()
          assert "load_asus_hostnames" not in host_template
          assert "ROUTER_HOSTNAME_SNAPSHOT" not in host_template
          assert "homelab_network_host_info" in host_template
          ai_template = Path(
              "IaC/ansible/roles/network_host_ai_resolver/templates/"
              "homelab-network-host-ai-resolver.py.j2").read_text()
          assert "ROUTER_DB" not in ai_template
          assert "router_identity()" not in ai_template
          assert "recent_dns_activity" in ai_template

          reset_text = Path(
              "IaC/ansible/playbooks/network-host-dhcp-discovery-reset.yml"
          ).read_text()
          assert "RESET_DISCOVERED_HOSTS_NO_BACKUP" in reset_text
          assert "dhcp_discovery_reset_approved" in reset_text
          assert "homelab_network_devices.prom" in reset_text
          assert "alerted-macs.json" in reset_text
          assert "backup: false" in reset_text
          assert "network_host_collector_interface: eth0" in reset_text
          assert "homelab-proxmox-guest-refresh" not in reset_text

          # Regression: play vars can be shadowed by the historical
          # defaults vars_files. Require explicit task-level overrides
          # on the installed collector template, not just string presence.
          reset_spec = yaml.safe_load(reset_text)
          reset_play = next(p for p in reset_spec
                            if p.get("name") ==
                            "Establish fresh router-01 DHCP-era discovered-host baseline")
          reset_block = next(t["block"] for t in reset_play["tasks"]
                             if t.get("name") ==
                             "Pause producers, clear regenerable state, scan and resume")
          install = next(t for t in reset_block
                         if t.get("name") ==
                         "Install corrected Ansible-managed collector before reset")
          assert install["vars"]["network_host_collector_interface"] == "eth0"
          assert install["vars"]["network_host_collector_subnet"] == "192.168.2.0/24"
          assert "ast.literal_eval" in reset_text
          assert 'values.get("INTERFACE") != "eth0"' in reset_text
          assert "Mark irreversible reset boundary" in reset_text

          repair_text = Path(
              "IaC/ansible/playbooks/network-host-dhcp-collector-repair.yml"
          ).read_text()
          repair_spec = yaml.safe_load(repair_text)
          repair_task = next(t for t in repair_spec[0]["tasks"]
                             if t.get("name") ==
                             "Install corrected host collector only, without any backup")
          assert repair_task["vars"]["network_host_collector_interface"] == "eth0"
          assert repair_task["vars"]["network_host_collector_subnet"] == "192.168.2.0/24"
          assert repair_task["ansible.builtin.template"]["backup"] is False
          assert "ansible.builtin.file" not in repair_text
          assert "ansible.builtin.systemd_service" not in repair_text
          assert "homelab-network-host-collector.service" not in repair_text
          assert "run_nmap" not in repair_text

          # Keep the independently developed OS-evidence, cutover and
          # protected Proxmox guest-identity regression gates.
          evidence_source = Path(
              "IaC/ansible/roles/network_host_deep_profiler/files/"
              "os-fingerprint-evidence-exporter.py").read_text()
          assert "subprocess" not in evidence_source
          assert "evidence_time" in evidence_source
          assert "Profile completion" in evidence_source
          assert "Not recorded" in evidence_source
          assert 'homelab_network_host_os_fingerprint_info' in evidence_source
          assert 'read_text(encoding="utf-8")' in evidence_source
          focused_nmap = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-os-fingerprints.yml").read_text())
          assert len(focused_nmap) == 1
          assert focused_nmap[0]["hosts"] == "monitoring_hosts"
          assert "monitor-01" in str(focused_nmap)
          assert "homelab-network-os-evidence.timer" in str(focused_nmap)
          assert "homelab_network_host_os_fingerprint_info%7Btarget_name%3D%22monitor-01%22%7D" in str(focused_nmap)
          monitor_migration = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-preflight.yml").read_text())
          assert [p["hosts"] for p in monitor_migration] == ["Proxmox-2", "monitoring_hosts"]
          assert not any("systemd_service" in t or "copy:" in t or "template:" in t
                         for play in monitor_migration for t in
                         [str(item) for item in play["tasks"]])
          staged = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-stage.yml").read_text())
          assert [p["hosts"] for p in staged] == ["Proxmox-2", "monitoring_hosts"]
          source_actions = staged[0]["tasks"]
          assert not any("systemd_service" in x or "import_role" in x
                         for x in source_actions)
          target_actions = staged[1]["tasks"]
          role_calls = [x for x in target_actions if "ansible.builtin.import_role" in x]
          assert {x["ansible.builtin.import_role"]["name"] for x in role_calls} == {
              "network_host_collector", "network_host_enrichment",
              "network_host_deep_profiler"}
          for call in role_calls:
              settings = call["vars"]
              role = call["ansible.builtin.import_role"]["name"]
              assert settings[role + "_expected_hostname"] == "monitor-01"
              assert settings[role + "_expected_ipv4"] == "192.168.2.52"
              assert settings[role + "_enable_timer"] is False
          assert "inventory.json" in staged[0]["vars"]["evidence_files"]
          assert "deep-profiles.json" in staged[0]["vars"]["evidence_files"]
          assert "enrichment.json" in staged[0]["vars"]["evidence_files"]
          assert not any("restart" in x["name"].lower()
                         or "enable new" in x["name"].lower()
                         for x in target_actions)
          assert "eth0" in str(target_actions)
          # Gate 3a is a non-mutating two-host inspection only.
          # It cannot stop the source, write recipient/MAC registry,
          # enable a destination timer, run Nmap or activate cutover.
          gate3a = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-cutover-preflight.yml").read_text())
          assert [play["hosts"] for play in gate3a] == [
              "Proxmox-2", "monitoring_hosts"
          ]
          for play in gate3a:
              for task in play["tasks"]:
                  assert not any(key in task for key in [
                      "ansible.builtin.copy",
                      "ansible.builtin.file",
                      "ansible.builtin.apt",
                      "ansible.builtin.systemd_service",
                      "ansible.builtin.import_role",
                      "ansible.builtin.reboot",
                  ])
                  if "ansible.builtin.template" in task:
                      assert task.get("check_mode") is True
                      assert task.get("diff") is False
                      assert task.get("no_log") is True
                  if "ansible.builtin.shell" in task:
                      assert task.get("no_log") is True
                      assert "--refresh" not in str(task)
                      assert "--test-email" not in str(task)
          assert "alerted-macs.json" in str(gate3a)
          assert "network-discovery-cutover-approved" in str(gate3a)
          assert "homelab-proxmox-guest-refresh.timer" in str(gate3a)
          assert "snapshot_age_seconds" in str(gate3a)

          # Gate 2i-R reconciles a pre-existing notifier using Ansible
          # template check mode only; it must never replace its bytes,
          # create a registry, send email or start any scanning timer.
          notifier_verify = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-firstseen-notifier-verify.yml").read_text())
          assert len(notifier_verify) == 1
          assert notifier_verify[0]["hosts"] == "monitoring_hosts"
          verify_tasks = notifier_verify[0]["tasks"]
          template_checks = [t for t in verify_tasks if "ansible.builtin.template" in t]
          assert len(template_checks) == 1
          assert template_checks[0]["check_mode"] is True
          assert template_checks[0]["diff"] is False
          assert template_checks[0]["no_log"] is True
          assert not any(
              any(k in t for k in [
                  "ansible.builtin.copy", "ansible.builtin.file",
                  "ansible.builtin.systemd_service", "ansible.builtin.apt",
                  "ansible.builtin.import_role"
              ]) for t in verify_tasks
          )
          assert "not notifier_template_comparison.changed" in str(notifier_verify)
          assert "alerted-macs.json" in str(notifier_verify)
          assert "homelab-proxmox-guest-refresh.timer" in str(notifier_verify)

          # Gate 2i installs only an inert script on monitor-01,
          # preserving all protected MAC registries and disabling timers.
          inert_notifier = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-firstseen-notifier-stage.yml").read_text())
          assert len(inert_notifier) == 1
          assert inert_notifier[0]["hosts"] == "monitoring_hosts"
          notifier_repr = str(inert_notifier)
          assert "network_host_collector_expected_hostname" in notifier_repr
          assert "monitor-01" in notifier_repr
          assert "network_host_collector_alert_enabled" in notifier_repr
          assert "alerted-macs.json" in notifier_repr
          assert "alerts.env" in notifier_repr
          assert "ExecStartPost=" in notifier_repr
          assert "homelab-proxmox-guest-refresh.timer" in notifier_repr
          assert "network-discovery-cutover-approved" in notifier_repr
          assert not any(
              "ansible.builtin.systemd_service" in step
              or "ansible.builtin.import_role" in step
              or "ansible.builtin.copy" in step
              for step in [str(t) for t in inert_notifier[0]["tasks"]]
          )

          # Gate 2h is strictly read-only; the production first-seen
          # notifier and recipient must stay on source until final cutover.
          alert_gate = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-firstseen-preflight.yml").read_text())
          assert [play["hosts"] for play in alert_gate] == [
              "Proxmox-2", "monitoring_hosts"]
          alert_repr = str(alert_gate)
          assert "alerted-macs.json" in alert_repr
          assert "alerts.env" in alert_repr
          assert "192.168.2.54" in alert_repr
          assert "homelab-proxmox-guest-refresh.timer" in alert_repr
          assert "network-discovery-cutover-approved" in alert_repr
          for play in alert_gate:
              for step in play["tasks"]:
                  assert not any(key in step for key in [
                      "ansible.builtin.copy",
                      "ansible.builtin.file",
                      "ansible.builtin.template",
                      "ansible.builtin.systemd_service",
                      "ansible.builtin.script",
                      "ansible.builtin.apt",
                  ])
          assert "smtp.sendmail" not in alert_repr
          assert "--test-email" in alert_repr
          assert "no_log" in alert_repr

          # The staged refresh unit is inert and enrichment additionally
          # requires an explicit, absent-until-cutover approval marker.
          unit_gate = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-refresh-units-stage.yml").read_text())
          assert len(unit_gate) == 1
          assert unit_gate[0]["hosts"] == "monitoring_hosts"
          gate_repr = str(unit_gate)
          assert "ConditionPathExists=" in Path(
              "IaC/ansible/roles/network_host_enrichment/files/20-proxmox-guest-refresh.conf").read_text()
          assert "network-discovery-cutover-approved" in gate_repr
          assert "homelab-proxmox-guest-refresh.timer" in gate_repr
          assert "homelab-network-host-collector.timer" in gate_repr
          assert "lookup('file', refresh_files_root" in gate_repr
          assert "rstrip=False" in gate_repr
          assert not any(
              "ansible.builtin.systemd_service" in task
              and "daemon_reload" not in task
              for task in [str(item) for item in unit_gate[0]["tasks"]]
          )

          # Gate 2f performs only a protected API snapshot refresh,
          # with SHA-preserved original state and no service/timer changes.
          refresh_gate = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-proxmox-refresh-stage.yml").read_text())
          assert len(refresh_gate) == 1
          assert refresh_gate[0]["hosts"] == "monitoring_hosts"
          refresh_tasks = refresh_gate[0]["tasks"]
          assert not any("ansible.builtin.systemd_service" in t or
                         "ansible.builtin.import_role" in t
                         for t in [str(item) for item in refresh_tasks])
          assert "--check" in str(refresh_gate)
          assert "--refresh" in str(refresh_gate)
          assert "proxmox-guests." in str(refresh_gate)
          # Ansible file lookup trims trailing newlines by default.
          # Deployed copy/src retains all bytes: compare hashes of complete
          # source files or a valid on-host publisher falsely fails Gate 2f.
          gate_text = str(refresh_gate)
          assert "lookup('file', publisher_source, rstrip=False)" in gate_text
          assert "lookup('file', helper_source, rstrip=False)" in gate_text
          assert Path(
              "IaC/ansible/roles/network_host_enrichment/files/proxmox-guest-mac-snapshot.py").read_bytes().endswith(bytes([10]))

          assert "homelab-network-host-collector.timer" in str(refresh_gate)
          refresher = Path(
              "IaC/ansible/roles/network_host_enrichment/files/proxmox-guest-mac-refresh.py").read_text()
          assert "ssl.create_default_context(cafile=module" in refresher
          assert "_create_unverified_context" not in refresher
          assert "os.replace(tmp, path)" in refresher
          assert "backup_previous(" in refresher
          assert "subprocess" not in refresher

          # Gate 2e must only change an inert staged worker executable.
          # Its no-scan --identity-check path must exit before port probes.
          identity_gate = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-proxmox-identity-stage.yml").read_text())
          assert len(identity_gate) == 1
          assert identity_gate[0]["hosts"] == "monitoring_hosts"
          gate_steps = identity_gate[0]["tasks"]
          assert not any("ansible.builtin.systemd_service" in t or
                         "ansible.builtin.import_role" in t
                         for t in [str(item) for item in gate_steps])
          assert "--identity-check" in str(identity_gate)
          assert "proxmox-guests.json" in str(identity_gate)
          default_source = yaml.safe_load(Path(
              "IaC/ansible/roles/network_host_enrichment/defaults/main.yml").read_text())
          assert default_source["network_host_enrichment_proxmox_source"] == "local"
          worker = Path(
              "IaC/ansible/roles/network_host_enrichment/templates/homelab-network-host-enricher.py.j2").read_text()
          assert worker.index('if len(sys.argv) != 1:') < worker.index(
              "scan_services(online_ips)")
          assert "proxmox_by_mac, _proxmox_counts = selected_proxmox_identity_by_mac(inventory)" in worker

          # Gate 2d creates only a separate root-only guest-MAC map.
          # It may not touch the three staged JSON files, source systems,
          # worker services or the Grafana production inventory.
          snapshot_gate = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-proxmox-snapshot.yml").read_text())
          assert len(snapshot_gate) == 1
          assert snapshot_gate[0]["hosts"] == "monitoring_hosts"
          snapshot_steps = snapshot_gate[0]["tasks"]
          assert not any("ansible.builtin.systemd_service" in t or
                         "ansible.builtin.import_role" in t or
                         "ansible.builtin.template" in t
                         for t in [str(item) for item in snapshot_steps])
          snapshot_code = Path(
              "IaC/ansible/roles/network_host_enrichment/files/proxmox-guest-mac-snapshot.py").read_text()
          assert "ssl.create_default_context(cafile=CA_PATH)" in snapshot_code
          assert "subprocess" not in snapshot_code
          assert "_create_unverified_context" not in snapshot_code
          assert "os.link(temp_path, path)" in snapshot_code
          assert "proxmox-guests.json" in str(snapshot_gate)
          assert "--publish" in str(snapshot_gate)
          assert "homelab-network-host-collector.timer" in str(snapshot_gate)

          guest_gate = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-proxmox-guests-check.yml").read_text())
          assert len(guest_gate) == 1
          assert guest_gate[0]["hosts"] == "monitoring_hosts"
          guest_steps = guest_gate[0]["tasks"]
          assert all(not any(k in task for k in (
              "ansible.builtin.systemd_service",
              "ansible.builtin.import_role",
              "ansible.builtin.template"
          )) for task in guest_steps)
          guest_code = Path(
              "IaC/ansible/roles/network_host_enrichment/files/proxmox-guest-preflight.py").read_text()
          assert "ssl.create_default_context(cafile=CA_FILE)" in guest_code
          assert "_create_unverified_context" not in guest_code
          assert "subprocess" not in guest_code
          assert "--check" in guest_code
          assert "run_nmap" not in guest_code
          assert "proxmox-api.env" in str(guest_gate)
          assert "proxmox-ca.pem" in str(guest_gate)
          assert "disabled" in str(guest_gate)

          # TLS trust gate must compare two SSH-retrieved public CA files,
          # verify HTTPS with CA + IP SAN and never change live timers.
          trust = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-monitor01-proxmox-tls.yml").read_text())
          assert [p["hosts"] for p in trust] == [
              "proxmox_hosts", "monitoring_hosts"]
          trust_text = str(trust)
          assert "/etc/pve/pve-root-ca.pem" in trust_text
          assert "pve_cluster_ca.content ==" in trust_text
          assert "ssl.create_default_context(cafile=ca)" in trust_text
          assert "_create_unverified_context" not in trust_text.replace(
              "NEVER use _create_unverified_context or disable hostname checks.", "")
          assert "/etc/homelab-network-hosts/proxmox-api.env" in trust_text
          assert not any("ansible.builtin.systemd_service" in t or
                         "ansible.builtin.import_role" in t
                         for p in trust for t in
                         [str(item) for item in p["tasks"]])

          assert "Proxmox-2" in str(staged)
          for role in ("network_host_collector", "network_host_enrichment",
                       "network_host_deep_profiler"):
              root = Path("IaC/ansible/roles") / role
              defaults = yaml.safe_load((root / "defaults/main.yml").read_text())
              assert defaults[role + "_expected_hostname"] == "Proxmox-2"
              assert defaults[role + "_expected_ipv4"] == "192.168.2.71"
          assert focused_nmap[0]["hosts"] == "monitoring_hosts"
          assert not any("homelab-network-host-deep-profiler.service" in str(t)
                         or "homelab-network-host-deep-profiler.timer" in str(t)
                         for play in focused_nmap for t in play["tasks"])
          print("Active network observability, retirement guards, protected discovery: PASS")
