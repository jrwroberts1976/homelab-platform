name: Validate network inventory dashboard

on:
  push:
    branches:
      - feature/network-all-hosts-grafana
      - feature/grafana-network-host-tiles
      - feature/hostname-first-grafana-hosts
      - feature/host-dashboards-data-only
      - fix/grafana-host-panels-per-device
      - feature/restore-network-hosts-data-driven
  pull_request:
    paths:
      - "IaC/ansible/roles/monitoring_stack/**"
      - "IaC/monitoring/**"
      - "IaC/komodo/stacks/monitoring/grafana/**"

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependency
        run: python3 -m pip install "PyYAML==6.0.2"

      - name: Validate exporter syntax and unit tests
        run: |
          python3 -m py_compile IaC/ansible/roles/monitoring_stack/files/network-device-inventory-exporter.py IaC/ansible/roles/monitoring_stack/files/network-host-dashboard-generator.py
          python3 -m unittest discover -s IaC/monitoring/tests -p 'test_*.py' -v

      - name: Verify Grafana dashboard and Ansible registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          base = Path("IaC/ansible/roles/monitoring_stack")
          defaults = yaml.safe_load((base / "defaults/main.yml").read_text())
          tasks = yaml.safe_load((base / "tasks/main.yml").read_text())
          for path, uid in [
              ("homelab-all-network-devices.json", "homelab-all-network-devices"),
              ("homelab-network-device-detail.json", "homelab-network-device-detail"),
              ("homelab-network-host-tiles.json", "homelab-network-host-tiles"),
              ("homelab-mac-device-detail.json", "homelab-mac-device-detail"),
          ]:
              dashboard = json.loads((base / "files/grafana/dashboards" / path).read_text())
              assert dashboard["uid"] == uid, (path, dashboard["uid"])
              ids = [panel["id"] for panel in dashboard["panels"]]
              assert len(ids) == len(set(ids))
              assert len(ids) >= (2 if uid == "homelab-mac-device-detail" else
                                 3 if uid == "homelab-network-host-tiles" else 10)
              assert all(0 <= p["gridPos"]["x"] and
                         p["gridPos"]["x"] + p["gridPos"]["w"] <= 24
                         for p in dashboard["panels"])
              assert path in defaults["monitoring_grafana_dashboard_files"]
              assert uid in defaults["monitoring_grafana_dashboard_uids"]

          for name in ("homelab-network-host-tiles.json",
                       "homelab-mac-device-detail.json",
                       "homelab-network-hosts.json"):
              native = (base / "files/grafana/dashboards" / name).read_text()
              komodo = (Path("IaC/komodo/stacks/monitoring/grafana")
                        / "provisioning/dashboards/homelab" / name).read_text()
              assert json.loads(native) == json.loads(komodo), name
          native_provider = (base / "templates/grafana-dashboard-provider.yml.j2").read_text()
          komodo_provider = Path("IaC/komodo/stacks/monitoring/grafana/provisioning/dashboards/homelab.yml").read_text()
          for provider in (native_provider, komodo_provider):
              assert "homelab-generated-network-hosts" in provider
              assert "/etc/grafana/provisioning/dashboards/network-hosts" in provider

          overview = json.loads((base / "files/grafana/dashboards/homelab-network-host-tiles.json").read_text())
          detail = json.loads((base / "files/grafana/dashboards/homelab-mac-device-detail.json").read_text())
          assert overview["title"] == "Homelab — Network Hosts"
          assert detail["title"] == "Homelab — Host Detail"
          expected_top = ["Average CPU", "Average Memory Used",
                          "Total Updates", "Security Updates"]
          expected_charts = ["CPU Usage", "Memory Usage",
                             "Network Throughput", "Filesystem Utilisation"]
          full_template = json.loads(
              (base / "files/host-profile-template.json").read_text())
          assert full_template["uid"] == "homelab-mac-device-detail"
          assert len(full_template["panels"]) >= 20
          top = sorted(
              (p for p in full_template["panels"] if p["gridPos"]["y"] == 0),
              key=lambda p: p["gridPos"]["x"])
          assert [p["title"] for p in top] == expected_top
          assert all(name in [p["title"] for p in full_template["panels"]]
                     for name in expected_charts)
          assert len(overview["panels"]) == 7
          assert [p["title"] for p in overview["panels"][:4]] == [
              "Known devices", "Online", "Documented OS", "OS to investigate"
          ]
          assert any("Network hosts" in p["title"] for p in overview["panels"])
          directory = next(p for p in overview["panels"]
                           if p["title"].startswith("Network hosts"))
          opening = next(v for v in directory["fieldConfig"]["overrides"]
                         if v["matcher"]["options"] == "Open host")
          link = next(prop["value"][0] for prop in opening["properties"]
                      if prop["id"] == "links")
          assert link["url"] == "/d/${__value.raw}"
          directory_fields = next(
              t["options"] for t in directory["transformations"]
              if t["id"] == "organize"
          )
          assert directory_fields["renameByName"]["dashboard_uid"] == "Open host"
          assert "dashboard_uid" not in directory_fields["excludeByName"]

          for dashboard in (overview, detail):
              host_picker = next(link for link in dashboard["links"]
                                 if link["title"] == "Choose host dashboard")
              assert host_picker["type"] == "dashboards"
              assert host_picker["asDropdown"]
              assert host_picker["tags"] == ["generated-network-host"]
              assert dashboard["templating"]["list"][0]["name"] == "host"
              assert "hostname" in dashboard["templating"]["list"][0]["query"]["query"]
              assert any("profile_uid" == p["name"] and p["hide"] == 2
                         for p in dashboard["templating"]["list"])
              assert any("profile_uid" in link.get("url", "")
                         for link in dashboard["links"])
              assert not any(p["type"] in ("timeseries", "logs")
                             for p in dashboard["panels"])
              assert not any(p["title"] == "No telemetry" or
                             "CPU" in p["title"] or
                             "Memory" in p["title"]
                             for p in dashboard["panels"])
              assert "MAC" not in dashboard["title"]
              for panel in dashboard["panels"]:
                  if panel["type"] != "table":
                      continue
                  organize = next(t["options"] for t in panel["transformations"]
                                  if t["id"] == "organize")
                  for internal in ("mac", "device_key"):
                      assert organize["excludeByName"].get(internal), (
                          panel["title"], internal)
                  if panel["id"] != 18:
                      assert organize["excludeByName"].get("dashboard_uid"), (
                          panel["title"], "dashboard_uid")
          assert any("Network directory" in p["title"]
                     for p in overview["panels"])
          assert len(detail["panels"]) < len(overview["panels"])
          assert "tag=generated-network-host" in Path(
              "IaC/ansible/playbooks/network-host-grafana.yml").read_text()
          generator = (base / "files/network-host-dashboard-generator.py").read_text()
          assert "collect_availability" in generator
          assert "compact_panels" in generator
          assert "present_over_time" in generator
          assert '"title": "Choose host"' in generator
          inventory_service = (base / "files/homelab-network-device-inventory.service").read_text()
          assert "ProtectSystem=strict" in inventory_service
          assert "ReadWritePaths=/var/lib/prometheus/node-exporter" in inventory_service
          assert "ExecStartPost=" not in inventory_service
          host_service = (base / "files/homelab-network-host-dashboards.service").read_text()
          host_timer = (base / "files/homelab-network-host-dashboards.timer").read_text()
          assert "ProtectSystem=strict" in host_service
          assert "ReadWritePaths=/opt/monitoring/grafana/provisioning/dashboards/network-hosts" in host_service
          assert "OnUnitActiveSec=5min" in host_timer
          focused = Path("IaC/ansible/playbooks/network-host-grafana.yml").read_text()
          monitoring_tasks = (base / "tasks/main.yml").read_text()
          for provisioner in (focused, monitoring_tasks):
              assert "host-profile-template.json" in provisioner
          exporter = (base / "files/network-device-inventory-exporter.py").read_text()
          assert "homelab_network_device_card_info" in exporter
          assert "device_key = \"mac:\"" in exporter

          focused_playbook = yaml.safe_load(Path(
              "IaC/ansible/playbooks/network-host-grafana.yml").read_text())
          assert len(focused_playbook) == 1
          rollout = focused_playbook[0]
          assert rollout["hosts"] == "monitoring_hosts"
          rollout_steps = [step["name"] for step in rollout["tasks"]]
          for required in [
              "Install only the two new native Grafana dashboards",
              "Generate native Grafana dashboards for all retained MACs",
              "Restart only Grafana if provider configuration changed",
              "Install independent per-host Grafana generator service and timer",
              "Enable independent per-host dashboard refresh",
              "Confirm Grafana sees the rebuilt dashboard file inside its actual container",
              "Verify Grafana API is serving the rebuilt seven-panel hostname directory",
              "Verify Grafana API has indexed individual generated host dashboards",
          ]:
              assert required in rollout_steps, required
          assert not any("Reconcile monitoring containers" in name
                         or "Pull pinned monitoring images" in name
                         for name in rollout_steps)

          steps = [task["name"] for task in tasks]
          for required in [
              "Install canonical estate for network device OS identification",
              "Install dated and minimised DNS device evidence",
              "Install evidence-qualified network inventory exporter",
              "Publish initial consolidated network inventory",
              "Install MAC-linked Grafana dashboard generator",
              "Generate a dedicated Grafana dashboard for each retained MAC",
              "Install independent Grafana host dashboard generator service",
              "Install independent Grafana host dashboard generator timer",
              "Enable independent per-device Grafana regeneration timer",
          ]:
              assert required in steps, required

          hints = json.loads(Path(
              "IaC/monitoring/network-device-dns-hints.json").read_text())
          assert hints["schema_version"] == 1
          assert "192.168.2.183" in hints["devices"]
          print("Dashboard JSON, Ansible YAML, deployment steps and evidence: PASS")
          PY
