name: Validate network inventory dashboard

on:
  push:
    branches:
      - feature/network-all-hosts-grafana
      - feature/grafana-network-host-tiles
  pull_request:
    paths:
      - "IaC/ansible/roles/monitoring_stack/**"
      - "IaC/monitoring/**"
      - "IaC/komodo/stacks/monitoring/grafana/**"

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependency
        run: python3 -m pip install "PyYAML==6.0.2"

      - name: Validate exporter syntax and unit tests
        run: |
          python3 -m py_compile IaC/ansible/roles/monitoring_stack/files/network-device-inventory-exporter.py IaC/ansible/roles/monitoring_stack/files/network-host-dashboard-generator.py
          python3 -m unittest discover -s IaC/monitoring/tests -p 'test_*.py' -v

      - name: Verify Grafana dashboard and Ansible registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          base = Path("IaC/ansible/roles/monitoring_stack")
          defaults = yaml.safe_load((base / "defaults/main.yml").read_text())
          tasks = yaml.safe_load((base / "tasks/main.yml").read_text())
          for path, uid in [
              ("homelab-all-network-devices.json", "homelab-all-network-devices"),
              ("homelab-network-device-detail.json", "homelab-network-device-detail"),
              ("homelab-network-host-tiles.json", "homelab-network-host-tiles"),
              ("homelab-mac-device-detail.json", "homelab-mac-device-detail"),
          ]:
              dashboard = json.loads((base / "files/grafana/dashboards" / path).read_text())
              assert dashboard["uid"] == uid, (path, dashboard["uid"])
              ids = [panel["id"] for panel in dashboard["panels"]]
              assert len(ids) == len(set(ids))
              assert len(ids) >= 10
              assert all(0 <= p["gridPos"]["x"] and
                         p["gridPos"]["x"] + p["gridPos"]["w"] <= 24
                         for p in dashboard["panels"])
              assert path in defaults["monitoring_grafana_dashboard_files"]
              assert uid in defaults["monitoring_grafana_dashboard_uids"]

          for name in ("homelab-network-host-tiles.json",
                       "homelab-mac-device-detail.json"):
              native = (base / "files/grafana/dashboards" / name).read_text()
              komodo = (Path("IaC/komodo/stacks/monitoring/grafana")
                        / "provisioning/dashboards/homelab" / name).read_text()
              assert json.loads(native) == json.loads(komodo), name
          native_provider = (base / "templates/grafana-dashboard-provider.yml.j2").read_text()
          komodo_provider = Path("IaC/komodo/stacks/monitoring/grafana/provisioning/dashboards/homelab.yml").read_text()
          for provider in (native_provider, komodo_provider):
              assert "homelab-generated-network-hosts" in provider
              assert "/etc/grafana/provisioning/dashboards/network-hosts" in provider

          overview = json.loads((base / "files/grafana/dashboards/homelab-network-host-tiles.json").read_text())
          tile = next(p for p in overview["panels"] if p["title"].startswith("All network devices"))
          assert tile["type"] == "stat"
          assert any("dashboard_uid" in link["url"]
                     for link in tile["fieldConfig"]["defaults"]["links"])
          assert tile["options"]["reduceOptions"]["values"]
          exporter = (base / "files/network-device-inventory-exporter.py").read_text()
          assert "homelab_network_device_card_info" in exporter
          assert "device_key = \"mac:\"" in exporter

          steps = [task["name"] for task in tasks]
          for required in [
              "Install canonical estate for network device OS identification",
              "Install dated and minimised DNS device evidence",
              "Install evidence-qualified network inventory exporter",
              "Publish initial consolidated network inventory",
              "Install MAC-linked Grafana dashboard generator",
              "Generate a dedicated Grafana dashboard for each retained MAC",
          ]:
              assert required in steps, required

          hints = json.loads(Path(
              "IaC/monitoring/network-device-dns-hints.json").read_text())
          assert hints["schema_version"] == 1
          assert "192.168.2.183" in hints["devices"]
          print("Dashboard JSON, Ansible YAML, deployment steps and evidence: PASS")
          PY
