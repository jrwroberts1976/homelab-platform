              assert host_picker["asDropdown"]
              assert host_picker["tags"] == ["generated-network-host"]
              assert dashboard["templating"]["list"][0]["name"] == "host"
              assert "hostname" in dashboard["templating"]["list"][0]["query"]["query"]
              assert any("profile_uid" == p["name"] and p["hide"] == 2
                         for p in dashboard["templating"]["list"])
              if dashboard["uid"] == "homelab-mac-device-detail":
                  assert any("profile_uid" in link.get("url", "")
                             for link in dashboard["links"])
              assert not any(p["type"] in ("timeseries", "logs")
                             for p in dashboard["panels"])
              assert not any(p["title"] == "No telemetry" or
                             "CPU" in p["title"] or
                             "Memory" in p["title"]
                             for p in dashboard["panels"])
              assert "MAC" not in dashboard["title"]
              for panel in dashboard["panels"]:
                  if panel["type"] != "table":
                      continue
                  organize = next(t["options"] for t in panel["transformations"]
                                  if t["id"] == "organize")
                  for internal in ("mac", "device_key"):
                      assert organize["excludeByName"].get(internal), (
                          panel["title"], internal)
                  if panel["id"] != 18:
                      assert organize["excludeByName"].get("dashboard_uid"), (
