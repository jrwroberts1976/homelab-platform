name: Validate router-01 DHCP device pages

on:
  push:
    branches:
      - feature/router01-dhcp-device-pages-20261103
  pull_request:
    paths:
      - ".github/workflows/validate-router-dhcp-device-pages.yml"
      - "IaC/ansible/playbooks/router-01-dhcp-device-pages-*.yml"
      - "IaC/ansible/playbooks/router-01-dhcp-device-email-*.yml"
      - "IaC/ansible/roles/network_host_collector/templates/homelab-network-device-email-alert.py.j2"
      - "IaC/ansible/roles/router_dhcp_device_pages/**"
      - "docs/operations/ROUTER-DHCP-DEVICE-PAGES.md"

permissions:
  contents: read

jobs:
  router-dhcp-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible validator
        run: python3 -m pip install "PyYAML==6.0.2" "ansible-core>=2.19,<2.20"

      - name: Validate Python implementation and offline tests
        run: |
          python3 -m py_compile \
            IaC/ansible/roles/router_dhcp_device_pages/files/generate_router_dhcp_devices.py
          python3 -m py_compile \
            IaC/ansible/roles/router_dhcp_device_pages/files/audit_router_dhcp_pages.py
          python3 -m py_compile \
            IaC/ansible/roles/router_dhcp_device_pages/files/dhcp_device_email_policy.py
          python3 -m unittest discover \
            -s IaC/ansible/roles/router_dhcp_device_pages/tests -v

      - name: Validate read-only router DHCP and Loki source preflight
        run: |
          cd IaC/ansible
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-pages-preflight.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-pages-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-pages-canary.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-pages-enable.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-pages-postflight.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-email-preflight.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-email-stage.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-email-activate.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-email-test.yml --syntax-check
          ansible-playbook -i inventory/hosts.yml \
            playbooks/router-01-dhcp-device-email-postflight.yml --syntax-check

      - name: Prevent legacy collectors and unapproved deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("IaC/ansible/roles/router_dhcp_device_pages/files/generate_router_dhcp_devices.py").read_text()
          pre=Path("IaC/ansible/playbooks/router-01-dhcp-device-pages-preflight.yml").read_text()
          assert 'router-01' in p and 'DHCPACK' in p
          assert 'homelab-network-hosts' in pre or 'homelab-network-host-collector.timer' in pre
          assert 'MAC_RE' in p and 'merge_events' in p
          assert 'os_matches' in p
          assert 'no_deletions' in p
          assert '127.0.0.1:3100' in p
          assert '--apply' in p and 'max_new' in p
          assert 'ansible.builtin.file:' not in pre
          assert 'ansible.builtin.systemd_service:' not in pre
          assert 'backup: true' not in pre
          assert 'state: absent' not in pre
          assert 'router_dhcp_device_pages_enable_timer: true' not in pre

          provider = Path(
            'IaC/ansible/roles/monitoring_stack/templates/grafana-dashboard-provider.yml.j2'
          ).read_text()
          canary = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-pages-canary.yml'
          ).read_text()
          stage = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-pages-stage.yml'
          ).read_text()
          enable = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-pages-enable.yml'
          ).read_text()
          postflight = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-pages-postflight.yml'
          ).read_text()
          audit = Path(
            'IaC/ansible/roles/router_dhcp_device_pages/files/audit_router_dhcp_pages.py'
          ).read_text()
          assert 'monitoring_router_dhcp_device_pages_provider_enabled | default(false)' in provider
          assert 'folderUid: router-dhcp-devices' in provider
          assert 'disableDeletion: true' in provider
          assert 'CREATE_ONE_ROUTER_DHCP_DEVICE_PAGE' in canary
          assert 'monitoring_router_dhcp_device_pages_provider_enabled: true' in canary
          assert "lookup('ansible.builtin.template'" in canary
          assert 'router_dhcp_device_pages_canary_approved' in canary
          assert "'1'" in canary
          assert 'router_dhcp_device_pages_stage_approved' in stage
          assert 'router-dhcp-device-pages.timer' in stage
          assert 'state: started' not in stage
          assert 'ENABLE_ROUTER_DHCP_DEVICE_PAGES' in enable
          assert 'enabled: true' in enable
          assert 'retained_uid_sha256' not in audit or 'EXPECTED_16_HASH' in audit
          assert 'protected_uid_fingerprint_verified' in audit
          assert 'router_dhcp_state_postflight' in postflight
          assert 'homelab-network-host-collector.timer' in postflight

          mail_preflight = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-email-preflight.yml'
          ).read_text()
          assert 'NETWORK_DEVICE_ALERT_TO' in mail_preflight
          assert 'alerted-macs.json' in mail_preflight
          assert 'router-dhcp-device-pages.json' in mail_preflight
          assert 'mail_relay_01_smtp_greeting_ok' in mail_preflight
          assert 'test_email_sent' in mail_preflight
          assert 'ROUTER_DHCP_DEVICE_CANARY' not in mail_preflight
          assert 'ansible.builtin.systemd_service:' not in mail_preflight
          assert 'ansible.builtin.file:' not in mail_preflight
          assert 'ansible.builtin.template:' not in mail_preflight
          assert 'ansible.builtin.copy:' not in mail_preflight
          assert 'import smtplib' not in mail_preflight
          assert 'send_message(' not in mail_preflight

          mailer_template = Path(
            'IaC/ansible/roles/network_host_collector/templates/homelab-network-device-email-alert.py.j2'
          ).read_text()
          policy = Path(
            'IaC/ansible/roles/router_dhcp_device_pages/files/dhcp_device_email_policy.py'
          ).read_text()
          mail_stage = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-email-stage.yml'
          ).read_text()
          mail_activate = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-email-activate.yml'
          ).read_text()
          mail_test = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-email-test.yml'
          ).read_text()
          assert 'DHCP_EMAIL_MARKER' in mailer_template
          assert 'dhcp_device_email_policy import from_files' in mailer_template
          assert "save_atomic(REGISTRY_FILE, registry)" in mailer_template
          assert 'network_device_alert_preview' in mailer_template
          assert 'Pending identification' in policy
          assert 'first <= start' in policy
          assert 'if mac in already_known:' in policy
          assert 'router_dhcp_email_stage_approved' in mail_stage
          assert 'homelab-network-device-email-alert-dhcp-candidate' in mail_stage
          assert 'dhcp_email_ledger' in mail_stage
          assert 'router_dhcp_email_activate_approved' in mail_activate
          assert 'ENABLE_SHARED_MAC_DHCP_EMAIL_ALERTS' in mail_activate
          assert 'activated_at_ns' in mail_activate
          assert '--preview' in mail_activate
          assert 'SEND_ONE_ROUTER_DHCP_ALERT_TEST_EMAIL' in mail_test
          assert 'router_dhcp_email_test_approved' in mail_test
          assert 'router-dhcp-alerts.enabled.json' in enable
          assert 'homelab-network-host-collector.timer' in enable
          assert 'smtplib' not in p

          email_postflight = Path(
            'IaC/ansible/playbooks/router-01-dhcp-device-email-postflight.yml'
          ).read_text()
          assert 'activated_at_ns' in email_postflight
          assert '--preview' in email_postflight
          assert 'shared_first_seen_registry_count' in email_postflight
          assert 'network_device_alert_test_sent' not in email_postflight
          assert 'ansible.builtin.copy:' not in email_postflight
          assert 'ansible.builtin.file:' not in email_postflight
          assert 'ansible.builtin.systemd_service:' not in email_postflight
          assert 'ansible.builtin.template:' not in email_postflight
          PY
