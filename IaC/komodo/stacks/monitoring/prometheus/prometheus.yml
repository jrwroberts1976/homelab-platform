global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox:9115

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: node-exporter
    static_configs:
      - targets:
          - "192.168.2.48:9100"
        labels:
          target_name: "admin-01"
      - targets:
          - "192.168.2.50:9100"
        labels:
          target_name: "dns-02"
      - targets:
          - "192.168.2.51:9100"
        labels:
          target_name: "dns-01"
      - targets:
          - "192.168.2.52:9100"
        labels:
          target_name: "monitor-01"
      - targets:
          - "192.168.2.53:9100"
        labels:
          target_name: "cloud-01"
      - targets:
          - "192.168.2.54:9100"
        labels:
          target_name: "mail-relay-01"
      - targets:
          - "192.168.2.55:9100"
        labels:
          target_name: "sensor-01"
      - targets:
          - "192.168.2.56:9100"
        labels:
          target_name: "edge-01"
      - targets:
          - "192.168.2.70:9100"
        labels:
          target_name: "PROXMOX"
      - targets:
          - "192.168.2.71:9100"
        labels:
          target_name: "Proxmox-2"
      - targets:
          - "192.168.2.195:9100"
        labels:
          target_name: "media-01"
      - targets:
          - "192.168.2.220:9100"
        labels:
          target_name: "docker-01"

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module:
        - icmp
    static_configs:
      - targets:
          - "192.168.2.1"
        labels:
          target_name: "router"
      - targets:
          - "192.168.2.48"
        labels:
          target_name: "admin-01"
      - targets:
          - "192.168.2.50"
        labels:
          target_name: "dns-02"
      - targets:
          - "192.168.2.51"
        labels:
          target_name: "dns-01"
      - targets:
          - "192.168.2.52"
        labels:
          target_name: "monitor-01"
      - targets:
          - "192.168.2.53"
        labels:
          target_name: "cloud-01"
      - targets:
          - "192.168.2.54"
        labels:
          target_name: "mail-relay-01"
      - targets:
          - "192.168.2.55"
        labels:
          target_name: "sensor-01"
      - targets:
          - "192.168.2.56"
        labels:
          target_name: "edge-01"
      - targets:
          - "192.168.2.70"
        labels:
          target_name: "PROXMOX"
      - targets:
          - "192.168.2.71"
        labels:
          target_name: "Proxmox-2"
      - targets:
          - "192.168.2.195"
        labels:
          target_name: "media-01"
      - targets:
          - "192.168.2.220"
        labels:
          target_name: "docker-01"
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-pve-https
    metrics_path: /probe
    params:
      module:
        - http_2xx_insecure
    static_configs:
      - targets:
          - "https://192.168.2.70:8006/"
        labels:
          target_name: "PROXMOX"
      - targets:
          - "https://192.168.2.71:8006/"
        labels:
          target_name: "Proxmox-2"
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-dns-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - "192.168.2.50:53"
        labels:
          target_name: "dns-02"
      - targets:
          - "192.168.2.51:53"
        labels:
          target_name: "dns-01"
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
