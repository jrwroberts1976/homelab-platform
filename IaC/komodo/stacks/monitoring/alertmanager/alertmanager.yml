global:
  smtp_smarthost: "192.168.2.54:25"
  smtp_from: "jrwroberts1976@gmail.com"
  smtp_require_tls: false

route:
  receiver: gmail-email
  group_by:
    - alertname
    - target_name
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: gmail-email
    email_configs:
      - to: "jrwroberts1976@gmail.com"
        send_resolved: true
        headers:
          subject: "[homelab] {{ .Status }}: {{ .CommonAnnotations.summary }}"
