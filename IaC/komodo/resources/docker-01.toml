[[deployment]]
name = "birdnet-go"
description = "BirdNET-Go on docker-01. Existing Compose workload; declared in Komodo for controlled migration to Komodo management."
deploy = false

[deployment.config]
server = "docker-01"
image = { type = "Image", params = { image = "ghcr.io/tphakala/birdnet-go:20260823" } }
restart = "unless-stopped"
ports = "8080:8080"
volumes = """
/opt/birdnet-go/config:/config
/opt/birdnet-go/data:/data
"""
environment = """
BIRDNET_UID=1000
BIRDNET_GID=1000
TZ=Europe/London
"""
extra_args = [
  "--device=/dev/snd:/dev/snd"
]
poll_for_updates = true
auto_update = false
send_alerts = true
