---
- name: Enable QoS metrics through existing router node exporter
  hosts: router-01
  gather_facts: true
  become: true
  tasks:
    - name: Check identity and approval
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'router-01'
          - ansible_facts.hostname == 'raspberrypi'
          - "'192.168.2.1' in ansible_facts.all_ipv4_addresses"
          - router_qos_metrics_approved | default(false) | bool
          - not ansible_check_mode
    - name: Check existing node exporter override before modifying
      ansible.builtin.slurp:
        src: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
      register: exporter_override
    - name: Refuse unexpected exporter service configuration
      ansible.builtin.assert:
        that:
          - "(exporter_override.content | b64decode | trim) == '[Service]\nExecStart=\nExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=127.0.0.1:9100'"
    - name: Verify textfile directory
      ansible.builtin.stat:
        path: /var/lib/prometheus/node-exporter
      register: textdir
    - name: Require existing textfile directory
      ansible.builtin.assert:
        that:
          - textdir.stat.isdir | default(false)
          - not (textdir.stat.islnk | default(false))
    - name: Install read-only collector
      ansible.builtin.copy:
        src: ../files/router-qos-prometheus-collector.py
        dest: /usr/local/libexec/router-qos-prometheus-collector.py
        owner: root
        group: root
        mode: '0755'
    - name: Collect first sample before enabling exporter textfile support
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/libexec/router-qos-prometheus-collector.py
          - --output-dir
          - /var/lib/prometheus/node-exporter
      changed_when: false
    - name: Install collector service and timer
      ansible.builtin.copy:
        src: "../files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - router-qos-metrics.service
        - router-qos-metrics.timer
      register: qos_units
    - name: Replace only existing exporter override
      ansible.builtin.copy:
        src: ../files/router-qos-node-exporter-override.conf
        dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
        backup: true
      register: exporter_change
    - name: Reload unit configuration
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Restart exporter to load textfile directory
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        state: restarted
      when: exporter_change.changed
    - name: Start metrics timer
      ansible.builtin.systemd_service:
        name: router-qos-metrics.timer
        enabled: true
        state: started
    - name: Verify exported QoS metrics
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsS --max-time 10 http://127.0.0.1:9100/metrics |
          grep '^homelab_router_qos_collection_success 1$'
      args:
        executable: /bin/bash
      changed_when: false
    - name: Report status
      ansible.builtin.debug:
        msg: "QoS textfile collection enabled; current traffic shaping and PPP services untouched."
