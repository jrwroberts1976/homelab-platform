---
- name: Update collector DHCP hostname fallback
  hosts: monitoring_hosts
  become: true
  gather_facts: false

  vars_files:
    - ../roles/network_host_collector/defaults/main.yml

  tasks:
    - name: Require monitor-01
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'

    - name: Update collector script
      vars:
        network_host_collector_interface: eth0
      ansible.builtin.template:
        src: ../roles/network_host_collector/templates/homelab-network-host-collector.py.j2
        dest: "{{ network_host_collector_script }}"
        owner: root
        group: root
        mode: '0755'
        backup: true
