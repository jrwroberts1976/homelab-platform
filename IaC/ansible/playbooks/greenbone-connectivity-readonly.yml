---
# Read-only diagnostics for Greenbone availability while Proxmox-2 is reported down.
# Uses admin-01 and surviving PROXMOX. Does not connect to the offline node via SSH.
# No guest start/stop/migrate/reboot or network changes.
- name: Check Proxmox nodes and Greenbone reachability from admin-01
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Probe SSH ports without changing network state
      ansible.builtin.wait_for:
        host: "{{ item.address }}"
        port: 22
        state: started
        connect_timeout: 2
        timeout: 5
      loop:
        - { label: "PROXMOX", address: "{{ hostvars['PROXMOX']['ansible_host'] }}" }
        - { label: "Proxmox-2", address: "{{ hostvars['Proxmox-2']['ansible_host'] }}" }
        - { label: "greenbone-01", address: "{{ hostvars['greenbone-01']['ansible_host'] }}" }
      loop_control:
        label: "{{ item.label }}"
      register: greenbone_connectivity_ssh
      changed_when: false
      failed_when: false

    - name: Show controller-side SSH reachability
      ansible.builtin.debug:
        msg: >-
          {{ item.item.label }} {{ item.item.address }} TCP/22:
          {{ 'OPEN' if not item.failed | default(false) else 'UNREACHABLE/TIMED OUT' }}
          ({{ item.msg | default('connection established') }})
      loop: "{{ greenbone_connectivity_ssh.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Check local QNetd service state without changing it
      ansible.builtin.command:
        argv: [systemctl, is-active, corosync-qnetd]
      register: greenbone_connectivity_qnetd
      failed_when: false
      changed_when: false

    - name: Show QNetd service state
      ansible.builtin.debug:
        msg: "admin-01 corosync-qnetd state: {{ greenbone_connectivity_qnetd.stdout | default('unknown') }} (rc={{ greenbone_connectivity_qnetd.rc }})"

- name: Inspect surviving PROXMOX node and its cluster view
  hosts: PROXMOX
  become: true
  gather_facts: false

  tasks:
    - name: Check cluster quorum including QDevice
      ansible.builtin.command:
        argv: [pvecm, status]
      register: greenbone_connectivity_quorum
      changed_when: false
      failed_when: false

    - name: Inspect cluster-reported node states
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, node]
      register: greenbone_connectivity_nodes
      changed_when: false
      failed_when: false

    - name: Inspect cluster-reported VM and LXC states
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm]
      register: greenbone_connectivity_guests
      changed_when: false
      failed_when: false

    - name: Show read-only Proxmox cluster diagnostics
      ansible.builtin.debug:
        msg:
          - "pvecm status rc={{ greenbone_connectivity_quorum.rc }}: {{ greenbone_connectivity_quorum.stdout_lines | default([]) }}"
          - "cluster node inventory rc={{ greenbone_connectivity_nodes.rc }}: {{ greenbone_connectivity_nodes.stdout_lines | default([]) }}"
          - "cluster guest inventory rc={{ greenbone_connectivity_guests.rc }}: {{ greenbone_connectivity_guests.stdout_lines | default([]) }}"
          - "These queries do not start or move guests; guest disks are node-local."
