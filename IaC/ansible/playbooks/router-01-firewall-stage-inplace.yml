---
# STAGING ONLY: do not change running nftables/iptables, forwarding sysctl,
# Docker, LAN IP, Kea, Unbound or live PPPoE service. Prepare files for
# separately approved .3.1/24 physical LAN cutover.
- name: Stage router ppp0 NAT firewall and forwarding, WITHOUT activating
  hosts: docker-01
  gather_facts: false
  become: true
  vars:
    router_firewall_stage_approved: false
    router_stage_dir: /var/lib/router-01-stage/forwarding
  pre_tasks:
    - name: Require explicit controller approval before any SSH
      ansible.builtin.assert:
        that:
          - router_firewall_stage_approved | bool
          - inventory_hostname == 'docker-01'
          - ansible_host == '192.168.2.220'
        fail_msg: "No firewall staging approved; refusing before SSH."
      delegate_to: localhost
      become: false

    - name: Collect current Pi facts
      ansible.builtin.setup:

    - name: Verify original SSH LAN still exists, before any staging
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'docker-01'
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - "'192.168.2.220' in ansible_facts.all_ipv4_addresses"
          - (ansible_facts.get('eth0', {}).get('macaddress', '') | lower) == 'd8:3a:dd:5a:51:44'
          - (ansible_facts.get('eth1', {}).get('macaddress', '') | lower) == '00:24:9b:63:b3:8a'

    - name: Verify PPPoE WAN is currently authenticated
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, ppp0]
      register: router_staged_ppp_ipv4
      changed_when: false
      failed_when: "'inet ' not in router_staged_ppp_ipv4.stdout"

    - name: Verify Kea and Unbound are both MASKED on old ASUS LAN
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "{{ item }}"]
      loop: [kea-dhcp4-server.service, unbound.service]
      register: router_staged_service_mask
      changed_when: false
      failed_when: router_staged_service_mask.stdout | trim != 'masked'

  tasks:
    - name: Ensure nftables binaries are available without activating service
      ansible.builtin.apt:
        name: nftables
        state: present
        policy_rc_d: 101

    - name: Create private directory for NOT YET ACTIVE router firewall
      ansible.builtin.file:
        path: "{{ router_stage_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Render the future isolated router nftables rules (STAGE ONLY)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../router-01/templates/nftables-pppoe-inplace.conf.j2"
        dest: "{{ router_stage_dir }}/nftables.conf"
        owner: root
        group: root
        mode: '0600'

    - name: Syntax-check STAGED nftables; do not load it
      ansible.builtin.command:
        argv: [/usr/sbin/nft, -c, -f, "{{ router_stage_dir }}/nftables.conf"]
      changed_when: false

    - name: Prepare OFFLINE forwarding sysctl for future activated router
      ansible.builtin.copy:
        dest: "{{ router_stage_dir }}/90-router-01-forwarding.conf"
        content: "net.ipv4.ip_forward=1\n"
        owner: root
        group: root
        mode: '0600'

    - name: Confirm management LAN SSH IP survived stage
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, eth0]
      register: router_stage_lan_now
      changed_when: false
      failed_when: "'192.168.2.220/24' not in router_stage_lan_now.stdout"

    - name: Report stage, NOT NAT activation
      ansible.builtin.debug:
        msg:
          - "PASS: Future nftables NAT/firewall + ip_forward=1 files staged, NOT LOADED."
          - "ppp0 already authenticated; Kea/Unbound still MASKED."
          - "Docker and existing iptables/nftables runtime were NOT CHANGED."
          - "Original SSH 192.168.2.220 on eth0 preserved."
          - "Do not load staged full ruleset until Docker retired and eth0 is isolated on new .3 LAN."
