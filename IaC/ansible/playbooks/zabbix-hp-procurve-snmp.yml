---
- name: Manage HP ProCurve SNMP monitoring in Zabbix
  hosts: monitor-01
  become: true
  gather_facts: false

  vars:
    zabbix_api_url: "http://192.168.2.59:8080/api_jsonrpc.php"

    zabbix_hp_snmp_allow_deploy: false

    zabbix_hp_snmp_group_name: "Homelab/Network"
    zabbix_hp_snmp_template_group_name: "Templates/Homelab"

    zabbix_hp_snmp_reporting_user_group: "Homelab Reporting"
    zabbix_hp_snmp_reporting_permission: 2

    zabbix_hp_snmp_template_name: "Homelab HP ProCurve SNMP"
    zabbix_hp_snmp_template_host: "Homelab HP ProCurve SNMP"

    zabbix_hp_snmp_host: "hp-switch"
    zabbix_hp_snmp_visible_name: "HP ProCurve 2510G-24"
    zabbix_hp_snmp_address: "192.168.2.16"
    zabbix_hp_snmp_port: "161"

    zabbix_hp_snmp_community_macro: "{$SNMP_COMMUNITY}"

    zabbix_hp_snmp_port_walk_key: "hp.snmp.port.walk"
    zabbix_hp_snmp_port_discovery_key: "hp.snmp.port.discovery"

    zabbix_hp_snmp_lld_index_macro: >-
      {{ '{' ~ '#' ~ 'SNMPINDEX' ~ '}' }}
    zabbix_hp_snmp_lld_descr_macro: >-
      {{ '{' ~ '#' ~ 'IFDESCR' ~ '}' }}

    zabbix_hp_snmp_port_walk_oids:
      # ifDescr
      - "1.3.6.1.2.1.2.2.1.2"
      # ifAdminStatus
      - "1.3.6.1.2.1.2.2.1.7"
      # ifOperStatus
      - "1.3.6.1.2.1.2.2.1.8"
      # ifSpeed
      - "1.3.6.1.2.1.2.2.1.5"
      # ifHCInOctets
      - "1.3.6.1.2.1.31.1.1.1.6"
      # ifHCOutOctets
      - "1.3.6.1.2.1.31.1.1.1.10"
      # ifInErrors
      - "1.3.6.1.2.1.2.2.1.14"
      # ifOutErrors
      - "1.3.6.1.2.1.2.2.1.20"
      # ifInDiscards
      - "1.3.6.1.2.1.2.2.1.13"
      # ifOutDiscards
      - "1.3.6.1.2.1.2.2.1.19"

    zabbix_hp_snmp_port_metric_prototypes:
      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          administrative status
        key: >-
          hp.snmp.port.admin[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 3
        units: ""
        history: "30d"
        trends: "0"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.2.2.1.7.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          operational status
        key: >-
          hp.snmp.port.oper[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 3
        units: ""
        history: "30d"
        trends: "0"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.2.2.1.8.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          interface speed
        key: >-
          hp.snmp.port.speed[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 3
        units: "bps"
        history: "30d"
        trends: "365d"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.2.2.1.5.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          received traffic
        key: >-
          hp.snmp.port.rx[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 0
        units: "bps"
        history: "30d"
        trends: "365d"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.31.1.1.1.6.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""
          - type: 10
            params: ""
            error_handler: 0
            error_handler_params: ""
          - type: 1
            params: "8"
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          transmitted traffic
        key: >-
          hp.snmp.port.tx[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 0
        units: "bps"
        history: "30d"
        trends: "365d"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.31.1.1.1.10.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""
          - type: 10
            params: ""
            error_handler: 0
            error_handler_params: ""
          - type: 1
            params: "8"
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          receive errors
        key: >-
          hp.snmp.port.rx.errors[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 0
        units: "pps"
        history: "30d"
        trends: "365d"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.2.2.1.14.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""
          - type: 10
            params: ""
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          transmit errors
        key: >-
          hp.snmp.port.tx.errors[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 0
        units: "pps"
        history: "30d"
        trends: "365d"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.2.2.1.20.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""
          - type: 10
            params: ""
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          receive discards
        key: >-
          hp.snmp.port.rx.discards[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 0
        units: "pps"
        history: "30d"
        trends: "365d"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.2.2.1.13.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""
          - type: 10
            params: ""
            error_handler: 0
            error_handler_params: ""

      - name: >-
          Port {{ zabbix_hp_snmp_lld_index_macro }}:
          transmit discards
        key: >-
          hp.snmp.port.tx.discards[
          {{- zabbix_hp_snmp_lld_index_macro -}}
          ]
        value_type: 0
        units: "pps"
        history: "30d"
        trends: "365d"
        preprocessing:
          - type: 28
            params: |-
              1.3.6.1.2.1.2.2.1.19.{{ zabbix_hp_snmp_lld_index_macro }}
              0
            error_handler: 0
            error_handler_params: ""
          - type: 10
            params: ""
            error_handler: 0
            error_handler_params: ""

    # Ports proven to be persistent infrastructure/device links.
    # Port 2 is deliberately excluded until its attached device
    # is positively identified.
    zabbix_hp_snmp_expected_link_ports:
      - "1"
      - "5"
      - "9"
      - "13"
      - "15"
      - "18"
      - "20"
      - "21"
      - "23"
      - "24"

    zabbix_hp_snmp_expected_link_regex: >-
      ^(?:{{ zabbix_hp_snmp_expected_link_ports | join('|') }})$

    zabbix_hp_snmp_link_trigger_name: >-
      Port {{ zabbix_hp_snmp_lld_index_macro }}:
      expected link is down for 5 minutes

    zabbix_hp_snmp_link_trigger_expression: >-
      min(/{{ zabbix_hp_snmp_template_host }}/hp.snmp.port.oper[{{ zabbix_hp_snmp_lld_index_macro }}],5m)<>1

    # Zabbix priority 3 = Average.
    zabbix_hp_snmp_link_trigger_priority: 3

    zabbix_hp_snmp_link_override_name: >-
      Enable expected persistent port link alerts

    zabbix_hp_snmp_value_maps:
      - key: "admin"
        name: "IF-MIB administrative status"
        mappings:
          - type: "0"
            value: "1"
            newvalue: "UP"
          - type: "0"
            value: "2"
            newvalue: "DOWN"
          - type: "0"
            value: "3"
            newvalue: "TESTING"

      - key: "oper"
        name: "IF-MIB operational status"
        mappings:
          - type: "0"
            value: "1"
            newvalue: "UP"
          - type: "0"
            value: "2"
            newvalue: "DOWN"
          - type: "0"
            value: "3"
            newvalue: "TESTING"
          - type: "0"
            value: "4"
            newvalue: "UNKNOWN"
          - type: "0"
            value: "5"
            newvalue: "DORMANT"
          - type: "0"
            value: "6"
            newvalue: "NOT PRESENT"
          - type: "0"
            value: "7"
            newvalue: "LOWER LAYER DOWN"

    zabbix_api_token: >-
      {{
        lookup(
          'ansible.builtin.env',
          'HOMELAB_ZABBIX_API_TOKEN'
        )
        | default('', true)
      }}

  pre_tasks:
    - name: Require explicit deployment approval
      ansible.builtin.assert:
        that:
          - zabbix_hp_snmp_allow_deploy | bool
        fail_msg: >-
          Deployment is disabled. Set
          zabbix_hp_snmp_allow_deploy=true explicitly.

    - name: Require privileged runtime Zabbix API token
      ansible.builtin.assert:
        that:
          - zabbix_api_token | length >= 20
        fail_msg: >-
          HOMELAB_ZABBIX_API_TOKEN must contain a privileged
          runtime Zabbix API token.
      no_log: true

    - name: Read protected existing HP switch SNMP community
      ansible.builtin.shell: |
        set -e
        test -f /etc/homelab-switch-collector/snmp/snmp.conf
        sed -n \
          's/^defCommunity[[:space:]]*//p' \
          /etc/homelab-switch-collector/snmp/snmp.conf |
          head -n 1
      args:
        executable: /bin/bash
      register: zabbix_hp_snmp_existing_community
      changed_when: false
      no_log: true

    - name: Require protected SNMP community
      ansible.builtin.assert:
        that:
          - >-
            zabbix_hp_snmp_existing_community.stdout
            | default('')
            | length > 0
        fail_msg: >-
          Existing protected HP switch SNMP community could
          not be read from monitor-01.
      no_log: true

  tasks:
    - name: Read target host group
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            output:
              - groupid
              - name
            filter:
              name:
                - "{{ zabbix_hp_snmp_group_name }}"
          id: 1
        return_content: true
      register: _network_group
      no_log: true

    - name: Create target host group when absent
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.create
          params:
            name: "{{ zabbix_hp_snmp_group_name }}"
          id: 2
        return_content: true
      register: _network_group_create
      when: (_network_group.content | from_json).result | length == 0
      changed_when: true
      failed_when: >-
        (_network_group_create.content | from_json).error is defined
      no_log: true

    - name: Read final target host group
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            output:
              - groupid
              - name
            filter:
              name:
                - "{{ zabbix_hp_snmp_group_name }}"
          id: 3
        return_content: true
      register: _network_group_final
      no_log: true

    - name: Require exactly one target host group
      ansible.builtin.assert:
        that:
          - (_network_group_final.content | from_json).result | length == 1
        fail_msg: >-
          Expected exactly one {{ zabbix_hp_snmp_group_name }}
          host group.

    - name: Set target host group ID
      ansible.builtin.set_fact:
        _network_group_id: >-
          {{
            (_network_group_final.content | from_json).result[0].groupid
          }}

    - name: Read reporting user group rights
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: usergroup.get
          params:
            output:
              - usrgrpid
              - name
            filter:
              name:
                - "{{ zabbix_hp_snmp_reporting_user_group }}"
            selectHostGroupRights: extend
            selectTemplateGroupRights: extend
          id: 101
        return_content: true
      register: _reporting_user_group
      no_log: true

    - name: Require exactly one reporting user group
      ansible.builtin.assert:
        that:
          - >-
            (_reporting_user_group.content | from_json).result
            | length == 1
        fail_msg: >-
          Expected exactly one
          {{ zabbix_hp_snmp_reporting_user_group }}
          user group.
      no_log: true

    - name: Resolve current reporting host-group permission
      ansible.builtin.set_fact:
        _reporting_current_network_right: >-
          {{
            (
              (_reporting_user_group.content | from_json)
              .result[0].hostgroup_rights
              | selectattr(
                  'id',
                  'equalto',
                  _network_group_id
                )
              | list
              | first
            )
            | default({})
          }}
        _reporting_hostgroup_rights_merged: >-
          {{
            (
              (_reporting_user_group.content | from_json)
              .result[0].hostgroup_rights
              | rejectattr(
                  'id',
                  'equalto',
                  _network_group_id
                )
              | list
            )
            +
            [
              {
                'id': _network_group_id,
                'permission':
                  zabbix_hp_snmp_reporting_permission
              }
            ]
          }}
      no_log: true

    - name: Ensure reporting group has read-only network access
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: usergroup.update
          params:
            usrgrpid: >-
              {{
                (_reporting_user_group.content | from_json)
                .result[0].usrgrpid
              }}
            hostgroup_rights: >-
              {{
                _reporting_hostgroup_rights_merged
              }}
          id: 102
        return_content: true
      register: _reporting_user_group_update
      when: >-
        (
          _reporting_current_network_right.permission
          | default(0)
          | int
        )
        !=
        (zabbix_hp_snmp_reporting_permission | int)
      changed_when: true
      failed_when: >-
        (_reporting_user_group_update.content | from_json).error
        is defined
      no_log: true

    - name: Read final reporting user group rights
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: usergroup.get
          params:
            output:
              - usrgrpid
              - name
            filter:
              name:
                - "{{ zabbix_hp_snmp_reporting_user_group }}"
            selectHostGroupRights: extend
            selectTemplateGroupRights: extend
          id: 103
        return_content: true
      register: _reporting_user_group_final
      no_log: true

    - name: Require reporting read access to Homelab Network
      ansible.builtin.assert:
        that:
          - >-
            (
              (_reporting_user_group_final.content | from_json)
              .result[0].hostgroup_rights
              | selectattr(
                  'id',
                  'equalto',
                  _network_group_id
                )
              | map(attribute='permission')
              | map('int')
              | list
            )
            ==
            [
              zabbix_hp_snmp_reporting_permission | int
            ]
        fail_msg: >-
          Homelab Reporting does not have the required
          read-only access to Homelab/Network.
      no_log: true

    - name: Read target template group
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: templategroup.get
          params:
            output:
              - groupid
              - name
            filter:
              name:
                - "{{ zabbix_hp_snmp_template_group_name }}"
          id: 4
        return_content: true
      register: _template_group
      no_log: true

    - name: Create target template group when absent
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: templategroup.create
          params:
            name: "{{ zabbix_hp_snmp_template_group_name }}"
          id: 5
        return_content: true
      register: _template_group_create
      when: (_template_group.content | from_json).result | length == 0
      changed_when: true
      failed_when: >-
        (_template_group_create.content | from_json).error is defined
      no_log: true

    - name: Read final target template group
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: templategroup.get
          params:
            output:
              - groupid
              - name
            filter:
              name:
                - "{{ zabbix_hp_snmp_template_group_name }}"
          id: 8
        return_content: true
      register: _template_group_final
      no_log: true

    - name: Require exactly one target template group
      ansible.builtin.assert:
        that:
          - (_template_group_final.content | from_json).result | length == 1
        fail_msg: >-
          Expected exactly one
          {{ zabbix_hp_snmp_template_group_name }}
          template group.

    - name: Set target template group ID
      ansible.builtin.set_fact:
        _template_group_id: >-
          {{
            (_template_group_final.content | from_json).result[0].groupid
          }}

    - name: Resolve current reporting template-group permission
      ansible.builtin.set_fact:
        _reporting_current_template_right: >-
          {{
            (
              (_reporting_user_group_final.content | from_json)
              .result[0].templategroup_rights
              | selectattr(
                  'id',
                  'equalto',
                  _template_group_id
                )
              | list
              | first
            )
            | default({})
          }}
        _reporting_template_group_rights_merged: >-
          {{
            (
              (_reporting_user_group_final.content | from_json)
              .result[0].templategroup_rights
              | rejectattr(
                  'id',
                  'equalto',
                  _template_group_id
                )
              | list
            )
            +
            [
              {
                'id': _template_group_id,
                'permission':
                  zabbix_hp_snmp_reporting_permission
              }
            ]
          }}
      no_log: true

    - name: Ensure reporting group has read-only template access
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: usergroup.update
          params:
            usrgrpid: >-
              {{
                (_reporting_user_group_final.content | from_json)
                .result[0].usrgrpid
              }}
            templategroup_rights: >-
              {{
                _reporting_template_group_rights_merged
              }}
          id: 104
        return_content: true
      register: _reporting_template_group_update
      when: >-
        (
          _reporting_current_template_right.permission
          | default(0)
          | int
        )
        !=
        (zabbix_hp_snmp_reporting_permission | int)
      changed_when: true
      failed_when: >-
        (_reporting_template_group_update.content | from_json).error
        is defined
      no_log: true

    - name: Read final reporting template-group rights
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: usergroup.get
          params:
            output:
              - usrgrpid
              - name
            filter:
              name:
                - "{{ zabbix_hp_snmp_reporting_user_group }}"
            selectTemplateGroupRights: extend
          id: 105
        return_content: true
      register: _reporting_template_group_final
      no_log: true

    - name: Require reporting read access to Homelab templates
      ansible.builtin.assert:
        that:
          - >-
            (
              (_reporting_template_group_final.content | from_json)
              .result[0].templategroup_rights
              | selectattr(
                  'id',
                  'equalto',
                  _template_group_id
                )
              | map(attribute='permission')
              | map('int')
              | list
            )
            ==
            [
              zabbix_hp_snmp_reporting_permission | int
            ]
        fail_msg: >-
          Homelab Reporting does not have the required
          read-only access to Templates/Homelab.
      no_log: true

    - name: Read HP ProCurve SNMP template
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: template.get
          params:
            output:
              - templateid
              - host
              - name
            filter:
              host:
                - "{{ zabbix_hp_snmp_template_host }}"
          id: 4
        return_content: true
      register: _snmp_template
      no_log: true

    - name: Create HP ProCurve SNMP template when absent
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: template.create
          params:
            host: "{{ zabbix_hp_snmp_template_host }}"
            name: "{{ zabbix_hp_snmp_template_name }}"
            groups:
              - groupid: "{{ _template_group_id }}"
          id: 9
        return_content: true
      register: _snmp_template_create
      when: (_snmp_template.content | from_json).result | length == 0
      changed_when: true
      failed_when: >-
        (_snmp_template_create.content | from_json).error is defined
      no_log: true

    - name: Read final HP ProCurve SNMP template
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: template.get
          params:
            output:
              - templateid
              - host
              - name
            filter:
              host:
                - "{{ zabbix_hp_snmp_template_host }}"
          id: 6
        return_content: true
      register: _snmp_template_final
      no_log: true

    - name: Require exactly one HP ProCurve SNMP template
      ansible.builtin.assert:
        that:
          - (_snmp_template_final.content | from_json).result | length == 1

    - name: Set HP ProCurve template ID
      ansible.builtin.set_fact:
        _snmp_template_id: >-
          {{
            (_snmp_template_final.content | from_json).result[0].templateid
          }}

    - name: Read HP ProCurve template value maps
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: valuemap.get
          params:
            hostids:
              - "{{ _snmp_template_id }}"
            output:
              - valuemapid
              - name
            selectMappings:
              - type
              - value
              - newvalue
          id: 501
        return_content: true
      register: _hp_value_maps
      no_log: true

    - name: Create missing HP ProCurve value maps
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: valuemap.create
          params:
            hostid: "{{ _snmp_template_id }}"
            name: "{{ item.name }}"
            mappings: "{{ item.mappings }}"
          id: 502
        return_content: true
      loop: "{{ zabbix_hp_snmp_value_maps }}"
      loop_control:
        label: "{{ item.name }}"
      register: _hp_value_map_create
      when: >-
        item.name not in
        (
          (_hp_value_maps.content | from_json).result
          | map(attribute='name')
          | list
        )
      changed_when: true
      failed_when: >-
        (_hp_value_map_create.content | from_json).error
        is defined
      no_log: true

    - name: Read HP ProCurve value maps after creation
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: valuemap.get
          params:
            hostids:
              - "{{ _snmp_template_id }}"
            output:
              - valuemapid
              - name
            selectMappings:
              - type
              - value
              - newvalue
          id: 503
        return_content: true
      register: _hp_value_maps_created
      no_log: true

    - name: Reconcile HP ProCurve value-map mappings
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: valuemap.update
          params:
            valuemapid: >-
              {{
                (
                  (_hp_value_maps_created.content | from_json).result
                  | selectattr('name', 'equalto', item.name)
                  | first
                ).valuemapid
              }}
            name: "{{ item.name }}"
            mappings: "{{ item.mappings }}"
          id: 504
        return_content: true
      loop: "{{ zabbix_hp_snmp_value_maps }}"
      loop_control:
        label: "{{ item.name }}"
      register: _hp_value_map_update
      when: >-
        (
          (
            (_hp_value_maps_created.content | from_json).result
            | selectattr('name', 'equalto', item.name)
            | first
          ).mappings
        )
        !=
        item.mappings
      changed_when: true
      failed_when: >-
        (_hp_value_map_update.content | from_json).error
        is defined
      no_log: true

    - name: Read final HP ProCurve template value maps
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: valuemap.get
          params:
            hostids:
              - "{{ _snmp_template_id }}"
            output:
              - valuemapid
              - name
            selectMappings:
              - type
              - value
              - newvalue
          id: 505
        return_content: true
      register: _hp_value_maps_final
      no_log: true

    - name: Require exact HP ProCurve value maps
      ansible.builtin.assert:
        that:
          - >-
            (
              (_hp_value_maps_final.content | from_json).result
              | selectattr('name', 'equalto', item.name)
              | list
              | length
            ) == 1
          - >-
            (
              (
                (_hp_value_maps_final.content | from_json).result
                | selectattr('name', 'equalto', item.name)
                | first
              ).mappings
            )
            ==
            item.mappings
        fail_msg: >-
          HP ProCurve value map {{ item.name }} does not
          match the IaC definition.
      loop: "{{ zabbix_hp_snmp_value_maps }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Resolve HP ProCurve value-map IDs
      ansible.builtin.set_fact:
        _hp_admin_valuemap_id: >-
          {{
            (
              (_hp_value_maps_final.content | from_json).result
              | selectattr(
                  'name',
                  'equalto',
                  'IF-MIB administrative status'
                )
              | first
            ).valuemapid
          }}
        _hp_oper_valuemap_id: >-
          {{
            (
              (_hp_value_maps_final.content | from_json).result
              | selectattr(
                  'name',
                  'equalto',
                  'IF-MIB operational status'
                )
              | first
            ).valuemapid
          }}
      no_log: true

    - name: Read template scalar SNMP items
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            templateids:
              - "{{ _snmp_template_id }}"
            output:
              - itemid
              - name
              - key_
              - snmp_oid
              - type
          id: 7
        return_content: true
      register: _template_items
      no_log: true

    - name: Create initial scalar SNMP items
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            name: "{{ item.name }}"
            key_: "{{ item.key }}"
            hostid: "{{ _snmp_template_id }}"
            # Zabbix 7.0 item type 20 = SNMP agent.
            type: 20
            value_type: "{{ item.value_type }}"
            snmp_oid: "{{ item.oid }}"
            delay: "{{ item.delay }}"
            history: "30d"
            trends: "{{ item.trends }}"
          id: 10
        return_content: true
      loop:
        - name: "SNMP system name"
          key: "hp.snmp.sysname"
          oid: "1.3.6.1.2.1.1.5.0"
          value_type: 1
          delay: "5m"
          trends: "0"
        - name: "SNMP system description"
          key: "hp.snmp.sysdescr"
          oid: "1.3.6.1.2.1.1.1.0"
          value_type: 1
          delay: "1h"
          trends: "0"
        - name: "SNMP system uptime"
          key: "hp.snmp.sysuptime"
          oid: "1.3.6.1.2.1.1.3.0"
          value_type: 3
          delay: "1m"
          trends: "365d"
      when: >-
        item.key not in
        (
          (_template_items.content | from_json).result
          | map(attribute='key_')
          | list
        )
      register: _scalar_item_create
      changed_when: true
      failed_when: >-
        (_scalar_item_create.content | from_json).error is defined
      no_log: true

    - name: Read HP ProCurve port SNMP walk master item
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            templateids:
              - "{{ _snmp_template_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - value_type
              - snmp_oid
              - delay
            filter:
              key_:
                - "{{ zabbix_hp_snmp_port_walk_key }}"
          id: 201
        return_content: true
      register: _port_walk_item
      no_log: true

    - name: Create HP ProCurve port SNMP walk master item
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: item.create
          params:
            name: "HP ProCurve physical port SNMP walk"
            key_: "{{ zabbix_hp_snmp_port_walk_key }}"
            hostid: "{{ _snmp_template_id }}"
            # Zabbix 7.0 item type 20 = SNMP agent.
            type: 20
            # Raw walk output is text.
            value_type: 4
            snmp_oid: >-
              walk[{{ zabbix_hp_snmp_port_walk_oids | join(',') }}]
            delay: "1m"
            # Keep one hour of the raw master walk for
            # troubleshooting. Long-term data is retained by
            # dependent items rather than this transport item.
            history: "1h"
            trends: "0"
          id: 202
        return_content: true
      register: _port_walk_item_create
      when: (_port_walk_item.content | from_json).result | length == 0
      changed_when: true
      failed_when: >-
        (_port_walk_item_create.content | from_json).error is defined
      no_log: true

    - name: Read final HP ProCurve port SNMP walk master item
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            templateids:
              - "{{ _snmp_template_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - value_type
              - snmp_oid
              - delay
              - history
            filter:
              key_:
                - "{{ zabbix_hp_snmp_port_walk_key }}"
          id: 203
        return_content: true
      register: _port_walk_item_final
      no_log: true

    - name: Reconcile HP ProCurve port walk history retention
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: item.update
          params:
            itemid: >-
              {{
                (_port_walk_item_final.content | from_json)
                .result[0].itemid
              }}
            history: "1h"
          id: 207
        return_content: true
      register: _port_walk_history_update
      when:
        - >-
          (_port_walk_item_final.content | from_json).result
          | length == 1
        - >-
          (
            (_port_walk_item_final.content | from_json)
            .result[0].history
          ) != "1h"
      changed_when: true
      failed_when: >-
        (_port_walk_history_update.content | from_json).error
        is defined
      no_log: true

    - name: Read reconciled HP ProCurve port SNMP walk master item
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            templateids:
              - "{{ _snmp_template_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - value_type
              - snmp_oid
              - delay
              - history
            filter:
              key_:
                - "{{ zabbix_hp_snmp_port_walk_key }}"
          id: 208
        return_content: true
      register: _port_walk_item_reconciled
      no_log: true

    - name: Require one HP ProCurve port SNMP walk master item
      ansible.builtin.assert:
        that:
          - >-
            (_port_walk_item_reconciled.content | from_json).result
            | length == 1
          - >-
            (
              (_port_walk_item_reconciled.content | from_json)
              .result[0].type
              | int
            ) == 20
          - >-
            (
              (_port_walk_item_reconciled.content | from_json)
              .result[0].history
            ) == "1h"
          - >-
            (
              (_port_walk_item_reconciled.content | from_json)
              .result[0].snmp_oid
            )
            ==
            (
              'walk['
              ~
              (zabbix_hp_snmp_port_walk_oids | join(','))
              ~
              ']'
            )
        fail_msg: >-
          HP ProCurve port SNMP walk master item did not
          validate.

    - name: Set HP ProCurve port walk master item ID
      ansible.builtin.set_fact:
        _port_walk_item_id: >-
          {{
            (_port_walk_item_reconciled.content | from_json)
            .result[0].itemid
          }}

    - name: Read HP ProCurve physical port discovery rule
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            hostids:
              - "{{ _snmp_template_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - master_itemid
            filter:
              key_:
                - "{{ zabbix_hp_snmp_port_discovery_key }}"
          id: 204
        return_content: true
      register: _port_discovery_rule
      no_log: true

    - name: Create HP ProCurve physical port discovery rule
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: discoveryrule.create
          params:
            name: "HP ProCurve physical port discovery"
            key_: "{{ zabbix_hp_snmp_port_discovery_key }}"
            hostid: "{{ _snmp_template_id }}"
            # Zabbix type 18 = dependent item.
            type: 18
            master_itemid: "{{ _port_walk_item_id }}"
            preprocessing:
              # Zabbix preprocessing type 29 =
              # SNMP walk to JSON.
              - type: 29
                params: |-
                  {{ zabbix_hp_snmp_lld_descr_macro }}
                  1.3.6.1.2.1.2.2.1.2
                  0
                error_handler: 0
                error_handler_params: ""
            filter:
              # AND; currently only one condition.
              evaltype: 1
              conditions:
                - macro: "{{ zabbix_hp_snmp_lld_index_macro }}"
                  # Physical interfaces are exactly ifIndex 1-24.
                  # Excludes DEFAULT_VLAN (97) and loopback (4192).
                  value: "^(?:[1-9]|1[0-9]|2[0-4])$"
                  operator: 8
          id: 205
        return_content: true
      register: _port_discovery_rule_create
      when: >-
        (_port_discovery_rule.content | from_json).result
        | length == 0
      changed_when: true
      failed_when: >-
        (_port_discovery_rule_create.content | from_json).error
        is defined
      no_log: true

    - name: Read final HP ProCurve physical port discovery rule
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            hostids:
              - "{{ _snmp_template_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - master_itemid
            filter:
              key_:
                - "{{ zabbix_hp_snmp_port_discovery_key }}"
          id: 206
        return_content: true
      register: _port_discovery_rule_final
      no_log: true

    - name: Require one HP ProCurve physical port discovery rule
      ansible.builtin.assert:
        that:
          - >-
            (_port_discovery_rule_final.content | from_json).result
            | length == 1
          - >-
            (
              (_port_discovery_rule_final.content | from_json)
              .result[0].type
              | int
            ) == 18
          - >-
            (
              (_port_discovery_rule_final.content | from_json)
              .result[0].master_itemid
            )
            ==
            (_port_walk_item_id | string)
        fail_msg: >-
          HP ProCurve physical port discovery rule did not
          validate.

    - name: Set HP ProCurve physical port discovery rule ID
      ansible.builtin.set_fact:
        _port_discovery_rule_id: >-
          {{
            (_port_discovery_rule_final.content | from_json)
            .result[0].itemid
          }}

    - name: Read HP ProCurve port description item prototype
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: itemprototype.get
          params:
            discoveryids:
              - "{{ _port_discovery_rule_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - value_type
              - master_itemid
            selectPreprocessing: extend
          id: 301
        return_content: true
      register: _port_descr_prototypes
      no_log: true

    - name: Create HP ProCurve port description item prototype
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: itemprototype.create
          params:
            hostid: "{{ _snmp_template_id }}"
            ruleid: "{{ _port_discovery_rule_id }}"
            name: >-
              Port {{ zabbix_hp_snmp_lld_index_macro }}
              description
            key_: >-
              hp.snmp.port.descr[
              {{- zabbix_hp_snmp_lld_index_macro -}}
              ]
            type: 18
            value_type: 1
            master_itemid: "{{ _port_walk_item_id }}"
            history: "7d"
            trends: "0"
            preprocessing:
              # Zabbix preprocessing type 28 =
              # SNMP walk value.
              - type: 28
                params: |-
                  1.3.6.1.2.1.2.2.1.2.{{ zabbix_hp_snmp_lld_index_macro }}
                  0
                error_handler: 0
                error_handler_params: ""
          id: 302
        return_content: true
      register: _port_descr_prototype_create
      when: >-
        (
          _port_descr_prototypes.content | from_json
        ).result
        | selectattr(
            'key_',
            'equalto',
            'hp.snmp.port.descr['
            ~ zabbix_hp_snmp_lld_index_macro
            ~ ']'
          )
        | list
        | length == 0
      changed_when: true
      failed_when: >-
        (_port_descr_prototype_create.content | from_json).error
        is defined
      no_log: true

    - name: Read final HP ProCurve port description item prototype
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: itemprototype.get
          params:
            discoveryids:
              - "{{ _port_discovery_rule_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - value_type
              - master_itemid
            selectPreprocessing: extend
          id: 303
        return_content: true
      register: _port_descr_prototypes_final
      no_log: true

    - name: Resolve final HP ProCurve port description prototype
      ansible.builtin.set_fact:
        _port_descr_prototype_final: >-
          {{
            (
              (_port_descr_prototypes_final.content | from_json)
              .result
              | selectattr(
                  'key_',
                  'equalto',
                  'hp.snmp.port.descr['
                  ~ zabbix_hp_snmp_lld_index_macro
                  ~ ']'
                )
              | list
            )
          }}
      no_log: true

    - name: Require one HP ProCurve port description prototype
      ansible.builtin.assert:
        that:
          - _port_descr_prototype_final | length == 1
          - >-
            (_port_descr_prototype_final[0].type | int) == 18
          - >-
            (_port_descr_prototype_final[0].value_type | int) == 1
          - >-
            (_port_descr_prototype_final[0].master_itemid | string)
            ==
            (_port_walk_item_id | string)
          - >-
            (
              _port_descr_prototype_final[0].preprocessing
              | selectattr('type', 'equalto', '28')
              | list
              | length
            ) == 1
        fail_msg: >-
          HP ProCurve port description item prototype did not
          validate.

    - name: Read HP ProCurve port metric item prototypes
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
