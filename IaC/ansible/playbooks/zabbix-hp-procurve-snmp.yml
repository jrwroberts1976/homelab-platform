      no_log: true

    - name: Read final HP ProCurve status value-map assignments
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: itemprototype.get
          params:
            discoveryids:
