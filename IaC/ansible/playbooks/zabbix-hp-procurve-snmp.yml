          - _port_strict_master[0].trends == "0"
          - >-
            _port_strict_master[0].snmp_oid
            ==
            (
              'walk['
              ~
              (zabbix_hp_snmp_port_walk_oids | join(','))
              ~
              ']'
            )
        fail_msg: >-
          HP ProCurve SNMP master walk has drifted from
          the IaC definition.

    - name: Read strict HP ProCurve SNMP LLD configuration
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: discoveryrule.get
          params:
            templateids:
              - "{{ _snmp_template_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - value_type
              - status
              - state
              - master_itemid
            filter:
              key_:
                - "{{ zabbix_hp_snmp_port_discovery_key }}"
            selectFilter: extend
            selectPreprocessing: extend
          id: 402
        return_content: true
      register: _port_strict_lld_read
      no_log: true

    - name: Resolve strict HP ProCurve SNMP LLD configuration
      ansible.builtin.set_fact:
        _port_strict_lld: >-
          {{
            (_port_strict_lld_read.content | from_json)
            .result
          }}
      no_log: true

    - name: Require exact HP ProCurve SNMP LLD configuration
      ansible.builtin.assert:
        that:
          - _port_strict_lld | length == 1
          - (_port_strict_lld[0].type | int) == 18
          - (_port_strict_lld[0].value_type | int) == 4
          - (_port_strict_lld[0].status | int) == 0
          - (_port_strict_lld[0].state | int) == 0
          - >-
            (_port_strict_lld[0].master_itemid | string)
            ==
            (_port_walk_item_id | string)

          - _port_strict_lld[0].preprocessing | length == 1
          - >-
            (
              _port_strict_lld[0]
              .preprocessing[0].type
              | int
            ) == 29
          - >-
            _port_strict_lld[0]
            .preprocessing[0].params
            ==
            (
              zabbix_hp_snmp_lld_descr_macro
              ~ '\n'
              ~ '1.3.6.1.2.1.2.2.1.2'
              ~ '\n0'
            )
          - >-
            (
              _port_strict_lld[0]
              .preprocessing[0].error_handler
              | int
            ) == 0

          - >-
            (_port_strict_lld[0].filter.evaltype | int)
            == 1
          - >-
            _port_strict_lld[0]
            .filter.conditions
            | length
            == 1
          - >-
            _port_strict_lld[0]
            .filter.conditions[0].macro
            ==
            zabbix_hp_snmp_lld_index_macro
          - >-
            (
              _port_strict_lld[0]
              .filter.conditions[0].operator
              | int
            ) == 8
          - >-
            _port_strict_lld[0]
            .filter.conditions[0].value
            ==
            '^(?:[1-9]|1[0-9]|2[0-4])$'
        fail_msg: >-
          HP ProCurve physical-port discovery rule has
          drifted from the IaC definition.

    - name: Read strict HP ProCurve SNMP item prototypes
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: itemprototype.get
          params:
            discoveryids:
              - "{{ _port_discovery_rule_id }}"
            output:
              - itemid
              - name
              - key_
              - type
              - value_type
              - status
              - units
              - history
              - trends
              - master_itemid
            selectPreprocessing: extend
          id: 403
        return_content: true
      register: _port_strict_prototypes_read
      no_log: true

    - name: Resolve strict HP ProCurve SNMP item prototypes
      ansible.builtin.set_fact:
        _port_strict_prototypes: >-
          {{
            (_port_strict_prototypes_read.content | from_json)
            .result
          }}
        _port_strict_canary_key: >-
          {{
            'hp.snmp.port.descr['
            ~ zabbix_hp_snmp_lld_index_macro
            ~ ']'
          }}
      no_log: true

    - name: Resolve expected HP ProCurve SNMP prototype keys
      ansible.builtin.set_fact:
        _port_strict_expected_keys: >-
          {{
            _port_metric_expected_keys
            +
            [_port_strict_canary_key]
          }}
        _port_strict_actual_keys: >-
          {{
            _port_strict_prototypes
            | map(attribute='key_')
            | list
          }}

    - name: Require exact HP ProCurve SNMP prototype set
      ansible.builtin.assert:
        that:
          - _port_strict_prototypes | length == 10
          - >-
            (
              _port_strict_expected_keys
              | difference(_port_strict_actual_keys)
              | length
            ) == 0
          - >-
            (
              _port_strict_actual_keys
              | difference(_port_strict_expected_keys)
              | length
            ) == 0
        fail_msg: >-
          HP ProCurve SNMP prototype set has drifted from
          the IaC definition.

    - name: Resolve strict HP ProCurve description prototype
      ansible.builtin.set_fact:
        _port_strict_canary: >-
          {{
            _port_strict_prototypes
            | selectattr(
                'key_',
                'equalto',
                _port_strict_canary_key
              )
            | list
          }}
      no_log: true

    - name: Require exact HP ProCurve description prototype
      ansible.builtin.assert:
        that:
          - _port_strict_canary | length == 1
          - >-
            _port_strict_canary[0].name
            ==
            (
              'Port '
              ~ zabbix_hp_snmp_lld_index_macro
              ~ ' description'
            )
          - (_port_strict_canary[0].type | int) == 18
          - (_port_strict_canary[0].value_type | int) == 1
          - (_port_strict_canary[0].status | int) == 0
          - _port_strict_canary[0].units == ""
          - _port_strict_canary[0].history == "7d"
          - _port_strict_canary[0].trends == "0"
          - >-
            (_port_strict_canary[0].master_itemid | string)
            ==
            (_port_walk_item_id | string)
          - >-
            _port_strict_canary[0].preprocessing
            | length
            == 1
          - >-
            (
              _port_strict_canary[0]
              .preprocessing[0].type
              | int
            ) == 28
          - >-
            _port_strict_canary[0]
            .preprocessing[0].params
            ==
            (
              '1.3.6.1.2.1.2.2.1.2.'
              ~ zabbix_hp_snmp_lld_index_macro
              ~ '\n0'
            )
          - >-
            (
              _port_strict_canary[0]
              .preprocessing[0].error_handler
              | int
            ) == 0
        fail_msg: >-
          HP ProCurve port-description prototype has
          drifted from the IaC definition.

    - name: Require exact HP ProCurve production metric prototypes
      ansible.builtin.assert:
        that:
          - >-
            (
              _port_strict_prototypes
              | selectattr('key_', 'equalto', item.key)
              | list
              | length
            ) == 1

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).name
            ) == item.name

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).type
              | int
            ) == 18

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).value_type
              | int
            ) == (item.value_type | int)

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).status
              | int
            ) == 0

          - >-
            (
              _port_strict_prototypes
              | selectattr('key_', 'equalto', item.key)
              | first
            ).units
            == item.units

          - >-
            (
              _port_strict_prototypes
              | selectattr('key_', 'equalto', item.key)
              | first
            ).history
            == item.history

          - >-
            (
              _port_strict_prototypes
              | selectattr('key_', 'equalto', item.key)
              | first
            ).trends
            == item.trends

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).master_itemid
              | string
            )
            ==
            (_port_walk_item_id | string)

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).preprocessing
              | map(attribute='type')
              | map('int')
              | list
            )
            ==
            (
              item.preprocessing
              | map(attribute='type')
              | map('int')
              | list
            )

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).preprocessing
              | map(attribute='params')
              | list
            )
            ==
            (
              item.preprocessing
              | map(attribute='params')
              | list
            )

          - >-
            (
              (
                _port_strict_prototypes
                | selectattr('key_', 'equalto', item.key)
                | first
              ).preprocessing
              | map(attribute='error_handler')
              | map('int')
              | list
            )
            ==
            (
              item.preprocessing
              | map(attribute='error_handler')
              | map('int')
              | list
            )
        fail_msg: >-
          HP ProCurve production metric prototype
          {{ item.key }} has drifted from the IaC definition.
      loop: "{{ zabbix_hp_snmp_port_metric_prototypes }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Read target HP switch host
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            output:
              - hostid
              - host
              - name
              - status
            filter:
              host:
                - "{{ zabbix_hp_snmp_host }}"
            selectInterfaces:
              - interfaceid
              - type
              - main
              - useip
              - ip
              - dns
              - port
            selectParentTemplates:
              - templateid
              - name
          id: 11
        return_content: true
      register: _switch_host
      no_log: true

    - name: Create HP switch SNMP host when absent
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.create
          params:
            host: "{{ zabbix_hp_snmp_host }}"
            name: "{{ zabbix_hp_snmp_visible_name }}"
            groups:
              - groupid: "{{ _network_group_id }}"
            templates:
              - templateid: "{{ _snmp_template_id }}"
            macros:
              - macro: "{{ zabbix_hp_snmp_community_macro }}"
                value: >-
                  {{
                    zabbix_hp_snmp_existing_community.stdout
                  }}
                type: 1
                description: >-
                  Protected SNMP v2c community for the HP
                  ProCurve switch.
            interfaces:
              - main: 1
                type: 2
                useip: 1
                ip: "{{ zabbix_hp_snmp_address }}"
                dns: ""
                port: "{{ zabbix_hp_snmp_port }}"
                details:
                  version: 2
                  bulk: 1
                  community: >-
                    {{ zabbix_hp_snmp_community_macro }}
          id: 12
        return_content: true
      register: _switch_host_create
      when: (_switch_host.content | from_json).result | length == 0
      changed_when: true
      failed_when: >-
        (_switch_host_create.content | from_json).error is defined
      no_log: true

    - name: Read final HP switch state
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            output:
              - hostid
              - host
              - name
              - status
            filter:
              host:
                - "{{ zabbix_hp_snmp_host }}"
            selectInterfaces:
              - interfaceid
              - type
              - main
              - useip
              - ip
              - dns
              - port
              - available
              - error
            selectParentTemplates:
              - templateid
              - name
            selectMacros:
              - hostmacroid
              - macro
              - type
          id: 13
        return_content: true
      register: _switch_host_final
      no_log: true

    - name: Require final HP switch host structure
      ansible.builtin.assert:
        that:
          - (_switch_host_final.content | from_json).result | length == 1
          - >-
            (
              (_switch_host_final.content | from_json).result[0].interfaces
              | selectattr('type', 'equalto', '2')
              | list
              | length
            ) == 1
          - >-
            (
              (_switch_host_final.content | from_json).result[0].parentTemplates
              | map(attribute='templateid')
              | list
            )
            is contains(_snmp_template_id)
          - >-
            (
              (_switch_host_final.content | from_json).result[0].macros
              | selectattr(
                  'macro',
                  'equalto',
                  zabbix_hp_snmp_community_macro
                )
              | list
              | length
            ) == 1
        fail_msg: >-
          Final HP switch Zabbix structure did not validate.

    - name: Report HP switch SNMP structure
      ansible.builtin.debug:
        msg:
          host: "{{ zabbix_hp_snmp_host }}"
          address: "{{ zabbix_hp_snmp_address }}"
          host_group: "{{ zabbix_hp_snmp_group_name }}"
          template_group: "{{ zabbix_hp_snmp_template_group_name }}"
          template: "{{ zabbix_hp_snmp_template_name }}"
          reporting_user_group: >-
            {{ zabbix_hp_snmp_reporting_user_group }}
          reporting_permission: "Read"
          port_walk_master: "{{ zabbix_hp_snmp_port_walk_key }}"
          port_discovery_rule: >-
            {{ zabbix_hp_snmp_port_discovery_key }}
          physical_port_filter: "ifIndex 1-24"
          discovery_canary: >-
            hp.snmp.port.descr[
            {{- zabbix_hp_snmp_lld_index_macro -}}
            ]
          port_metric_prototypes: >-
            {{ zabbix_hp_snmp_port_metric_prototypes | length }}
          collection_model: >-
            single SNMP walk with dependent LLD items
          secret_macro: "{{ zabbix_hp_snmp_community_macro }}"
          secret_value_exposed: false
