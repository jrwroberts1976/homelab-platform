    # -----------------------------------------------------------------

    - name: Read HP ProCurve status prototypes for value maps
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: itemprototype.get
          params:
            discoveryids:
              - "{{ _port_discovery_rule_id }}"
            output:
              - itemid
              - key_
              - valuemapid
            filter:
              key_:
                - >-
                  hp.snmp.port.admin[
                  {{- zabbix_hp_snmp_lld_index_macro -}}
                  ]
                - >-
                  hp.snmp.port.oper[
                  {{- zabbix_hp_snmp_lld_index_macro -}}
                  ]
          id: 506
        return_content: true
      register: _hp_status_prototypes
      no_log: true

    - name: Resolve HP ProCurve status prototypes
      ansible.builtin.set_fact:
        _hp_admin_prototype: >-
          {{
            (
              (_hp_status_prototypes.content | from_json).result
              | selectattr(
                  'key_',
                  'equalto',
                  'hp.snmp.port.admin['
                  ~ zabbix_hp_snmp_lld_index_macro
                  ~ ']'
                )
              | first
            )
          }}
        _hp_oper_prototype: >-
          {{
            (
              (_hp_status_prototypes.content | from_json).result
              | selectattr(
                  'key_',
                  'equalto',
                  'hp.snmp.port.oper['
                  ~ zabbix_hp_snmp_lld_index_macro
                  ~ ']'
                )
              | first
            )
          }}
      no_log: true

    - name: Attach administrative status value map
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: itemprototype.update
          params:
            itemid: "{{ _hp_admin_prototype.itemid }}"
            valuemapid: "{{ _hp_admin_valuemap_id }}"
          id: 507
        return_content: true
      register: _hp_admin_valuemap_attach
      when: >-
        (_hp_admin_prototype.valuemapid | string)
        !=
        (_hp_admin_valuemap_id | string)
      changed_when: true
      failed_when: >-
        (_hp_admin_valuemap_attach.content | from_json).error
        is defined
      no_log: true

    - name: Attach operational status value map
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
