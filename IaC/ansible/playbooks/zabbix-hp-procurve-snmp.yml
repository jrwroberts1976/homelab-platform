            output:
              - itemid
              - key_
              - valuemapid
            filter:
              key_:
                - >-
                  hp.snmp.port.admin[
                  {{- zabbix_hp_snmp_lld_index_macro -}}
                  ]
                - >-
                  hp.snmp.port.oper[
                  {{- zabbix_hp_snmp_lld_index_macro -}}
                  ]
          id: 509
        return_content: true
      register: _hp_status_prototypes_final
      no_log: true

    - name: Require HP ProCurve status value-map assignments
      ansible.builtin.assert:
        that:
          - >-
            (
              (
                (_hp_status_prototypes_final.content | from_json).result
                | selectattr(
