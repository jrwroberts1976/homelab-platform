---
# Retired by #287. Historical Zabbix HP ProCurve SNMP configuration remains
# accessible through Git history. This guard must never modify Zabbix.
- name: Refuse retired HP ProCurve SNMP deployment
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Block retired HP switch SNMP monitoring reactivation
      ansible.builtin.fail:
        msg: >-
          RETIRED (#287): HP ProCurve network monitoring is no longer an
          active deployment. Recommissioning requires a separate reviewed
          GitHub issue and new Ansible change.
