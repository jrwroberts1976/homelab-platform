          id: 508
        return_content: true
      register: _hp_oper_valuemap_attach
      when: >-
        (_hp_oper_prototype.valuemapid | string)
        !=
        (_hp_oper_valuemap_id | string)
      changed_when: true
      failed_when: >-
        (_hp_oper_valuemap_attach.content | from_json).error
