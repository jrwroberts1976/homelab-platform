              .result[0].overrides
              | length
            ) == 1
          - >-
            _hp_link_override_final.name
            ==
            zabbix_hp_snmp_link_override_name
          - >-
            (_hp_link_override_final.step | int) == 1
          - >-
            (_hp_link_override_final.stop | int) == 1
          - >-
            (
