                (_hp_status_prototypes_final.content | from_json).result
                | selectattr(
                    'key_',
                    'equalto',
                    'hp.snmp.port.oper['
                    ~ zabbix_hp_snmp_lld_index_macro
                    ~ ']'
                  )
                | first
              ).valuemapid
              | string
            )
            ==
            (_hp_oper_valuemap_id | string)
        fail_msg: >-
          HP ProCurve status prototypes are not attached to
