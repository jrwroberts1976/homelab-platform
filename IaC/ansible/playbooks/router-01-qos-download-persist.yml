---
# Retired 11 November 2026: download CAKE did not return after router reboot.
# Keep this entry point safe: it must never re-install the obsolete PPP hook.
# Upload CAKE on eth1 remains independently managed and unchanged.
- name: Retire router download QoS startup files
  hosts: router-01
  become: true
  gather_facts: false
  tasks:
    - name: Remove retired PPP download QoS hook
      ansible.builtin.file:
        path: /etc/ppp/ip-up.d/router-qos-download
        state: absent

    - name: Remove retired download QoS controller
      ansible.builtin.file:
        path: /usr/local/sbin/router-qos-download-basic
        state: absent

    - name: Disable obsolete combined QoS metrics timer
      ansible.builtin.systemd_service:
        name: router-qos-metrics.timer
        enabled: false
        state: stopped

    # Do not change eth1 upload shaping, ppp0, Suricata or main nftables.
