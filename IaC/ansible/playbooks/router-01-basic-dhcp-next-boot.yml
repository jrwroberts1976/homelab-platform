---
# Prepare basic static LAN + Kea for NEXT BOOT only; no live IP or DHCP changes.
- name: Configure Pi eth0 and Kea DHCP for next reboot
  hosts: docker-01
  gather_facts: false
  become: true
  vars:
    basic_dhcp_next_boot_approved: false
    old_netplan: /etc/netplan/90-NM-75a1216a-9d1a-30cd-8aca-ace5526ec021.yaml
  pre_tasks:
    - name: Ensure explicit approval and expected host
      ansible.builtin.assert:
        that:
          - basic_dhcp_next_boot_approved | bool
          - inventory_hostname == 'docker-01'
          - ansible_host == '192.168.2.220'
      delegate_to: localhost
      become: false

    - name: Require old address still running
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: old_ip
      changed_when: false
      failed_when: "'192.168.2.220/24' not in old_ip.stdout"

    - name: Require original network backup
      ansible.builtin.stat:
        path: /var/lib/router-01-reboot-migration/backup/old-eth0.yaml
      register: backup
      failed_when: not (backup.stat.isreg | default(false))

    - name: Check Kea DHCP syntax
      ansible.builtin.command:
        argv: [kea-dhcp4, -t, /etc/kea/kea-dhcp4.conf]
      changed_when: false

  tasks:
    - name: Disable and stop previous boot migration and automatic rollback
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - router-01-reboot-activate.service
        - router-01-reboot-rollback.timer

    - name: Stop legacy migration timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop:
        - router-lan-switch.timer
        - router-lan-rollback.timer

    - name: Write persistent eth0 static address for next boot WITHOUT applying now
      ansible.builtin.copy:
        dest: "{{ old_netplan }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          network:
            version: 2
            ethernets:
              eth0:
                renderer: NetworkManager
                dhcp4: false
                dhcp6: false
                addresses:
                  - 192.168.3.1/24

    - name: Unmask Kea without starting it
      ansible.builtin.systemd_service:
        name: kea-dhcp4-server.service
        masked: false
        state: stopped

    - name: Enable Kea on reboot but leave inactive now
      ansible.builtin.systemd_service:
        name: kea-dhcp4-server.service
        enabled: true
        state: stopped

    - name: Check old runtime IP unchanged
      ansible.builtin.command: ip -4 -o addr show dev eth0
      register: still_old
      changed_when: false
      failed_when: "'192.168.2.220/24' not in still_old.stdout"

    - name: Confirm Kea not running on old LAN
      ansible.builtin.command: systemctl is-active kea-dhcp4-server.service
      register: kea_state
      changed_when: false
      failed_when: kea_state.stdout | trim == 'active'

    - name: Report next boot configuration
      ansible.builtin.debug:
        msg:
          - "Ready for NEXT boot: eth0 static 192.168.3.1/24 and Kea enabled."
          - "No netplan apply, service start or reboot performed."
          - "BEFORE reboot isolate eth0 from 192.168.2.0/24 ASUS LAN."
          - "No automatic rollback is armed; recovering may require SD-card access."
