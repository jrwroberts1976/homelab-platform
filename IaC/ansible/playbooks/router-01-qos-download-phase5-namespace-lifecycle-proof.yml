---
# Sensor-only real IFB/CAKE PPP lifecycle namespace test. Off by default.
- name: Test disposable PPP lifecycle namespace with CAKE
  hosts: sensor-01
  become: true
  gather_facts: true
  vars:
    qos_phase5_namespace_proof_approved: false
    phase5_script: /run/router-qos-phase5-namespace-lifecycle-proof.sh
  tasks:
    - name: Require explicit approval and exact sensor host
      ansible.builtin.assert:
        that:
          - qos_phase5_namespace_proof_approved | bool
          - not ansible_check_mode
          - inventory_hostname == 'sensor-01'
          - ansible_facts.hostname == 'sensor-01'
          - ansible_facts.default_ipv4.interface == 'eth0'
          - ansible_facts.default_ipv4.gateway == '192.168.2.1'
    - name: Refuse reserved resource collisions
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          test ! -e /run/router-qos-phase5-namespace-lifecycle-proof.sh
          ! ip netns list | grep -Eq '^qos-p5( |$)'
      changed_when: false
    - name: Perform disposable proof with cleanup
      block:
        - name: Stage temporary test program
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../files/router-qos-phase5-namespace-lifecycle-proof.sh"
            dest: "{{ phase5_script }}"
            owner: root
            group: root
            mode: '0700'
        - name: Validate staged program
          ansible.builtin.command:
            argv: [/bin/bash, -n, "{{ phase5_script }}"]
          changed_when: false
        - name: Execute real isolated lifecycle proof
          ansible.builtin.command:
            argv: [/bin/bash, "{{ phase5_script }}"]
          register: phase5_output
          changed_when: true
        - name: Require expected isolated proof evidence
          ansible.builtin.assert:
            that:
              - "'PPP_SESSION_A_INSTALL_PASS' in phase5_output.stdout"
              - "'STALE_EVENT_NO_MUTATION_PASS' in phase5_output.stdout"
              - "'PPP_SESSION_B_RECONNECT_PASS' in phase5_output.stdout"
              - "'OWNED_ONLY_CLEANUP_PASS' in phase5_output.stdout"
      always:
        - name: Verify temporary namespace was removed
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              ! ip netns list | grep -Eq '^qos-p5( |$)'
          changed_when: false
        - name: Remove disposable proof script only after namespace verification
          ansible.builtin.file:
            path: "{{ phase5_script }}"
            state: absent
