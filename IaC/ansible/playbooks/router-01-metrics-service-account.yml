---
# C2b2-a: dedicated, initially UNAUTHORIZED local user/group on physical Pi.
# No authorized_keys, sshd config edits/reloads, firewall, PPPoE or tunnel.
- name: Stage dormant dedicated SSH monitoring service account on physical router
  hosts: router_toolset_audit
  gather_facts: false
  become: true
  vars:
    router_c2_pi_account_approved: false
    router_c2_pi_account: router-metrics
    router_c2_pi_home: /var/lib/router-metrics

  pre_tasks:
    - name: Identify exact controller before proceeding
      ansible.builtin.command:
        argv: [hostname]
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: c2b2_account_controller

    - name: Require exact controller, Pi inventory and deliberate operator approval
      ansible.builtin.assert:
        that:
          - router_c2_pi_account_approved | bool
          - c2b2_account_controller.stdout | trim == 'admin-01'
          - inventory_hostname == 'router-01'
          - ansible_host == '192.168.3.1'
      delegate_to: localhost
      become: false

    - name: Verify physical Raspberry Pi LAN MAC
      ansible.builtin.command:
        argv: [cat, /sys/class/net/eth0/address]
      register: c2b2_account_mac
      check_mode: false
      changed_when: false

    - name: Require independently verified hardware
      ansible.builtin.assert:
        that:
          - c2b2_account_mac.stdout | lower | trim == 'd8:3a:dd:5a:51:44'

    - name: Ensure SSH daemon is valid before any local account work
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      check_mode: false
      changed_when: false

    - name: Inspect existing service user to avoid modifying unrelated accounts
      ansible.builtin.command:
        argv: [getent, passwd, "{{ router_c2_pi_account }}"]
      register: c2b2_account_existing_user
      check_mode: false
      changed_when: false
      failed_when: false
      no_log: true

    - name: Refuse a colliding existing account with different home or shell
      ansible.builtin.assert:
        that:
          - c2b2_account_existing_user.stdout.split(':')[5] == router_c2_pi_home
          - c2b2_account_existing_user.stdout.split(':')[6] == '/usr/sbin/nologin'
        fail_msg: "An unrelated router-metrics user already exists; stop."
      when: c2b2_account_existing_user.rc == 0

    - name: Inspect existing service group collision without member disclosure
      ansible.builtin.command:
        argv: [getent, group, "{{ router_c2_pi_account }}"]
      register: c2b2_account_existing_group
      check_mode: false
      changed_when: false
      failed_when: false
      no_log: true

    - name: Refuse a pre-existing group without a corresponding service user
      ansible.builtin.assert:
        that:
          - c2b2_account_existing_group.rc != 0 or c2b2_account_existing_user.rc == 0
        fail_msg: "The requested service group belongs to another context; stop."

    - name: Inspect future private service home before creation
      ansible.builtin.stat:
        path: "{{ router_c2_pi_home }}"
      register: c2b2_account_home

    - name: Refuse existing symlink or unrelated service home
      ansible.builtin.assert:
        that:
          - not (c2b2_account_home.stat.islnk | default(false))
          - (not (c2b2_account_home.stat.exists | default(false))) or (c2b2_account_home.stat.isdir | default(false))
          - (not (c2b2_account_home.stat.exists | default(false))) or (c2b2_account_home.stat.pw_name | default('')) == router_c2_pi_account
          - (not (c2b2_account_home.stat.exists | default(false))) or (c2b2_account_home.stat.mode | default('')) in ['0700', '0750', '0755']

    - name: Read loopback exporter and remote SSH listener
      ansible.builtin.command:
        argv: [ss, -ltn]
      register: c2b2_account_before_sockets
      check_mode: false
      changed_when: false

    - name: Confirm essential Pi gateway services active
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop: [nftables, router-pppoe, dnsmasq, unbound]
      register: c2b2_account_before_services
      check_mode: false
      changed_when: false

    - name: Require protected local-only exporter and running gateway services
      ansible.builtin.assert:
        that:
          - "'127.0.0.1:9100' in c2b2_account_before_sockets.stdout"
          - "'0.0.0.0:9100' not in c2b2_account_before_sockets.stdout"
          - "'[::]:9100' not in c2b2_account_before_sockets.stdout"
          - "'192.168.3.1:9100' not in c2b2_account_before_sockets.stdout"
          - (c2b2_account_before_services.results | selectattr('stdout', 'equalto', 'active') | list | length) == 4

  tasks:
    - name: Create dedicated Pi system group with no effects on existing logins
      ansible.builtin.group:
        name: "{{ router_c2_pi_account }}"
        system: true
        state: present

    - name: Create disabled-password noninteractive service user with no SSH key
      ansible.builtin.user:
        name: "{{ router_c2_pi_account }}"
        group: "{{ router_c2_pi_account }}"
        system: true
        state: present
        create_home: true
        home: "{{ router_c2_pi_home }}"
        shell: /usr/sbin/nologin
        password_lock: true
      # In check mode the new group is predicted, not actually created.
      # Skip dependent user creation until a later approved normal run.
      when: not ansible_check_mode

  post_tasks:
    - name: Ensure Pi sshd configuration still valid
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      check_mode: false
      changed_when: false

    - name: Confirm critical router units still active
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop: [nftables, router-pppoe, dnsmasq, unbound]
      register: c2b2_account_after_services
      check_mode: false
      changed_when: false

    - name: Confirm gateway is still healthy
      ansible.builtin.assert:
        that:
          - (c2b2_account_after_services.results | selectattr('stdout', 'equalto', 'active') | list | length) == 4

    - name: Confirm no SSH credentials or daemon policies were changed
      ansible.builtin.debug:
        msg:
          state: "{{ 'CHECK MODE: group change predicted; user creation skipped' if ansible_check_mode else 'LIVE: dormant local service identity and group present' }}"
          pi_service_user: "{{ router_c2_pi_account }}"
          service_home: "{{ router_c2_pi_home }}"
          password_authentication: "LOCKED for service identity"
          shell: /usr/sbin/nologin
          ssh_authorized_keys: "NONE installed by this play"
          sshd_configuration: "UNCHANGED; no reload or restart"
          node_exporter: "UNCHANGED; localhost-only"
          router_network_firewall_pppoe: "UNCHANGED"
          monitoring_docker_and_tunnel: "UNCHANGED"
