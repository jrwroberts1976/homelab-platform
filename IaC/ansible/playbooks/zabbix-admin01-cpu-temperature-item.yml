---
# Only create one host-level Zabbix item on approval; preview by default.
- name: Audit or create admin-01 Zabbix CPU temperature item
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  vars:
    cpu_temperature_item_apply: false
  tasks:
    - name: Require monitor-01 only
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'
          - ansible_play_hosts_all | length == 1
          - ansible_facts.hostname == 'monitor-01'

    - name: Install guarded item reconciler
      ansible.builtin.copy:
        src: ../roles/monitoring_stack/files/grafana/reconcile_zabbix_admin01_temperature.py
        dest: /usr/local/sbin/homelab-zabbix-admin01-temperature
        owner: root
        group: root
        mode: "0700"

    - name: Preview exact Zabbix host item
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-zabbix-admin01-temperature]
      register: temperature_item_preview
      changed_when: false

    - name: Show Zabbix item preview
      ansible.builtin.debug:
        var: temperature_item_preview.stdout_lines

    - name: Create item only on explicit apply
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-zabbix-admin01-temperature, --apply]
      register: temperature_item_apply_result
      changed_when: "'CREATED AND VERIFIED:' in temperature_item_apply_result.stdout"
      when: cpu_temperature_item_apply | bool

    - name: Show item apply verification
      ansible.builtin.debug:
        var: temperature_item_apply_result.stdout_lines
      when: cpu_temperature_item_apply | bool
