---
# Focused, non-scanning rollout: publish EXISTING monitor-01 Nmap fingerprints
# without any legacy MAC-correlated inventory or Grafana dashboard generation.
- name: Publish saved Nmap OS fingerprint evidence independently
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    publisher_src: "{{ playbook_dir }}/../roles/network_host_deep_profiler/files"

  tasks:
    - name: Verify canonical monitor-01 and current profiler ownership
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'
          - ansible_facts.hostname == 'monitor-01'
          - ansible_facts.default_ipv4.address == '192.168.2.52'
          - ansible_facts.default_ipv4.interface == 'eth0'
        fail_msg: Refusing to publish OS evidence from an unexpected host.

    - name: Require existing deep-profile state, Grafana and node exporter
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/homelab-network-hosts/deep-profiles.json
        - /var/lib/prometheus/node-exporter
        - /opt/monitoring/docker-compose.yml
        - /etc/homelab/network-estate.json
      register: os_publisher_prereqs

    - name: Refuse to invent profile state or bootstrap monitoring
      ansible.builtin.assert:
        that:
          - os_publisher_prereqs.results | selectattr('stat.exists', 'equalto', false) | list | length == 0
        fail_msg: >-
          Existing monitor-01 deep-profile state and monitoring platform are
          required. This playbook never starts an Nmap scan.

    - name: Install read-only saved Nmap evidence exporter
      ansible.builtin.copy:
        src: "{{ publisher_src }}/os-fingerprint-evidence-exporter.py"
        dest: /usr/local/sbin/homelab-network-os-evidence
        owner: root
        group: root
        mode: '0755'

    - name: Install read-only evidence exporter service and timer
      ansible.builtin.copy:
        src: "{{ publisher_src }}/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - homelab-network-os-evidence.service
        - homelab-network-os-evidence.timer

    - name: Run initial export of already saved OS fingerprints
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: homelab-network-os-evidence.service
        state: started

    - name: Enable five-minute read-only evidence publication
      ansible.builtin.systemd_service:
        name: homelab-network-os-evidence.timer
        enabled: true
        state: started

    - name: Read exported metric for evidence count
      ansible.builtin.slurp:
        src: /var/lib/prometheus/node-exporter/homelab_network_os_fingerprints.prom
      register: saved_nmap_metric

    - name: Count actual saved OS fingerprint matches
      ansible.builtin.set_fact:
        saved_nmap_fingerprints: >-
          {{ (saved_nmap_metric.content | b64decode
             | regex_findall('(?m)^homelab_network_host_os_fingerprint_info\\{')) | length }}

    - name: Wait for monitor-01 saved fingerprint metric scrape
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:9090/api/v1/query?query=homelab_network_host_os_fingerprint_info%7Btarget_name%3D%22monitor-01%22%7D
        status_code: 200
        return_content: true
      register: saved_nmap_scrape
      until:
        - saved_nmap_scrape.json.status == 'success'
        - saved_nmap_scrape.json.data.result | length >= saved_nmap_fingerprints | int
      retries: 20
      delay: 5
      changed_when: false
      when: saved_nmap_fingerprints | int > 0

    - name: Show independent saved fingerprint publication result
      ansible.builtin.debug:
        msg: >-
          monitor-01 published {{ saved_nmap_fingerprints }} existing Nmap OS
          evidence records through its independent Prometheus textfile series.
          No Nmap scan, legacy inventory exporter, MAC dashboard generation,
          or Grafana restart was performed.
