---
- name: Finalise Nextcloud HTTPS settings
  hosts: cloud-01
  become: true
  gather_facts: false

  vars:
    nextcloud_https_fqdn: nextcloud.home.jrwroberts.co.uk
    nextcloud_finalize_allow_deploy: false

  tasks:
    - name: Require explicit approval
      ansible.builtin.assert:
        that:
          - nextcloud_finalize_allow_deploy | bool

    - name: Verify working HTTPS endpoint
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --max-time
          - "15"
          - --resolve
          - "{{ nextcloud_https_fqdn }}:443:192.168.2.53"
          - "https://{{ nextcloud_https_fqdn }}/status.php"
      changed_when: false

    - name: Read trusted domains
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -u
          - www-data
          - cloud-01-app-1
          - php
          - occ
          - config:system:get
          - trusted_domains
      register: current_domains
      changed_when: false

    - name: Add HTTPS trusted domain if missing
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -u
          - www-data
          - cloud-01-app-1
          - php
          - occ
          - config:system:set
          - trusted_domains
          - "--type=json"
          - "--value={{ (current_domains.stdout_lines + [nextcloud_https_fqdn]) | unique | list | to_json }}"
      when: nextcloud_https_fqdn not in current_domains.stdout_lines

    - name: Read current canonical URL
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -u
          - www-data
          - cloud-01-app-1
          - php
          - occ
          - config:system:get
          - overwrite.cli.url
      register: current_cli_url
      changed_when: false

    - name: Configure HTTPS canonical URL
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -u
          - www-data
          - cloud-01-app-1
          - php
          - occ
          - config:system:set
          - overwrite.cli.url
          - "--value=https://{{ nextcloud_https_fqdn }}"
      when: current_cli_url.stdout | trim !=
            'https://' ~ nextcloud_https_fqdn
