---
- name: Build Raspberry Pi 5 Kodi media endpoint
  hosts: media_hosts
  become: true
  gather_facts: true

  # /etc/nftables.conf ownership transferred to homelab-2.0
  # ansible/playbooks/services/firewall.yml; do not run legacy firewall role.
  roles:
    - role: chrony_client
    - role: media_endpoint
    - role: media_smb
    - role: node_exporter
