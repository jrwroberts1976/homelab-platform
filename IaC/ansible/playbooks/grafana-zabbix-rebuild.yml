---
# Zabbix-first Grafana dashboards, generated from live monitored Zabbix items.
# Read-only preview precedes any mutation; Grafana dashboards only.
- name: Rebuild Grafana from live Zabbix telemetry
  hosts: monitoring_hosts
  become: true
  gather_facts: true

  tasks:
    - name: Verify monitor-01 identity
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'
          - ansible_facts.hostname == 'monitor-01'

    - name: Install Zabbix-first Grafana dashboard builder
      ansible.builtin.copy:
        src: ../roles/monitoring_stack/files/grafana/rebuild_zabbix_dashboards.py
        dest: /usr/local/sbin/homelab-grafana-zabbix-rebuild
        owner: root
        group: root
        mode: "0700"

    - name: Preview dashboards using Zabbix host and item API
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-grafana-zabbix-rebuild]
      register: zabbix_dashboard_preview
      changed_when: false
      no_log: true

    - name: Show safe preview summary
      ansible.builtin.debug:
        msg: "{{ zabbix_dashboard_preview.stdout_lines | select('match', '^SUMMARY:') | list }}"

    - name: Create or update Zabbix dashboards
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-grafana-zabbix-rebuild, --apply]
      register: zabbix_dashboard_apply
      changed_when: "'APPLIED CREATE:' in zabbix_dashboard_apply.stdout or 'APPLIED UPDATE:' in zabbix_dashboard_apply.stdout"
      no_log: true

    - name: Show safe deployment summary
      ansible.builtin.debug:
        msg: "{{ zabbix_dashboard_apply.stdout_lines | select('match', '^SUMMARY:') | list }}"
