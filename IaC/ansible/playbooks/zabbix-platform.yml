---
- name: Configure the Zabbix monitoring platform
  hosts: zabbix_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require explicit Zabbix deployment approval
      ansible.builtin.assert:
        that:
          - zabbix_platform_allow_deploy | bool
        fail_msg: >-
          Zabbix platform deployment is disabled by default.
          Set zabbix_platform_allow_deploy=true explicitly.

    - name: Require the approved Zabbix platform identity
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'zabbix-01'
          - ansible_host == '192.168.2.59'
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version | int == 13
        fail_msg: >-
          Zabbix deployment target does not match the approved
          zabbix-01 Debian 13 platform identity.

    - name: Require runtime database secret
      ansible.builtin.assert:
        that:
          - zabbix_server_db_password is defined
          - zabbix_server_db_password | length >= 24
        fail_msg: >-
          HOMELAB_ZABBIX_DB_PASSWORD must be supplied at runtime
          and must contain at least 24 characters.

  roles:
    - role: postgresql
    - role: timescaledb
    - role: zabbix_server
    - role: zabbix_timescaledb
    - role: zabbix_agent
