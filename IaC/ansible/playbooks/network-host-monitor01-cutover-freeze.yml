---
# Gate 3b: SOURCE FREEZE ONLY. Mutates production, NEVER run during staging.
# The first import reruns BOTH hosts' Gate 3a read-only checks.
# Requires EXPLICIT, transaction-scoped operator approval.
# Stopping systemd timers does NOT stop running oneshot jobs; they drain.
# Any failure after timer disable is a STOP/ROLLBACK situation, NOT permission
# to rerun this one-shot playbook. Source is kept OFF until repair or rollback.
- import_playbook: network-host-monitor01-cutover-preflight.yml


- name: Check target backup capacity and transaction collisions BEFORE pausing source
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  vars:
    target_backup_parent: /var/backups/homelab-network-migration
    expected_target_backup: "{{ target_backup_parent }}/gate3-target-precopy-{{ gate3_transaction | default('NOT_AUTHORISED') }}"
  tasks:
    - name: Require exact preapproved transaction and commissioned destination
      ansible.builtin.assert:
        that:
          - gate3_allow_source_freeze | default(false) | bool
          - gate3_transaction is defined
          - gate3_transaction is match('^gate3-[0-9]{8}T[0-9]{6}Z$')
          - inventory_hostname == 'monitor-01'
          - ansible_facts.hostname == 'monitor-01'
          - ansible_facts.default_ipv4.address == '192.168.2.52'

    - name: Check backup parent and transaction-specific destination directory
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ target_backup_parent }}"
        - "{{ expected_target_backup }}"
      register: prospective_target_backup

    - name: Refuse unsafe or already-used target backup before source stop
      ansible.builtin.assert:
        that:
          - prospective_target_backup.results[0].stat.isdir | default(false)
          - prospective_target_backup.results[0].stat.pw_name == 'root'
          - not (prospective_target_backup.results[0].stat.islnk | default(false))
          - not prospective_target_backup.results[1].stat.exists

    - name: Check free bytes on protected target backup filesystem
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - >-
            import os;
            v=os.statvfs('/var/backups/homelab-network-migration');
            print(v.f_bavail*v.f_frsize)
      changed_when: false
      register: destination_free_bytes

    - name: Require at least 100 MiB of target free backup capacity
      ansible.builtin.assert:
        that:
          - destination_free_bytes.stdout | int >= 104857600

- name: Freeze only the former Proxmox-2 discovery ownership after explicit approval
  hosts: Proxmox-2
  become: true
  gather_facts: true
  vars:
    state_root: /var/lib/homelab-network-hosts
    backup_parent: /var/backups/homelab-network-migration
    freeze_dir: "{{ backup_parent }}/gate3-freeze-{{ gate3_transaction | default('NOT_AUTHORISED') }}"
    guarded_files:
      - inventory.json
      - deep-profiles.json
      - enrichment.json
      - alerted-macs.json
    all_timers:
      - homelab-network-host-collector.timer
      - homelab-network-host-enricher.timer
      - homelab-network-host-deep-profiler.timer
      - homelab-network-os-evidence.timer
    all_services:
      - homelab-network-host-collector.service
      - homelab-network-host-enricher.service
      - homelab-network-host-deep-profiler.service
      - homelab-network-os-evidence.service
  tasks:
    - name: Require exact per-transaction human approval, never a permissive default
      ansible.builtin.assert:
        that:
          - gate3_allow_source_freeze | default(false) | bool
          - gate3_transaction is defined
          - gate3_transaction is match('^gate3-[0-9]{8}T[0-9]{6}Z$')
          - gate3_acknowledge_discovery_pause | default('') == 'YES_PAUSE_PROXMOX2_NETWORK_DISCOVERY'
          - inventory_hostname == 'Proxmox-2'
          - ansible_facts.hostname == 'Proxmox-2'
          - ansible_facts.default_ipv4.address == '192.168.2.71'
        fail_msg: >-
          Gate 3b is NOT authorised. Review production cutover window,
          rollback state and source notification continuity first.

    - name: Reject an existing freeze directory or any previous run for this transaction
      ansible.builtin.stat:
        path: "{{ freeze_dir }}"
        follow: false
      register: prior_freeze

    - name: Refuse to overwrite any earlier freeze, including interrupted operations
      ansible.builtin.assert:
        that:
          - not prior_freeze.stat.exists

    - name: Capture exact four source timer states for eventual controlled rollback
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-enabled, "{{ item }}"]
      loop: "{{ all_timers }}"
      changed_when: false
      failed_when: false
      register: source_timer_before

    - name: Require the three historically active source timers are enabled
      ansible.builtin.assert:
        that:
          - source_timer_before.results[0].stdout == 'enabled'
          - source_timer_before.results[1].stdout == 'enabled'
          - source_timer_before.results[3].stdout == 'enabled'
          - source_timer_before.results[2].stdout in ['enabled', 'disabled']

    - name: Refuse an unsafe source backup directory
      ansible.builtin.stat:
        path: "{{ backup_parent }}"
        follow: false
      register: backup_parent_meta

    - name: Require root-owned real backup directory
      ansible.builtin.assert:
        that:
          - backup_parent_meta.stat.isdir | default(false)
          - not (backup_parent_meta.stat.islnk | default(false))
          - backup_parent_meta.stat.pw_name == 'root'

    - name: Check free bytes on protected source backup filesystem
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - >-
            import os;
            v=os.statvfs('/var/backups/homelab-network-migration');
            print(v.f_bavail*v.f_frsize)
      changed_when: false
      register: source_free_bytes

    - name: Require at least 100 MiB of source backup capacity before stop
      ansible.builtin.assert:
        that:
          - source_free_bytes.stdout | int >= 104857600

    - name: Create unique root-only transaction backup before stopping timers
      ansible.builtin.file:
        path: "{{ freeze_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Preserve exact pre-freeze timer enablement BEFORE any timer changes
      ansible.builtin.copy:
        dest: "{{ freeze_dir }}/prior-timers.json"
        content: >-
          {{ {
             'transaction': gate3_transaction,
             'phase': 'pre_stop',
             'prior_timer_enabled': dict(all_timers | zip(source_timer_before.results | map(attribute='stdout') | list))
          } | to_nice_json }}
        owner: root
        group: root
        mode: '0600'
        force: false
      no_log: true

    - name: Stop and disable only four OLD source network-discovery timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ all_timers }}"

    - name: Drain already started source oneshot jobs and their notification post-hook
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, "{{ item }}"]
      loop: "{{ all_services }}"
      register: source_drained
      changed_when: false
      failed_when: false
      until: source_drained.stdout == 'inactive'
      retries: 60
      delay: 30

    - name: Recheck all four source timers disabled after jobs have finished
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-enabled, "{{ item }}"]
      loop: "{{ all_timers }}"
      register: source_frozen_enabled
      changed_when: false
      failed_when: false

    - name: Recheck all four source timers inactive after jobs have finished
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, "{{ item }}"]
      loop: "{{ all_timers }}"
      register: source_frozen_active
      changed_when: false
      failed_when: false

    - name: Refuse a partial source stop or another scheduled collector
      ansible.builtin.assert:
        that:
          - item[0].stdout == 'disabled'
          - item[1].stdout == 'inactive'
      loop: "{{ source_frozen_enabled.results | zip(source_frozen_active.results) | list }}"
      loop_control:
        label: "{{ item[0].item }}"

    - name: Verify source JSON and alert registry are still consistent after freeze
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - |
            import json
            from pathlib import Path
            base = Path("/var/lib/homelab-network-hosts")
            inv = json.loads((base/"inventory.json").read_text())
            deep = json.loads((base/"deep-profiles.json").read_text())
            enriched = json.loads((base/"enrichment.json").read_text())
            reg = json.loads((base/"alerted-macs.json").read_text())
            if not isinstance(inv, dict) or not inv:
                raise ValueError("Source inventory missing or malformed")
            if not isinstance(deep.get("profiles"), dict):
                raise ValueError("Missing historical deep profiles")
            if not isinstance(enriched.get("hosts"), dict):
                raise ValueError("Missing historical enrichment")
            if reg.get("version") != 1 or not isinstance(reg.get("devices"), dict):
                raise ValueError("Unexpected source first-seen registry")
            keys = set(reg["devices"])
            present = {str(v.get("mac","")).strip().lower()
                       for v in inv.values() if isinstance(v,dict) and v.get("mac")}
            online = {str(v.get("mac","")).strip().lower()
                      for v in inv.values() if isinstance(v,dict)
                      and v.get("mac") and v.get("online") is True}
            if present - keys or online - keys:
                raise ValueError("Unrecorded source device: stop for notifier reconciliation")
            print(json.dumps({
                "source_registry": len(keys),
                "source_inventory": len(inv),
                "source_distinct_macs": len(present),
                "source_pending_online": len(online-keys),
                "source_deep_profiles": len(deep["profiles"]),
                "source_enrichment": len(enriched["hosts"]),
            },sort_keys=True))
      changed_when: false
      register: frozen_counts_secret
      no_log: true

    - name: Store only aggregated frozen MAC counts for future transfer validation
      ansible.builtin.set_fact:
        gate3_frozen_counts: "{{ frozen_counts_secret.stdout | from_json }}"
      no_log: true

    - name: Hash four live source JSONs and protected recipient environment
      ansible.builtin.stat:
        path: "{{ '/etc/homelab-network-hosts/alerts.env' if item == 'alerts.env' else state_root ~ '/' ~ item }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ guarded_files + ['alerts.env'] }}"
      register: source_before_copy
      no_log: true

    - name: Require root-only source files for exact final snapshot
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
          - item.stat.size | int > 0
      loop: "{{ source_before_copy.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Copy frozen JSON state and notifier configuration into protected backup
      ansible.builtin.copy:
        src: "{{ '/etc/homelab-network-hosts/alerts.env' if item == 'alerts.env' else state_root ~ '/' ~ item }}"
        dest: "{{ freeze_dir }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
        force: false
      loop: "{{ guarded_files + ['alerts.env'] }}"
      no_log: true

    - name: Verify source backup and unchanged frozen originals
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop: >-
        {{ (guarded_files | map('regex_replace', '^', freeze_dir ~ '/') | list)
           + [freeze_dir ~ '/alerts.env']
           + (guarded_files | map('regex_replace', '^', state_root ~ '/') | list)
           + ['/etc/homelab-network-hosts/alerts.env'] }}
      register: source_after_copy
      no_log: true

    - name: Refuse concurrent source writes or corrupted backup copies
      ansible.builtin.assert:
        that:
          - item[0].stat.checksum == item[1].stat.checksum
          - item[0].stat.checksum == item[2].stat.checksum
          - item[1].stat.pw_name == 'root'
          - item[1].stat.mode == '0600'
        fail_msg: >-
          Frozen source changed during snapshot or backup is corrupt.
          Leave ALL source discovery timers disabled and investigate
          before attempting a separately approved rollback.
      loop: >-
        {{ source_before_copy.results
           | zip(source_after_copy.results[:5], source_after_copy.results[5:])
           | list }}
      loop_control:
        label: "{{ item[0].item }}"

    - name: Persist root-only rollback manifest with exact pre-freeze timer settings
      ansible.builtin.copy:
        dest: "{{ freeze_dir }}/manifest.json"
        content: >-
          {{ {
             'transaction': gate3_transaction,
             'phase': 'source_frozen',
             'prior_timer_enabled': dict(all_timers | zip(source_timer_before.results | map(attribute='stdout') | list)),
             'source_sha256': dict((guarded_files + ['alerts.env']) | zip(source_before_copy.results | map(attribute='stat.checksum') | list)),
             'frozen_counts': gate3_frozen_counts
          } | to_nice_json }}
        owner: root
        group: root
        mode: '0600'
        force: false
      no_log: true

    - name: Report freeze readiness, not approval to enable the target
      ansible.builtin.debug:
        msg:
          - "Source freeze completed for {{ gate3_transaction }}."
          - "ALL original network-only discovery/enrichment/deep/evidence timers are disabled/inactive; existing jobs drained."
          - "Root-only final source snapshot: {{ freeze_dir }}"
          - "Source registry {{ gate3_frozen_counts.source_registry }} entries, inventory {{ gate3_frozen_counts.source_inventory }} records / {{ gate3_frozen_counts.source_distinct_macs }} MACs; zero online pending."
          - "Five exact SHA-256 checks passed; original source files unchanged."
          - "STOP HERE. Target remains disabled. Protected delta sync (Gate 3c) requires a separate explicit approval."
