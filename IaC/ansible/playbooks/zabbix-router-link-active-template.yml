---
# Explicitly authorised router-01 Zabbix template-only test.
# No SSH to router, no agent/firewall restart, no unlink/clear.
- name: Link standard active Zabbix Linux template to router-01
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  tasks:
    - name: Verify monitoring controller identity
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'
          - ansible_facts.hostname == 'monitor-01'

    - name: Install guarded router-01 template link helper
      ansible.builtin.copy:
        src: ../roles/monitoring_stack/files/grafana/link_router_active_template.py
        dest: /usr/local/sbin/homelab-zabbix-router-active-link
        owner: root
        group: root
        mode: "0700"

    - name: Run read-only router-01 template preflight
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-zabbix-router-active-link]
      register: router_active_preflight
      changed_when: false
      no_log: true

    - name: Show safe preflight result
      ansible.builtin.debug:
        msg: "{{ router_active_preflight.stdout_lines }}"

    - name: Add router-01 Linux active template, preserving OS Facts
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-zabbix-router-active-link, --apply]
      register: router_active_apply
      changed_when: "'LINK VERIFIED:' in router_active_apply.stdout"
      no_log: true

    - name: Show safe template-link result
      ansible.builtin.debug:
        msg: "{{ router_active_apply.stdout_lines }}"
