---
- name: Test Docker relay automatic recovery
  hosts: monitoring_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Require explicit recovery test approval
      ansible.builtin.assert:
        that:
          - recovery_test_approved | default(false) | bool
          - inventory_hostname == 'monitor-01'
          - ansible_host == '192.168.2.52'

    - name: Verify recovery timer is not running
      ansible.builtin.command:
        argv: [systemctl, is-active, router-metrics-relay-reconcile.timer]
      register: timer_state
      changed_when: false
      failed_when: false

    - name: Require inactive timer
      ansible.builtin.assert:
        that:
          - timer_state.stdout | trim == 'inactive'

    - name: Test relay recovery
      block:
        - name: Stop only the Docker relay container
          ansible.builtin.command:
            argv: [docker, stop, router-metrics-relay]
          changed_when: true

        - name: Run reconciliation
          ansible.builtin.command:
            argv: [timeout, 60, /usr/local/sbin/router-metrics-relay-reconcile]
          register: recovered
          changed_when: true

        - name: Require recovery reported
          ansible.builtin.assert:
            that:
              - "'RELAY_RECONCILIATION=RECOVERED' in recovered.stdout"

      always:
        - name: Ensure relay reconciliation attempted
          ansible.builtin.command:
            argv: [timeout, 60, /usr/local/sbin/router-metrics-relay-reconcile]
          register: final_recovery
          changed_when: false

        - name: Verify router Prometheus metric
          ansible.builtin.uri:
            url: http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22router-node-exporter%22%7D
            return_content: true
          register: router_query
          until: >-
            router_query.json.data.result | default([]) | length == 1
            and router_query.json.data.result[0].value[1] == '1'
          retries: 8
          delay: 5
          changed_when: false

        - name: Report final recovery
          ansible.builtin.debug:
            msg: "DOCKER_RELAY_RECOVERY_TEST=PASS"
