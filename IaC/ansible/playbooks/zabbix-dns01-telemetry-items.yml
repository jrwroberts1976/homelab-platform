---
# Exact two active Zabbix items for the already validated dns-01 Agent 2
# UserParameters. Default is API read-only audit; never change templates.
- name: Audit or enable dns-01 patch and temperature Zabbix items
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  vars:
    dns01_telemetry_items_apply: false
  tasks:
    - name: Enforce monitor-01 sole target
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'
          - ansible_play_hosts_all | length == 1
          - ansible_facts.hostname == 'monitor-01'

    - name: Install dns-01 guarded Zabbix item reconciler
      ansible.builtin.copy:
        src: ../roles/monitoring_stack/files/grafana/reconcile_zabbix_dns01_telemetry.py
        dest: /usr/local/sbin/homelab-zabbix-dns01-telemetry-items
        owner: root
        group: root
        mode: "0700"

    - name: Preview exact two dns-01 items without writing Zabbix
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-zabbix-dns01-telemetry-items]
      register: dns01_items_preview
      changed_when: false

    - name: Show Zabbix item audit
      ansible.builtin.debug:
        msg: "{{ dns01_items_preview.stdout_lines }}"

    - name: Create missing items only on explicit approval
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/homelab-zabbix-dns01-telemetry-items, --apply]
      register: dns01_items_apply_output
      changed_when: "'CREATED AND VERIFIED:' in dns01_items_apply_output.stdout"
      when: dns01_telemetry_items_apply | bool

    - name: Show item create outcome
      ansible.builtin.debug:
        msg: "{{ dns01_items_apply_output.stdout_lines }}"
      when: dns01_telemetry_items_apply | bool
