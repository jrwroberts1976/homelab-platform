---
# Stage persistent boot-migration inputs and recovery snapshots only.
# No active Netplan, PPPoE, firewall, DHCP, DNS, Docker or timer changes.
- name: Stage router reboot migration safely on old management LAN
  hosts: docker-01
  gather_facts: false
  become: true
  vars:
    router_reboot_stage_approved: false
    router_stage_dir: /var/lib/router-01-reboot-migration
  pre_tasks:
    - name: Explicit gate and fixed original management target
      ansible.builtin.assert:
        that:
          - router_reboot_stage_approved | bool
          - inventory_hostname == 'docker-01'
          - ansible_host == '192.168.2.220'
        fail_msg: "Requires approved stage and exact original docker-01 inventory."
      delegate_to: localhost
      become: false

    - name: Verify original management address still exists
      ansible.builtin.command:
        argv: [ip, -4, -o, address, show, dev, eth0]
      register: router_old_ip
      changed_when: false
      failed_when: "'192.168.2.220/24' not in router_old_ip.stdout"

    - name: Verify both network interface MACs
      ansible.builtin.command:
        argv: [cat, "/sys/class/net/{{ item.device }}/address"]
      loop:
        - { device: eth0, address: 'd8:3a:dd:5a:51:44' }
        - { device: eth1, address: '00:24:9b:63:b3:8a' }
      register: router_macs
      changed_when: false
      failed_when: router_macs.stdout | trim != item.address

    - name: Require old and new timers inactive
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - router-lan-switch.timer
        - router-lan-rollback.timer
        - router-dhcp-trial-activate.timer
        - router-dhcp-trial-rollback.timer
      register: router_timers
      changed_when: false
      failed_when: router_timers.stdout | trim == 'active'

    - name: Confirm Kea and Unbound remain masked
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "{{ item }}"]
      loop:
        - kea-dhcp4-server.service
        - unbound.service
      register: router_masked
      changed_when: false
      failed_when: router_masked.stdout | trim != 'masked'

    - name: Verify Docker is not running
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - docker.service
        - docker.socket
        - containerd.service
      register: router_docker
      changed_when: false
      failed_when: router_docker.stdout | trim == 'active'

    - name: Verify existing recovery source files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/netplan/90-NM-75a1216a-9d1a-30cd-8aca-ace5526ec021.yaml
        - /etc/kea/kea-dhcp4.conf
        - /etc/unbound/unbound.conf.d/router-01.conf
        - /etc/ppp/peers/homelab-wan
      register: router_source_files

    - name: Require source files are present
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
      loop: "{{ router_source_files.results }}"

    - name: Check no prior new-LAN overlay is installed
      ansible.builtin.stat:
        path: /etc/netplan/99-router-01-lan.yaml
      register: router_live_overlay

    - name: Refuse already-applied migration
      ansible.builtin.assert:
        that:
          - not (router_live_overlay.stat.exists | default(false))

  tasks:
    - name: Create private preparation and recovery directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ router_stage_dir }}"
        - "{{ router_stage_dir }}/boot"
        - "{{ router_stage_dir }}/backup"
        - "{{ router_stage_dir }}/validation"

    - name: Preserve original Netplan file for recovery
      ansible.builtin.copy:
        src: /etc/netplan/90-NM-75a1216a-9d1a-30cd-8aca-ace5526ec021.yaml
        dest: "{{ router_stage_dir }}/backup/old-eth0.yaml"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
        force: false
      no_log: true

    - name: Preserve original on-disk nftables config if present
      ansible.builtin.stat:
        path: /etc/nftables.conf
      register: router_live_nft

    - name: Save original on-disk nftables configuration
      ansible.builtin.copy:
        src: /etc/nftables.conf
        dest: "{{ router_stage_dir }}/backup/old-nftables.conf"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
        force: false
      when: router_live_nft.stat.isreg | default(false)

    - name: Snapshot currently loaded firewall without modifying it
      ansible.builtin.shell: |
        set -e
        if test ! -e "{{ router_stage_dir }}/backup/old-running-rules.nft"; then
          { echo 'flush ruleset'; nft list ruleset; } > "{{ router_stage_dir }}/backup/old-running-rules.nft"
          chmod 0600 "{{ router_stage_dir }}/backup/old-running-rules.nft"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Stage persistent static LAN configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../router-01/files/router-lan-netplan-override.yaml"
        dest: "{{ router_stage_dir }}/boot/99-router-01-lan.yaml"
        owner: root
        group: root
        mode: '0600'

    - name: Stage persistent unmanaged PPP WAN policy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../router-01/files/90-router-01-wan-unmanaged.conf"
        dest: "{{ router_stage_dir }}/boot/90-router-01-wan-unmanaged.conf"
        owner: root
        group: root
        mode: '0600'

    - name: Stage router firewall for offline validation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../router-01/templates/nftables-pppoe-inplace.conf.j2"
        dest: "{{ router_stage_dir }}/boot/nftables.conf"
        owner: root
        group: root
        mode: '0600'

    - name: Stage IPv4 forwarding configuration
      ansible.builtin.copy:
        content: "net.ipv4.ip_forward=1\n"
        dest: "{{ router_stage_dir }}/boot/90-router-01-forwarding.conf"
        owner: root
        group: root
        mode: '0600'

    - name: Create isolated Netplan validation directory
      ansible.builtin.file:
        path: "{{ router_stage_dir }}/validation/etc/netplan"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy current Netplan inputs and proposed overlay to private test root
      ansible.builtin.shell: |
        set -e
        cp -a /etc/netplan/*.yaml "{{ router_stage_dir }}/validation/etc/netplan/"
        cp "{{ router_stage_dir }}/boot/99-router-01-lan.yaml" "{{ router_stage_dir }}/validation/etc/netplan/99-router-01-lan.yaml"
        chmod 0600 "{{ router_stage_dir }}/validation/etc/netplan/"*.yaml
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true

    - name: Check proposed Netplan configuration offline
      ansible.builtin.command:
        argv: [netplan, generate, --root-dir, "{{ router_stage_dir }}/validation"]
      changed_when: false

    - name: Check Kea syntax
      ansible.builtin.command:
        argv: [kea-dhcp4, -t, /etc/kea/kea-dhcp4.conf]
      changed_when: false

    - name: Check Unbound syntax
      ansible.builtin.command:
        argv: [unbound-checkconf]
      changed_when: false

    - name: Check staged router nftables syntax without loading it
      ansible.builtin.command:
        argv: [nft, -c, -f, "{{ router_stage_dir }}/boot/nftables.conf"]
      changed_when: false

    - name: Report stage result and deliberately leave network unchanged
      ansible.builtin.debug:
        msg:
          - "STAGED ONLY: router config and recovery input snapshots placed in {{ router_stage_dir }}."
          - "NO reboot or boot activation service installed. No DHCP, DNS, NAT or LAN address changed."
          - "Do NOT move cables or reboot expecting new router mode."
