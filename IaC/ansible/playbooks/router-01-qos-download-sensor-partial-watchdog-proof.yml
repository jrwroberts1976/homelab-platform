---
# Approval-gated test only; confined to sensor-01 disposable namespace.
- name: Prove partial IFB install independent watchdog cleanup on sensor-01
  hosts: sensor-01
  become: true
  gather_facts: true
  vars:
    qos_sensor_partial_watchdog_proof_approved: false
    proof_script: /run/qos-sensor-independent-proof.sh
  tasks:
    - name: Require approval and expected sensor host network
      ansible.builtin.assert:
        that:
          - qos_sensor_partial_watchdog_proof_approved | bool
          - not ansible_check_mode
          - inventory_hostname == 'sensor-01'
          - ansible_facts.hostname == 'sensor-01'
          - ansible_facts.default_ipv4.interface == 'eth0'
          - ansible_facts.default_ipv4.gateway == '192.168.2.1'

    - name: Refuse any pre-existing reserved namespace or watchdog resources
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          test ! -e /run/qos-proof31
          test ! -e /run/qos-proof31-test.sh
          ! ip netns list | grep -Eq '^qos-proof31( |$)'
          test -z "$(systemctl list-units --all --plain --no-legend 'qos-proof31-rollback*' | grep -v '^$' || true)"
          test -z "$(systemctl list-unit-files --no-legend 'qos-proof31-rollback*' | grep -v '^$' || true)"
          test ! -L /run/qos-sensor-independent-proof.sh
          if test -e /run/qos-sensor-independent-proof.sh; then
            test -f /run/qos-sensor-independent-proof.sh
            test "$(stat -c %u:%g:%a /run/qos-sensor-independent-proof.sh)" = '0:0:700'
          fi
      changed_when: false

    - name: Stage test, run proof, and verify cleanup
      block:
        - name: Remove previously orphaned standalone source after clean preflight
          ansible.builtin.file:
            path: "{{ proof_script }}"
            state: absent

        - name: Copy temporary isolated test script
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../files/router-qos-sensor-independent-proof.sh"
            dest: "{{ proof_script }}"
            owner: root
            group: root
            mode: '0700'

        - name: Validate staged Bash script
          ansible.builtin.command:
            argv: [/bin/bash, -n, "{{ proof_script }}"]
          changed_when: false

        - name: Run independent watchdog proof
          ansible.builtin.command:
            argv: [/bin/bash, "{{ proof_script }}", run-partial]
          register: proof_output
          changed_when: true

        - name: Assert expected watchdog evidence
          ansible.builtin.assert:
            that:
              - "'INSTALLER_KILLED' in proof_output.stdout"
              - "'WATCHDOG_ROLLBACK_PASS' in proof_output.stdout"
              - "'PARTIAL_INSTALLER_KILLED' in proof_output.stdout"
              - "'PARTIAL_WATCHDOG_ROLLBACK_PASS' in proof_output.stdout"

      always:
        - name: Check whether staged test source exists
          ansible.builtin.stat:
            path: "{{ proof_script }}"
          register: staged_proof

        - name: Run guarded cleanup when staged source exists
          ansible.builtin.command:
            argv: [/bin/bash, "{{ proof_script }}", cleanup]
          when: staged_proof.stat.exists
          register: cleanup
          changed_when: cleanup.rc == 0

        - name: Verify watchdog service not running
          ansible.builtin.command:
            argv: [systemctl, is-active, qos-proof31-rollback.service]
          register: watchdog_status
          changed_when: false
          failed_when: watchdog_status.stdout in ['active', 'activating', 'deactivating']

        - name: Verify watchdog timer not armed
          ansible.builtin.command:
            argv: [systemctl, is-active, qos-proof31-rollback.timer]
          register: watchdog_timer_status
          changed_when: false
          failed_when: watchdog_timer_status.stdout in ['active', 'activating', 'deactivating']

        - name: Verify watchdog executable absent
          ansible.builtin.stat:
            path: /run/qos-proof31-test.sh
          register: retained_watchdog

        - name: Require watchdog executable was cleaned
          ansible.builtin.assert:
            that:
              - not retained_watchdog.stat.exists

        - name: Verify disposable namespace absent
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              ! ip netns list | grep -Eq '^qos-proof31( |$)'
          changed_when: false

        - name: Remove staged source once recovery is complete
          ansible.builtin.file:
            path: "{{ proof_script }}"
            state: absent

        - name: Remove owned evidence directory after verified cleanup
          ansible.builtin.file:
            path: /run/qos-proof31
            state: absent
