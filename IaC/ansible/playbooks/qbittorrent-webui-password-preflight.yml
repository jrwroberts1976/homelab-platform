---
# Read-only qBittorrent WebUI password recovery preflight.
# No password hashes, temporary passwords, journal contents or credentials
# are emitted. Does not stop/restart qBittorrent or touch the firewall.
- name: Diagnose qBittorrent WebUI administrator access without exposing secrets
  hosts: media_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Require active qBittorrent service
      ansible.builtin.command:
        argv: [systemctl, is-active, qbittorrent.service]
      register: qbt_password_service
      changed_when: false
      failed_when: qbt_password_service.stdout | trim != 'active'

    - name: Require established qBittorrent configuration file
      ansible.builtin.stat:
        path: /var/lib/qbittorrent/.config/qBittorrent/qBittorrent.conf
      register: qbt_password_config

    - name: Refuse diagnostics for missing qBittorrent configuration
      ansible.builtin.assert:
        that:
          - qbt_password_config.stat.isreg | default(false)
        fail_msg: qBittorrent preferences file is absent; refusing to assume state.

    - name: Report stored password status without credential values
      ansible.builtin.shell: |
        python3 - <<'PY'
        from pathlib import Path
        path = Path('/var/lib/qbittorrent/.config/qBittorrent/qBittorrent.conf')
        keys = {
            'WebUI\\Password_PBKDF2',
            'WebUI\\Password_ha1',
        }
        present = False
        for line in path.read_text(errors='replace').splitlines():
            if '=' in line and line.split('=', 1)[0].strip() in keys:
                present = True
                break
        print('STORED_WEBUI_PASSWORD=' + ('yes' if present else 'no'))
        PY
      args:
        executable: /bin/bash
      register: qbt_password_stored
      changed_when: false

    - name: Check current systemd invocation for logged temporary password
      ansible.builtin.shell: |
        set -eu
        invocation="$(systemctl show qbittorrent.service -p InvocationID --value)"
        if test -z "$invocation"; then
          echo 'CURRENT_SESSION_TEMP_PASSWORD_LOGGED=unknown'
        else
          journalctl --no-pager -o cat "_SYSTEMD_INVOCATION_ID=$invocation" |
            python3 -c 'import sys; found="temporary password is provided for this session:" in sys.stdin.read().lower(); print("CURRENT_SESSION_TEMP_PASSWORD_LOGGED=" + ("yes" if found else "no"))'
        fi
      args:
        executable: /bin/bash
      register: qbt_password_temporary
      changed_when: false

    - name: Report non-secret WebUI access status
      ansible.builtin.debug:
        msg:
          - "{{ qbt_password_stored.stdout }}"
          - "{{ qbt_password_temporary.stdout }}"
          - "QBITTORRENT_SERVICE=active"
          - "No service restart, password edit or firewall change performed."
