---
- name: Discover existing router metrics relay for QoS integration
  hosts: monitor-01
  become: true
  gather_facts: false
  tasks:
    - name: Inspect established router metrics forwarding configuration
      ansible.builtin.shell: |
        echo '=== RELAY LISTENER ==='
        ss -lntp '( sport = :19101 )' || true
        echo '=== RELAY PROCESSES ==='
        ps -eww -o pid,args | grep -E '[n]ode_exporter|[r]outer-metrics|[s]ocat.*19101|[s]sh.*19101' || true
        echo '=== RELAY UNITS ==='
        systemctl list-units --all --no-pager --plain '*router*metrics*' || true
        echo '=== EXISTING METRICS PREFIXES ==='
        curl -fsS --max-time 5 http://127.0.0.1:19101/metrics | grep -E '^(node_|homelab_router_qos_)' | head -n 12 || true
        echo '=== PROMETHEUS RELAY TARGET ==='
        curl -fsSG --max-time 5 http://127.0.0.1:9090/api/v1/query --data-urlencode 'query=up{job="router-node-exporter"}'
      args:
        executable: /bin/bash
      changed_when: false
      register: result
    - name: Show read-only relay discovery
      ansible.builtin.debug:
        var: result.stdout_lines
