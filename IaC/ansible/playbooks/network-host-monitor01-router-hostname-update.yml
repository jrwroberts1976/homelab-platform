---
- name: Deploy ASUS DHCP hostname fallback to monitor-01 discovery
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  vars:
    collector_defaults:
      "{{ playbook_dir }}/../roles/network_host_collector/defaults/main.yml"

  tasks:
    - name: Validate monitor-01 target
      ansible.builtin.assert:
        that:
          - inventory_hostname == "monitor-01"
          - ansible_facts.hostname == "monitor-01"
          - ansible_facts.default_ipv4.address == "192.168.2.52"
          - ansible_facts.default_ipv4.interface == "eth0"

    - name: Load collector defaults
      ansible.builtin.include_vars:
        file: "{{ collector_defaults }}"

    - name: Use commissioned monitor-01 collector interface
      ansible.builtin.set_fact:
        network_host_collector_interface: eth0

    - name: Load ASUS inventory defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/asus_network_inventory/defaults/main.yml"

    - name: Verify ASUS inventory database exists
      ansible.builtin.stat:
        path: "{{ asus_network_inventory_database }}"
      register: router_inventory_database

    - name: Require ASUS router evidence database
      ansible.builtin.assert:
        that:
          - router_inventory_database.stat.isreg | default(false)
        fail_msg: >-
          ASUS inventory database is missing; refusing to deploy hostname
          fallback until router evidence is available.

    - name: Install updated ASUS inventory collector
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/asus_network_inventory/templates/asus-network-inventory.py.j2"
        dest: /usr/local/sbin/asus-network-inventory
        owner: root
        group: root
        mode: "0755"

    - name: Install updated ASUS inventory service
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/asus_network_inventory/templates/asus-network-inventory.service.j2"
        dest: /etc/systemd/system/asus-network-inventory.service
        owner: root
        group: root
        mode: "0644"
      register: asus_inventory_service_update

    - name: Validate ASUS collector syntax
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - py_compile
          - /usr/local/sbin/asus-network-inventory
      changed_when: false

    - name: Reload systemd when ASUS service changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: asus_inventory_service_update.changed

    - name: Install updated collector only
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/network_host_collector/templates/homelab-network-host-collector.py.j2"
        dest: "{{ network_host_collector_script }}"
        owner: root
        group: root
        mode: "0755"
      register: collector_update

    - name: Validate collector syntax
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - py_compile
          - "{{ network_host_collector_script }}"
      changed_when: false

    - name: Refresh ASUS inventory and publish hostname snapshot
      ansible.builtin.systemd_service:
        name: asus-network-inventory.service
        state: started

    - name: Verify ASUS hostname snapshot exists
      ansible.builtin.stat:
        path: "{{ asus_network_inventory_hostname_snapshot }}"
      register: router_hostname_snapshot

    - name: Require populated ASUS hostname snapshot
      ansible.builtin.assert:
        that:
          - router_hostname_snapshot.stat.isreg | default(false)
          - router_hostname_snapshot.stat.size | int > 0
        fail_msg: >-
          ASUS hostname snapshot was not created; refusing discovery pass.

    - name: Run one discovery pass with router hostname evidence
      ansible.builtin.systemd_service:
        name: "{{ network_host_collector_service }}"
        state: started

    - name: Resume network evidence timers after controlled purge
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop:
        - homelab-network-host-collector.timer
        - homelab-network-host-enricher.timer
        - homelab-network-host-deep-profiler.timer
        - homelab-network-dns-evidence.timer
        - asus-network-inventory.timer

    - name: Verify all resumed timers are active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}"
      loop:
        - homelab-network-host-collector.timer
        - homelab-network-host-enricher.timer
        - homelab-network-host-deep-profiler.timer
        - homelab-network-dns-evidence.timer
        - asus-network-inventory.timer
      register: resumed_timers
      changed_when: false
      failed_when: resumed_timers.stdout != "active"
