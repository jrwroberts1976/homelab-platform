---
# ACTUAL ISP WAN handover test: physical ONT cable MUST have been moved from
# ASUS WAN to Pi4 USB eth1. User accepts outage of old ASUS internet.
# Does NOT readdress Pi eth0 (.2.220); no router LAN DHCP is started here.
- name: Authenticate new Pi4 PPPoE WAN while keeping the old SSH LAN
  hosts: docker-01
  gather_facts: false
  become: true
  vars:
    router_pppoe_connect_approved: false
    router_expected_wan_mac: "00:24:9b:63:b3:8a"
  pre_tasks:
    - name: Require explicit external-ONT move and ISP outage approval locally
      ansible.builtin.assert:
        that:
          - router_pppoe_connect_approved | bool
          - inventory_hostname == 'docker-01'
          - ansible_host == '192.168.2.220'
        fail_msg: >-
          Default deny: move ONT cable physically from ASUS WAN to Pi USB eth1,
          accept ASUS internet outage, then explicitly approve PPPoE test.
      delegate_to: localhost
      become: false

    - name: Gather live Pi facts after operator approval
      ansible.builtin.setup:

    - name: Require SSH on old 192.168.2.220 and exact WAN MAC
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'docker-01'
          - "'192.168.2.220' in ansible_facts.all_ipv4_addresses"
          - (ansible_facts.get('eth1', {}).get('macaddress', '') | lower) == (router_expected_wan_mac | lower)

    - name: Verify installed PPPoE peer exists (no credentials read)
      ansible.builtin.stat:
        path: /etc/ppp/peers/homelab-wan
      register: router_pppoe_peer

    - name: Refuse if PPPoE was not installed first
      ansible.builtin.assert:
        that:
          - router_pppoe_peer.stat.isreg | default(false)
          - router_pppoe_peer.stat.mode == '0600'
        fail_msg: "Run router-01-pppoe-install-inplace.yml first."

    - name: Check physical USB eth1 carrier after ONT patching
      ansible.builtin.command:
        argv: [cat, /sys/class/net/eth1/carrier]
      register: router_eth1_carrier
      changed_when: false
      failed_when: router_eth1_carrier.stdout | trim != '1'

    - name: Require same old eth0 NetworkManager profile
      ansible.builtin.command:
        argv: [nmcli, -g, GENERAL.CONNECTION, device, show, eth0]
      register: router_pppoe_old_lan
      changed_when: false
      failed_when: router_pppoe_old_lan.stdout | trim != 'netplan-eth0'

  tasks:
    - name: Allow physical raw WAN to be controlled by pppd, not NetworkManager
      ansible.builtin.command:
        argv: [nmcli, device, set, eth1, managed, 'no']
      changed_when: true
      # eth0 is left untouched. This device-level setting must later be made persistent.

    - name: Bring up raw WAN link only
      ansible.builtin.command:
        argv: [ip, link, set, dev, eth1, up]
      changed_when: true

    - name: Start PPPoE WAN service and enable across reboot
      ansible.builtin.systemd_service:
        name: router-pppoe.service
        enabled: true
        state: started

    - name: Wait for PPPoE to negotiate an IPv4 address on ppp0
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, ppp0]
      register: router_ppp0_address
      retries: 12
      delay: 5
      until: router_ppp0_address.rc == 0 and 'inet ' in router_ppp0_address.stdout
      changed_when: false

    - name: Check ppp0 default route without testing arbitrary internet host
      ansible.builtin.command:
        argv: [ip, -4, route, show, default]
      register: router_pppoe_default_route
      changed_when: false
      failed_when: "'dev ppp0' not in router_pppoe_default_route.stdout"

    - name: Check that old LAN management address is preserved
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, eth0]
      register: router_pppoe_preserve_eth0
      changed_when: false
      failed_when: "'192.168.2.220/24' not in router_pppoe_preserve_eth0.stdout"

    - name: Report PPPoE ready, but LAN routing/DHCP not yet active
      ansible.builtin.debug:
        msg:
          - "PASS: PPPoE authenticated; ppp0 has ISP-negotiated IPv4 and default route."
          - "Pi eth0 is still SSH reachable at 192.168.2.220."
          - "Existing ASUS WAN is disconnected from ONT by design."
          - "NO Kea DHCP/Unbound/NAT forwarding or .3.1 LAN cutover yet."
