---
# Controller-only fixture tests. Never connects to router-01 or changes networking.
- name: Exercise locked download QoS failure simulator
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    simulator: "{{ playbook_dir }}/../files/router-qos-download-reconcile-fixture.py"
    fixture_dir: /tmp/router-qos-download-actuator-fixture
  tasks:
    - name: Check Python syntax without writing bytecode
      ansible.builtin.command:
        argv: [python3, -B, -c, "import ast,sys; ast.parse(open(sys.argv[1]).read())", "{{ simulator }}"]
      changed_when: false
    - name: Check disposable fixture directory does not already exist
      ansible.builtin.stat:
        path: "{{ fixture_dir }}"
      register: existing
    - name: Refuse to overwrite existing fixture evidence
      ansible.builtin.assert:
        that:
          - not existing.stat.exists
    - name: Run isolated fixture scenarios
      block:
        - name: Create disposable fixture directory
          ansible.builtin.file:
            path: "{{ fixture_dir }}"
            state: directory
            mode: '0700'
        - name: Simulate initial PPP up
          ansible.builtin.command:
            argv: [python3, "{{ simulator }}", --lock, "{{ fixture_dir }}/lock", --state, "{{ fixture_dir }}/state.json", --event, up]
          register: up
          changed_when: true
        - name: Assert rollback armed before attachment
          ansible.builtin.assert:
            that:
              - "(up.stdout | from_json).actions == ['arm_rollback', 'create_ifb', 'attach_ingress']"
              - "(up.stdout | from_json).state.attached"
        - name: Simulate repeated PPP up
          ansible.builtin.command:
            argv: [python3, "{{ simulator }}", --lock, "{{ fixture_dir }}/lock", --state, "{{ fixture_dir }}/state.json", --event, up]
          register: repeated
          changed_when: true
        - name: Assert duplicate is a no-op
          ansible.builtin.assert:
            that:
              - "(repeated.stdout | from_json).actions == ['noop']"
        - name: Simulate PPP down
          ansible.builtin.command:
            argv: [python3, "{{ simulator }}", --lock, "{{ fixture_dir }}/lock", --state, "{{ fixture_dir }}/state.json", --event, down]
          register: down
          changed_when: true
        - name: Assert all owned simulated resources cleared
          ansible.builtin.assert:
            that:
              - "not (down.stdout | from_json).state.attached"
              - "not (down.stdout | from_json).state.ifb"
        - name: Simulate failures at each activation stage
          ansible.builtin.command:
            argv: [python3, "{{ simulator }}", --lock, "{{ fixture_dir }}/{{ item }}.lock", --state, "{{ fixture_dir }}/{{ item }}.json", --event, up, --fail-at, "{{ item }}"]
          loop:
            - arm_rollback
            - create_ifb
            - attach_ingress
          register: failures
          changed_when: true
        - name: Verify each injected failure rolls back simulated state
          ansible.builtin.assert:
            that:
              - "not (item.stdout | from_json).state.attached"
              - "not (item.stdout | from_json).state.ifb"
              - "not (item.stdout | from_json).state.rollback_armed"
              - "'simulated_crash' in (item.stdout | from_json).actions"
          loop: "{{ failures.results }}"
          loop_control:
            label: "{{ item.item }}"
      always:
        - name: Remove only the known disposable fixture directory
          ansible.builtin.file:
            path: "{{ fixture_dir }}"
            state: absent
