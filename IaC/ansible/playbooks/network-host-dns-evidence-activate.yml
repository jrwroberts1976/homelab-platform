---
- name: Activate automatic dual-Pi-hole DNS evidence collection
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  vars:
    network_host_dns_evidence_enable_timer: true
  roles:
    - role: network_host_dns_evidence

- name: Ensure restricted resolver endpoints remain deployed
  hosts: dns_resolvers
  become: true
  gather_facts: true
  vars:
    network_host_dns_evidence_enable_timer: true
  roles:
    - role: network_host_dns_evidence
