---
# Gate 3a. READ-ONLY final planning preflight, not the migration.
#
# Never stop a service, run discovery/Nmap, write target state,
# send an email, install units, or create the cutover approval marker.
# No source MAC, recipient, token, or JSON contents are logged.
#
# Cutover requires a SEPARATE deliberate stop, drain, protected final
# source delta snapshot, target backup+SHA-256 transfer, validation,
# and single-owner activation. THIS PLAYBOOK DOES NOT AUTHORISE IT.
- name: Inspect current Proxmox-2 ownership and live historical notification state
  hosts: Proxmox-2
  become: true
  gather_facts: true
  vars:
    state_dir: /var/lib/homelab-network-hosts
    src_timers:
      - homelab-network-host-collector.timer
      - homelab-network-host-enricher.timer
      - homelab-network-host-deep-profiler.timer
      - homelab-network-os-evidence.timer
    source_files:
      - /var/lib/homelab-network-hosts/inventory.json
      - /var/lib/homelab-network-hosts/deep-profiles.json
      - /var/lib/homelab-network-hosts/enrichment.json
      - /var/lib/homelab-network-hosts/alerted-macs.json
      - /etc/homelab-network-hosts/alerts.env
  tasks:
    - name: Require exactly the existing network-discovery production owner
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'Proxmox-2'
          - ansible_facts.hostname == 'Proxmox-2'
          - ansible_facts.default_ipv4.address == '192.168.2.71'

    - name: Inspect source file permissions and identity without reading values to logs
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ source_files }}"
      register: source_protected_files
      no_log: true

    - name: Require all five original source files are root-only ordinary files
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
          - item.stat.size | int > 0
        fail_msg: >-
          Missing or unsafe source inventory/profile/enrichment/alert
          state. Refuse to plan final transfer.
      loop: "{{ source_protected_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check original scheduled job enablement without changing it
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-enabled, "{{ item }}"]
      loop: "{{ src_timers }}"
      register: source_timer_enabled
      changed_when: false
      failed_when: false

    - name: Check original scheduled job runtime without changing it
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, "{{ item }}"]
      loop: "{{ src_timers }}"
      register: source_timer_active
      changed_when: false
      failed_when: false

    - name: Require collector, enricher and OS publisher remain the active source
      ansible.builtin.assert:
        that:
          - source_timer_enabled.results[0].stdout == 'enabled'
          - source_timer_enabled.results[1].stdout == 'enabled'
          - source_timer_enabled.results[3].stdout == 'enabled'
          - source_timer_active.results[0].stdout == 'active'
          - source_timer_active.results[1].stdout == 'active'
          - source_timer_active.results[3].stdout == 'active'
        fail_msg: >-
          Original ownership has changed. Do not proceed until current
          timer/service state is investigated and rollback states recorded.

    - name: Inspect source collector/enricher/deep/evidence oneshot service status
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - "{{ item }}"
          - -p
          - ActiveState
          - -p
          - Result
          - -p
          - ExecMainStatus
      loop:
        - homelab-network-host-collector.service
        - homelab-network-host-enricher.service
        - homelab-network-host-deep-profiler.service
        - homelab-network-os-evidence.service
      register: source_job_status
      changed_when: false

    - name: Refuse any source service in failed state before considering migration
      ansible.builtin.assert:
        that:
          - "'ActiveState=failed' not in item.stdout"
          - "'Result=failed' not in item.stdout"
        fail_msg: >-
          One of the existing source jobs is failing; review its recent
          execution before any proposed production stop.
      loop: "{{ source_job_status.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify source notifier is still wired and calculate aggregate final-copy requirements
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - |
            import json
            import time
            from pathlib import Path

            base = Path("/var/lib/homelab-network-hosts")
            inventory = json.loads((base / "inventory.json").read_text())
            deep = json.loads((base / "deep-profiles.json").read_text())
            enrich = json.loads((base / "enrichment.json").read_text())
            registry = json.loads((base / "alerted-macs.json").read_text())
            env_text = Path("/etc/homelab-network-hosts/alerts.env").read_text()
            unit_text = Path(
                "/etc/systemd/system/homelab-network-host-collector.service"
            ).read_text()

            if not isinstance(inventory, dict) or len(inventory) < 35:
                raise ValueError("Source inventory unexpectedly incomplete")
            if not isinstance(deep, dict) or not isinstance(deep.get("profiles"), dict):
                raise ValueError("Historical deep profile schema is incorrect")
            if not isinstance(enrich, dict) or not isinstance(enrich.get("hosts"), dict):
                raise ValueError("Historical enrichment schema is incorrect")
            if not isinstance(registry, dict) or registry.get("version") != 1:
                raise ValueError("Unrecognized first-seen alert registry")
            known = registry.get("devices")
            if not isinstance(known, dict) or not known:
                raise ValueError("Historical first-seen registry missing entries")

            statuses = [rec.get("status") for rec in known.values()
                        if isinstance(rec, dict)]
            if len(statuses) != len(known) or any(
                state not in ("baseline", "alerted") for state in statuses
            ):
                raise ValueError("Unknown first-seen alert state")
            unique_macs = {
                str(rec.get("mac") or "").strip().lower()
                for rec in inventory.values()
                if isinstance(rec, dict) and rec.get("mac")
            }
            online_macs = {
                str(rec.get("mac") or "").strip().lower()
                for rec in inventory.values()
                if isinstance(rec, dict) and rec.get("online") is True and rec.get("mac")
            }
            known_macs = set(known)
            missing = len(unique_macs - known_macs)
            pending = len(online_macs - known_macs)
            if missing or pending:
                raise ValueError("Source has inventory MACs missing from first-seen registry")
            recipients = [line.partition("=")[2].strip().strip("'\"")
                          for line in env_text.splitlines()
                          if line.strip().startswith("NETWORK_DEVICE_ALERT_TO=")]
            if len(recipients) != 1 or not recipients[0]:
                raise ValueError("Original notifier recipient is missing")
            if (
                "ExecStartPost=-/usr/local/sbin/homelab-network-device-email-alert"
                not in unit_text or
                "EnvironmentFile=-/etc/homelab-network-hosts/alerts.env"
                not in unit_text
            ):
                raise ValueError("Original collector no longer invokes first-seen alerting")
            # Read only aggregate freshness. It is not evidence of a
            # completed latest collection, merely device observation age.
            last_seen = max(
                (int(r.get("last_seen") or 0) for r in inventory.values()
                 if isinstance(r, dict)), default=0
            )
            print(json.dumps({
                "source_inventory_records": len(inventory),
                "source_inventory_distinct_macs": len(unique_macs),
                "source_profile_records": len(deep["profiles"]),
                "source_enrichment_records": len(enrich["hosts"]),
                "source_registry_macs": len(known),
                "source_baseline": statuses.count("baseline"),
                "source_alerted": statuses.count("alerted"),
                "source_missing_known_macs": missing,
                "source_pending_online_alerts": pending,
                "last_observation_age_seconds": (
                    max(0, int(time.time()) - last_seen) if last_seen else None
                ),
                "recipient_and_source_hook": True
            }, sort_keys=True))
      changed_when: false
      register: source_counts_secret
      no_log: true

    - name: Retain only aggregate counts for cross-host planning
      ansible.builtin.set_fact:
        source_cutover_counts: "{{ source_counts_secret.stdout | from_json }}"
      no_log: true

    - name: Count recent source first-seen delivery errors without displaying journal contents
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - |
            import json
            import subprocess

            proc = subprocess.run(
                ["/usr/bin/journalctl",
                 "-u", "homelab-network-host-collector.service",
                 "--since", "24 hours ago",
                 "--no-pager", "--output=cat"],
                capture_output=True, text=True, timeout=20,
                check=False
            )
            if proc.returncode != 0:
                raise RuntimeError("Unable to inspect source first-seen delivery logs")
            recent_errors = (
                "network_device_alert_send_failed",
                "network_device_alert_error",
                "network_device_alert_recipient_missing",
            )
            # Aggregate-only count, never emit raw MACs, hostnames or SMTP data.
            result = {
                "window_hours": 24,
                "observed_notification_failures": sum(
                    any(name in line for name in recent_errors)
                    for line in proc.stdout.splitlines()
                ),
            }
            print(json.dumps(result, sort_keys=True))
      register: source_delivery_audit_secret
      changed_when: false
      no_log: true

    - name: Keep only aggregate notification error count
      ansible.builtin.set_fact:
        source_delivery_audit: "{{ source_delivery_audit_secret.stdout | from_json }}"
      no_log: true

    - name: Require no outstanding online notifications on current source
      ansible.builtin.assert:
        that:
          - source_cutover_counts.source_registry_macs | int > 0
          - source_cutover_counts.source_pending_online_alerts | int == 0
          - source_cutover_counts.source_missing_known_macs | int == 0
          - source_cutover_counts.recipient_and_source_hook | bool
          - source_delivery_audit.observed_notification_failures | int == 0
        fail_msg: >-
          Resolve outstanding source alerts before any future source freeze.

    - name: Report only aggregate live source state and source timer settings
      ansible.builtin.debug:
        msg:
          - "Source registered MACs: {{ source_cutover_counts.source_registry_macs }} ({{ source_cutover_counts.source_baseline }} baseline, {{ source_cutover_counts.source_alerted }} alerted)."
          - "Source inventory: {{ source_cutover_counts.source_inventory_records }} records / {{ source_cutover_counts.source_inventory_distinct_macs }} MACs; pending online alerts: {{ source_cutover_counts.source_pending_online_alerts }}."
          - "Preserved evidence: {{ source_cutover_counts.source_profile_records }} profile records and {{ source_cutover_counts.source_enrichment_records }} enrichment records."
          - "Observed first-seen delivery errors in prior 24 hours: {{ source_delivery_audit.observed_notification_failures }}."
          - "Latest observed device age (not job success): {{ source_cutover_counts.last_observation_age_seconds }} seconds."
          - "Source timer enablement: {{ source_timer_enabled.results | map(attribute='stdout') | list }}; timer activity: {{ source_timer_active.results | map(attribute='stdout') | list }}."
          - "No source service, notifier, registry or inventory changed."

- name: Verify staged monitor-01 is inert and technically ready for a later protected transfer
  hosts: monitoring_hosts
  become: true
  gather_facts: true
  vars:
    staged_state_dir: /var/lib/homelab-network-hosts
    target_notifier: /usr/local/sbin/homelab-network-device-email-alert
    target_collector_unit: /etc/systemd/system/homelab-network-host-collector.service
    cutover_marker: /etc/homelab-network-hosts/network-discovery-cutover-approved
    original_state:
      - inventory.json
      - deep-profiles.json
      - enrichment.json
      - proxmox-guests.json
    target_timers:
      - homelab-network-host-collector.timer
      - homelab-network-host-enricher.timer
      - homelab-network-host-deep-profiler.timer
      - homelab-network-os-evidence.timer
      - homelab-proxmox-guest-refresh.timer
  tasks:
    - name: Require the commissioned VM interface and source-address route
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'
          - ansible_facts.hostname == 'monitor-01'
          - ansible_facts.default_ipv4.address == '192.168.2.52'
          - ansible_facts.default_ipv4.interface == 'eth0'

    - name: Inspect LAN route without discovery or any network probes
      ansible.builtin.command:
        argv: [/usr/sbin/ip, -4, route, get, '192.168.2.1']
      register: target_gateway_route
      changed_when: false

    - name: Reject target route or source-address drift
      ansible.builtin.assert:
        that:
          - "'dev eth0' in target_gateway_route.stdout"
          - "'src 192.168.2.52' in target_gateway_route.stdout"

    - name: Inspect all protected staged JSON, inert notifier and cutover collision paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop:
        - "{{ staged_state_dir }}/inventory.json"
        - "{{ staged_state_dir }}/deep-profiles.json"
        - "{{ staged_state_dir }}/enrichment.json"
        - "{{ staged_state_dir }}/proxmox-guests.json"
        - "{{ target_notifier }}"
        - /etc/homelab-network-hosts/alerts.env
        - "{{ staged_state_dir }}/alerted-macs.json"
        - "{{ cutover_marker }}"
        - "{{ target_collector_unit }}"
        - /etc/homelab-network-hosts/proxmox-api.env
        - /etc/homelab-network-hosts/proxmox-ca.pem
        - /usr/local/sbin/homelab-proxmox-guest-mac-refresh
        - /usr/local/sbin/homelab-proxmox-guest-refresh-wrapper
        - /etc/systemd/system/homelab-proxmox-guest-refresh.service
        - /etc/systemd/system/homelab-proxmox-guest-refresh.timer
      register: target_files
      no_log: true

    - name: Require all four original staged state files root-only and intact
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
          - item.stat.size | int > 0
        fail_msg: >-
          Missing or unsafe staged JSON. Never attempt a live cutover
          until the target historical data is reconciled.
      loop: "{{ target_files.results[:4] }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require inert approved notifier and no premature target alert ownership
      ansible.builtin.assert:
        that:
          - target_files.results[4].stat.isreg | default(false)
          - target_files.results[4].stat.pw_name == 'root'
          - target_files.results[4].stat.mode == '0750'
          - not target_files.results[5].stat.exists
          - not target_files.results[6].stat.exists
          - not target_files.results[7].stat.exists
          - target_files.results[8].stat.isreg | default(false)
          - target_files.results[9].stat.isreg | default(false)
          - target_files.results[9].stat.pw_name == 'root'
          - target_files.results[9].stat.mode == '0600'
          - target_files.results[10].stat.isreg | default(false)
          - target_files.results[11].stat.isreg | default(false)
          - target_files.results[12].stat.isreg | default(false)
          - target_files.results[13].stat.isreg | default(false)
          - target_files.results[14].stat.isreg | default(false)
        fail_msg: >-
          Missing trusted target refresh components, preexisting alert
          state or unexpected approval marker. Investigate before cutover.

    - name: Verify the staged notifier still exactly matches its reviewed rendering
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/network_host_collector/defaults/main.yml"

    - name: Use the monitor-01 identity for read-only notifier comparison
      ansible.builtin.set_fact:
        network_host_collector_expected_hostname: monitor-01
        network_host_collector_alert_enabled: false
        network_host_collector_enable_timer: false

    - name: Compare existing notifier to reviewed source without rewriting it
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/network_host_collector/templates/homelab-network-device-email-alert.py.j2"
        dest: "{{ target_notifier }}"
        owner: root
        group: root
        mode: '0750'
      check_mode: true
      diff: false
      no_log: true
      register: target_template_check

    - name: Reject an unknown or modified notifier
      ansible.builtin.assert:
        that:
          - not target_template_check.changed

    - name: Require five target timers remain disabled
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-enabled, "{{ item }}"]
      loop: "{{ target_timers }}"
      register: target_enabled
      changed_when: false
      failed_when: false

    - name: Require five target timers remain inactive
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, "{{ item }}"]
      loop: "{{ target_timers }}"
      register: target_active
      changed_when: false
      failed_when: false

    - name: Refuse any overlapping target schedule
      ansible.builtin.assert:
        that:
          - item[0].stdout == 'disabled'
          - item[1].stdout == 'inactive'
      loop: "{{ target_enabled.results | zip(target_active.results) | list }}"
      loop_control:
        label: "{{ item[0].item }}"

    - name: Require collector, enrichment, deep profiler and guest refresh not currently executing
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, "{{ item }}"]
      loop:
        - homelab-network-host-collector.service
        - homelab-network-host-enricher.service
        - homelab-network-host-deep-profiler.service
        - homelab-proxmox-guest-refresh.service
      register: target_services
      changed_when: false
      failed_when: false

    - name: Require no current target collector or enrichment job
      ansible.builtin.assert:
        that:
          - item.stdout == 'inactive'
      loop: "{{ target_services.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect loaded unit definitions without reloading or starting units
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, cat, "{{ item }}"]
      loop:
        - homelab-network-host-collector.service
        - homelab-network-host-enricher.service
      changed_when: false
      register: target_units

    - name: Refuse target notifier wiring or missing enrichment cutover guard
      ansible.builtin.assert:
        that:
          - "'ExecStartPost=' not in target_units.results[0].stdout"
          - "'EnvironmentFile=' not in target_units.results[0].stdout"
          - "'ConditionPathExists=' ~ cutover_marker in target_units.results[1].stdout"
          - "'Requires=homelab-proxmox-guest-refresh.service' in target_units.results[1].stdout"

    - name: Verify known saved guest identities without Nmap or enrichment
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/sbin/homelab-network-host-enricher, --identity-check]
      register: target_identity_raw
      changed_when: false
      no_log: true

    - name: Use only aggregate guest identity validation result
      ansible.builtin.set_fact:
        target_guest_counts: "{{ target_identity_raw.stdout | from_json }}"
      no_log: true

    - name: Require a fresh, matching saved guest map before planning activation
      ansible.builtin.assert:
        that:
          - target_guest_counts.event == 'staged_proxmox_identity_check'
          - target_guest_counts.snapshot_guest_macs | int >= 1
          - target_guest_counts.matched_guest_macs | int >= 1
          - target_guest_counts.unmatched_guest_macs | int == 0
          - target_guest_counts.snapshot_age_seconds | int < 172800

    - name: Check authenticated read-only Proxmox guest-map refresh path
      ansible.builtin.shell: |
        set -euo pipefail
        set +x
        set -a
        source /etc/homelab-network-hosts/proxmox-api.env
        set +a
        /usr/bin/python3 -B /usr/local/sbin/homelab-proxmox-guest-mac-refresh --check
      args:
        executable: /bin/bash
      register: target_api_check
      changed_when: false
      no_log: true

    - name: Require authenticated cluster API still discovers matching LAN guests
      ansible.builtin.assert:
        that:
          - (target_api_check.stdout | from_json).event == 'proxmox_guest_refresh_preflight'
          - (target_api_check.stdout | from_json).strict_tls | bool
          - not (target_api_check.stdout | from_json).snapshot_updated | bool
          - (target_api_check.stdout | from_json).candidate_matched_lan_macs | int >= 1
          - (target_api_check.stdout | from_json).candidate_guest_macs | int >= 1

    - name: Check internal mail relay TCP only without transmitting mail
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - >-
            import socket;
            sock=socket.create_connection(('192.168.2.54',25),timeout=5);
            sock.close();
            print('Internal mail relay reachable; no email sent')
      changed_when: false
      register: target_smtp

    - name: Rehash staged data to prove this preflight did not mutate protected files
      ansible.builtin.stat:
        path: "{{ staged_state_dir }}/{{ item }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ original_state }}"
      register: target_hashes_after
      no_log: true

    - name: Require original target state still byte-for-byte identical
      ansible.builtin.assert:
        that:
          - item[0].stat.checksum == item[1].stat.checksum
        fail_msg: >-
          Target protected staged state changed unexpectedly during
          read-only checks. Stop before any future production transfer.
      loop: "{{ target_files.results[:4] | zip(target_hashes_after.results) | list }}"
      loop_control:
        label: "{{ item[1].item }}"

    - name: Report aggregate target readiness without opening any alerting path
      ansible.builtin.debug:
        msg:
          - "Inert target: all five worker and refresh timers disabled/inactive and no active collector/enricher."
          - "Protected target: {{ target_guest_counts.saved_lan_devices }} staged LAN records, {{ target_guest_counts.matched_guest_macs }} matching guest MACs, zero unmatched."
          - "Saved guest snapshot age: {{ target_guest_counts.snapshot_age_seconds }} seconds; authenticated API candidate count: {{ (target_api_check.stdout | from_json).candidate_guest_macs }}."
          - "{{ target_smtp.stdout }}"
          - "Reviewed notifier matches installed script; recipient, MAC registry and cutover approval still absent."
          - "All four protected target JSONs unchanged. No API snapshot update, email, Nmap or service change."
          - "Gate 3a is a PLAN preflight only. Source must stay active until separately approved stop and final protected delta copy."
