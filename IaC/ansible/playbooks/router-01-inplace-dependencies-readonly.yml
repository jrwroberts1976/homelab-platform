---
# SECOND-STAGE NONDESTRUCTIVE discovery based on 27-Oct production audit.
# ONLY current docker-01 using production inventory; no state changes,
# no Docker removal, no nmcli changes, no new DHCP services.
- name: Read-only Docker dependency and NetworkManager cutover assessment
  hosts: docker-01
  gather_facts: true
  become: true
  tasks:
    - name: Verify existing management identity before assessing removal
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'docker-01'
          - ansible_facts.hostname == 'docker-01'
          - "'192.168.2.220' in ansible_facts.all_ipv4_addresses"
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
        fail_msg: Refusing to inspect an unexpected host.

    - name: Read NetworkManager identity and non-secret IPv4 profile properties
      ansible.builtin.shell: |
        printf '%s\n' '--- NetworkManager version and eth0 profile ---'
        nmcli --version
        nmcli -g GENERAL.STATE,GENERAL.CONNECTION device show eth0
        con="$(nmcli -g GENERAL.CONNECTION device show eth0 | head -n1)"
        if [ -n "$con" ] && [ "$con" != "--" ]; then
          nmcli -g connection.id,connection.uuid,connection.interface-name,connection.autoconnect,ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.never-default connection show "$con"
        else
          printf '%s\n' 'No active eth0 profile found'
        fi
        echo '--- NetworkManager service state ---'
        systemctl is-active NetworkManager.service || true
      args:
        executable: /bin/bash
      register: router_nm_profile
      changed_when: false
      # IMPORTANT: NEVER use nmcli --show-secrets or export whole profiles.

    - name: Simulate apt removal with no package changes
      ansible.builtin.command:
        argv:
          - apt-get
          - -s
          - remove
          - docker.io
          - docker-compose
          - containerd
          - runc
      register: router_docker_removal_simulation
      changed_when: false
      failed_when: false

    - name: Identify Docker/Trivy/Komodo/Alloy and related unit names
      ansible.builtin.shell: |
        systemctl list-unit-files --all --no-legend --no-pager |
          grep -Ei 'docker|containerd|trivy|komodo|birdnet|alloy|icmp-timestamp|zabbix' || true
        echo '--- relevant enabled timers ---'
        systemctl list-timers --all --no-legend --no-pager |
          grep -Ei 'docker|container|trivy|komodo|birdnet' || true
      args:
        executable: /bin/bash
      register: router_docker_related_units
      changed_when: false

    - name: Inspect service listeners and reverse proxy availability
      ansible.builtin.shell: |
        echo '--- services ---'
        for unit in nginx.service alloy.service zabbix-agent2.service ssh.service; do
          printf '%s: ' "$unit"
          systemctl is-active "$unit" 2>/dev/null || true
        done
        echo '--- TCP and UDP listening sockets; no process environments ---'
        ss -lnut | head -60
      args:
        executable: /bin/bash
      register: router_service_bound_ports
      changed_when: false

    - name: Read iptables/nftables chain names without modifying firewall
      ansible.builtin.shell: |
        printf '%s\n' '--- iptables table names and chain headers ---'
        for table in filter nat mangle raw; do
          echo "table=$table"
          iptables -t "$table" -S 2>/dev/null |
            grep -E '^(-P|-N) ' || true
        done
        echo '--- nftables tables ---'
        nft list tables 2>/dev/null || true
      args:
        executable: /bin/bash
      register: router_firewall_chain_ownership
      changed_when: false

    - name: Report dependency facts without secrets, credentials or modifications
      ansible.builtin.debug:
        msg:
          - "NETWORKMANAGER_ETH0={{ router_nm_profile.stdout_lines }}"
          - "APT_REMOVAL_SIMULATION_RC={{ router_docker_removal_simulation.rc }}"
          - "APT_REMOVAL_SIMULATION={{ router_docker_removal_simulation.stdout_lines[:80] }}"
          - "RELATED_UNITS={{ router_docker_related_units.stdout_lines }}"
          - "LISTENERS={{ router_service_bound_ports.stdout_lines }}"
          - "FIREWALL_CHAIN_OWNERSHIP={{ router_firewall_chain_ownership.stdout_lines }}"
          - "READ_ONLY: no Docker, network, software or firewall change performed."
