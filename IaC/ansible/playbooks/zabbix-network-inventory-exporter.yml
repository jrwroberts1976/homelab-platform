---
# Retired by #287. This deliberately fails before any target-side action.
# Retained as a fail-closed compatibility guard for historical playbook names.
- name: Refuse retired legacy network inventory deployment (zabbix-network-inventory-exporter.yml)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Block legacy inventory and MAC-dashboard reactivation
      ansible.builtin.fail:
        msg: >-
          RETIRED (#287): zabbix-network-inventory-exporter.yml must not reinstall the obsolete
          ASUS/HP inventory or MAC-generated Grafana dashboard pipeline.
          Use the supported router-01/Pi-hole/monitor-01 workflows.
