---
- name: Upgrade Nextcloud application to 35.0.2
  hosts: cloud-01
  become: true
  gather_facts: false

  vars_files:
    - ../roles/cloud_stack/defaults/main.yml

  vars:
    nextcloud_upgrade_approved: false

  tasks:
    - name: Require explicit upgrade approval
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'cloud-01'
          - ansible_host == '192.168.2.53'
          - nextcloud_upgrade_approved | bool
          - cloud_nextcloud_image == 'nextcloud:35.0.2-apache'

    - name: Verify source version
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - www-data
          - cloud-01-app-1
          - php
          - occ
          - status
      register: before
      changed_when: false
      failed_when: "'versionstring: 34.0.3' not in before.stdout"

    - name: Deploy managed Compose definition
      ansible.builtin.template:
        src: ../roles/cloud_stack/templates/docker-compose.yml.j2
        dest: /opt/cloud-01/docker-compose.yml
        owner: root
        group: root
        mode: "0644"

    - name: Validate Compose
      ansible.builtin.command:
        cmd: docker compose --project-directory /opt/cloud-01 config --quiet
      changed_when: false
      no_log: true

    - name: Pull Nextcloud 35 application image
      ansible.builtin.command:
        cmd: docker compose --project-directory /opt/cloud-01 pull app cron

    - name: Stop cron during upgrade
      ansible.builtin.command:
        cmd: docker compose --project-directory /opt/cloud-01 stop cron

    - name: Recreate Nextcloud application only
      ansible.builtin.command:
        cmd: docker compose --project-directory /opt/cloud-01 up -d --no-deps --force-recreate app

    - name: Wait for Nextcloud database upgrade and application health
      ansible.builtin.command:
        cmd: docker exec --user www-data cloud-01-app-1 php occ status
      register: nextcloud_status
      changed_when: false
      until:
        - nextcloud_status.rc == 0
        - "'versionstring: 35.0.2' in nextcloud_status.stdout"
        - "'maintenance: false' in nextcloud_status.stdout"
        - "'needsDbUpgrade: false' in nextcloud_status.stdout"
      retries: 60
      delay: 5

    - name: Recreate cron using Nextcloud 35
      ansible.builtin.command:
        cmd: docker compose --project-directory /opt/cloud-01 up -d --no-deps --force-recreate cron

    - name: Verify loopback-only HTTP binding
      ansible.builtin.command:
        cmd: docker port cloud-01-app-1 80/tcp
      register: app_port
      changed_when: false
      failed_when: app_port.stdout | trim != '127.0.0.1:8080'

    - name: Verify HTTPS version and application health
      ansible.builtin.uri:
        url: https://nextcloud.home.jrwroberts.co.uk/status.php
        status_code: 200
        return_content: true
      register: https_status
      until:
        - https_status.status | default(0) == 200
        - https_status.json.versionstring | default('') == '35.0.2'
        - https_status.json.maintenance | default(true) == false
        - https_status.json.needsDbUpgrade | default(true) == false
      retries: 12
      delay: 5

    - name: Show final application version
      ansible.builtin.debug:
        var: nextcloud_status.stdout_lines
