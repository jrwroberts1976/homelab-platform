---
# Protect an AUTHENTICATED ppp0 against unsolicited WAN INPUT.
# Does not touch current LAN/SSH, Docker's existing firewall or forward policy.
# Run before connecting old ASUS LAN to new ISP-routed LAN.
- name: Apply narrowly scoped PPPoE WAN input guard on existing Pi4
  hosts: docker-01
  gather_facts: false
  become: true
  vars:
    router_wan_guard_approved: false
  pre_tasks:
    - name: Require approval and exact old LAN host on Ansible controller
      ansible.builtin.assert:
        that:
          - router_wan_guard_approved | bool
          - inventory_hostname == 'docker-01'
          - ansible_host == '192.168.2.220'
        fail_msg: "No WAN firewall change approved for current Pi4."
      delegate_to: localhost
      become: false

    - name: Gather only current Pi4 facts after approval
      ansible.builtin.setup:

    - name: Verify Debian13 and unchanged original LAN address
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'docker-01'
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - "'192.168.2.220' in ansible_facts.all_ipv4_addresses"
          - (ansible_facts.get('eth0', {}).get('macaddress', '') | lower) == 'd8:3a:dd:5a:51:44'
          - (ansible_facts.get('eth1', {}).get('macaddress', '') | lower) == '00:24:9b:63:b3:8a'

    - name: Require authenticated IPv4 PPPoE WAN before firewall guard
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, ppp0]
      register: router_guard_ppp0_address
      changed_when: false
      failed_when: "'inet ' not in router_guard_ppp0_address.stdout"

    - name: Check guard table current presence without modifying firewall
      ansible.builtin.command:
        argv: [/usr/sbin/nft, list, table, inet, router_wan_guard]
      register: router_guard_current_table
      changed_when: false
      failed_when: false

    - name: Refuse modifying a previously existing unverified guard
      ansible.builtin.assert:
        that:
          - >-
            router_guard_current_table.rc != 0 or
            ('iifname "ppp0"' in router_guard_current_table.stdout and
             'drop' in router_guard_current_table.stdout and
             'ct state established,related accept' in router_guard_current_table.stdout)
        fail_msg: "An unknown existing WAN guard table is present; inspect it first."

  tasks:
    - name: Create private non-Docker nftables include directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Stage WAN-input-only guard (no ruleset flush)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../router-01/files/router-wan-guard.nft"
        dest: /etc/nftables.d/router-wan-guard.nft
        owner: root
        group: root
        mode: '0644'
      notify: Apply PPPoE WAN guard if guard service already running

    - name: Syntax-check guard without applying runtime filter
      ansible.builtin.command:
        argv: [/usr/sbin/nft, -c, -f, /etc/nftables.d/router-wan-guard.nft]
      changed_when: false

    - name: Install persistent guard service (no PPPoE reconnect)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../router-01/files/router-wan-guard.service"
        dest: /etc/systemd/system/router-wan-guard.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload unit metadata
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and start PPP-only guard without restarting PPP
      ansible.builtin.systemd_service:
        name: router-wan-guard.service
        enabled: true
        state: started
      when: router_guard_current_table.rc != 0

    - name: Enable boot-time guard if it already exists from earlier operation
      ansible.builtin.systemd_service:
        name: router-wan-guard.service
        enabled: true
      when: router_guard_current_table.rc == 0

    - name: Verify guard chain is now active
      ansible.builtin.command:
        argv: [/usr/sbin/nft, list, table, inet, router_wan_guard]
      register: router_guard_final_table
      changed_when: false
      failed_when: false

    - name: Require WAN drop and established allowance before considering done
      ansible.builtin.assert:
        that:
          - router_guard_final_table.rc == 0
          - >-
            'iifname "ppp0"' in router_guard_final_table.stdout and
            'drop' in router_guard_final_table.stdout
          - "'ct state established,related accept' in router_guard_final_table.stdout"
        fail_msg: "WAN nft table did not activate with expected PPP guard; do not cut over LAN."

    - name: Confirm original SSH IP still available
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, eth0]
      register: router_wan_guard_eth0
      changed_when: false
      failed_when: "'192.168.2.220/24' not in router_wan_guard_eth0.stdout"

    - name: Report isolated WAN protection only
      ansible.builtin.debug:
        msg:
          - "PASS: narrow PPPoE ppp0 WAN input guard active."
          - "Established responses permitted; new unsolicited ISP-side input dropped."
          - "Existing eth0 SSH 192.168.2.220, Docker and forwarding remain unchanged."
          - "Next phase: prepare Docker-free NAT and new LAN, not yet active."

  handlers:
    - name: Apply PPPoE WAN guard if guard service already running
      ansible.builtin.debug:
        msg: "Guard file staged. Existing running guard unchanged; review if content changed."
