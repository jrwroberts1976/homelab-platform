---
# Inspection only: no network changes or qdisc replacement.
- name: Inspect conditions for persistent CAKE on router WAN
  hosts: router-01
  become: true
  gather_facts: true
  vars:
    router_qos_persistence_preflight_approved: false
  tasks:
    - name: Confirm target and approval
      ansible.builtin.assert:
        that:
          - router_qos_persistence_preflight_approved | bool
          - inventory_hostname == 'router-01'
          - ansible_facts.hostname == 'raspberrypi'
          - "'192.168.2.1' in ansible_facts.all_ipv4_addresses"
    - name: Inspect active WAN and existing persistence mechanisms
      ansible.builtin.shell: |
        set -eu
        echo '=== WAN DEVICE AND QDISC ==='
        ip -br link show dev eth1
        tc qdisc show dev eth1
        echo '=== PPP ROUTE ==='
        ip -4 route show default
        echo '=== WAN NETWORKD CONFIGURATION ==='
        networkctl status eth1 --no-pager
        echo '=== EXISTING QOS SERVICE/UNIT ==='
        systemctl list-unit-files '*qos*' '*cake*' --no-pager
        echo '=== CONFIGURED QOS MANAGEMENT ==='
        if test -e /etc/systemd/system/router-qos-upload.service; then
          echo PERSISTENT_UNIT_EXISTS
        else
          echo PERSISTENT_UNIT_ABSENT
        fi
        echo '=== SSH/PPPOE/FIREWALL/DHCP/DNS ==='
        systemctl is-active ssh router-pppoe nftables dnsmasq unbound
        echo '=== TRIAL RECOVERY EVIDENCE ==='
        ls -ld /var/lib/router-qos-upload-trial
      args:
        executable: /bin/bash
      changed_when: false
      register: inspection
    - name: Display inspected configuration
      ansible.builtin.debug:
        var: inspection.stdout_lines
