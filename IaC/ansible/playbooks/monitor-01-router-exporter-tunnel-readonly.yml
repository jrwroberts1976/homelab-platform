---
# Stage C2 discovery ONLY. No SSH tunnel is started, no keys or host-key
# records are created, and no Docker, Prometheus or gateway config changes.
- name: Inspect monitor-01 prerequisites for a restricted router exporter SSH tunnel
  hosts: monitoring_hosts
  gather_facts: false
  become: true
  vars:
    router_c2_tunnel_audit_approved: false
    router_c2_expected_monitor_ipv4: 192.168.2.52
    # Live router address after October cutover; read-only audit only.
    router_c2_router_ipv4: 192.168.2.1
    router_c2_prometheus_container: monitoring-prometheus-1
    router_c2_proposed_local_port: 19100

  pre_tasks:
    - name: Confirm Ansible controller identity
      ansible.builtin.command:
        argv: [hostname]
      delegate_to: localhost
      become: false
      register: router_c2_controller
      check_mode: false
      changed_when: false

    - name: Require explicit consent and exact controller and monitoring host
      ansible.builtin.assert:
        that:
          - router_c2_tunnel_audit_approved | bool
          - router_c2_controller.stdout | trim == 'admin-01'
          - inventory_hostname == 'monitor-01'
          - ansible_host == router_c2_expected_monitor_ipv4
        fail_msg: "Refusing ambiguous monitoring audit target or absent approval."
      delegate_to: localhost
      become: false

    - name: Read actual monitor hostname
      ansible.builtin.command:
        argv: [hostname]
      register: router_c2_monitor_hostname
      check_mode: false
      changed_when: false

    - name: Read monitor IPv4 addresses
      ansible.builtin.command:
        argv: [ip, -4, -br, addr]
      register: router_c2_monitor_addresses
      check_mode: false
      changed_when: false

    - name: Validate monitor-01 identity before probing
      ansible.builtin.assert:
        that:
          - router_c2_monitor_hostname.stdout | trim == 'monitor-01'
          - router_c2_expected_monitor_ipv4 in router_c2_monitor_addresses.stdout

  tasks:
    - name: Read route towards Pi SSH service
      ansible.builtin.command:
        argv: [ip, -4, route, get, "{{ router_c2_router_ipv4 }}"]
      register: router_c2_pi_route
      check_mode: false
      changed_when: false

    - name: Check Prometheus container network topology without printing environment
      ansible.builtin.command:
        argv: [docker, inspect, "{{ router_c2_prometheus_container }}"]
      register: router_c2_prom_inspect
      check_mode: false
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check host port occupation before any tunnel design
      ansible.builtin.command:
        argv: [ss, -ltn]
      register: router_c2_listeners
      check_mode: false
      changed_when: false

    - name: Verify existing Prometheus is locally ready
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        method: GET
        status_code: 200
        timeout: 5
      register: router_c2_prom_ready
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Test strictly verified non-interactive SSH auth from monitor-01 to Pi
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=5
          - -o
          - PasswordAuthentication=no
          - -o
          - NumberOfPasswordPrompts=0
          - -o
          - ClearAllForwardings=yes
          - james@192.168.2.1
          - /usr/bin/true
      become: false
      register: router_c2_ssh_auth
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Display bounded connectivity details, never SSH keys or container secrets
      ansible.builtin.debug:
        msg:
          monitor_to_router_route: "{{ router_c2_pi_route.stdout }}"
          prometheus_docker_inspect_succeeded: "{{ router_c2_prom_inspect.rc == 0 }}"
          prometheus_network_mode: "{{ (router_c2_prom_inspect.stdout | from_json)[0].HostConfig.NetworkMode if router_c2_prom_inspect.rc == 0 else 'unknown' }}"
          prometheus_container_networks: "{{ ((router_c2_prom_inspect.stdout | from_json)[0].NetworkSettings.Networks | dict2items | map(attribute='key') | list) if router_c2_prom_inspect.rc == 0 else [] }}"
          prometheus_container_ipv4_addresses: "{{ ((router_c2_prom_inspect.stdout | from_json)[0].NetworkSettings.Networks | dict2items | map(attribute='value.IPAddress') | list) if router_c2_prom_inspect.rc == 0 else [] }}"
          host_port_19100_is_unused: "{{ ':19100 ' not in router_c2_listeners.stdout and ':19100\n' not in router_c2_listeners.stdout }}"
          prometheus_ready_http_status: "{{ router_c2_prom_ready.status | default('request failed') }}"
          strict_noninteractive_ssh_auth_passed: "{{ router_c2_ssh_auth.rc == 0 }}"
          ssh_failure_summary: "{{ (router_c2_ssh_auth.stderr_lines | default([]))[:2] if router_c2_ssh_auth.rc != 0 else [] }}"
          changes: "READ ONLY: no tunnel started, no host trust changed, no package or service edits"
