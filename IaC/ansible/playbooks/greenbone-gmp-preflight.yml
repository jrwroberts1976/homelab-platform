---
# Bounded GMP readiness check: does not launch a vulnerability scan or modify
# persistent configuration. The updated runner --check authenticates over
# the host Unix socket: no Docker Compose helper or temporary credentials file.
# The same flock as the scan runner prevents cross-mode concurrency.
- name: Verify Greenbone GMP management access after host reboot
  hosts: greenbone_hosts
  become: true
  gather_facts: false

  vars:
    greenbone_gmp_preflight_runner: /usr/local/sbin/homelab-greenbone-scan
    greenbone_gmp_preflight_config: /run/greenbone-scanning/runner-gvm-tools.conf

  tasks:
    - name: Inspect managed scan service state without changing it
      ansible.builtin.command:
        argv: [systemctl, is-active, homelab-greenbone-managed-scan.service]
      register: greenbone_preflight_scan_active
      changed_when: false
      failed_when: false

    - name: Refuse readiness check if a managed scan is already active
      ansible.builtin.assert:
        that:
          - greenbone_preflight_scan_active.stdout | trim != "active"
        fail_msg: >-
          Managed Greenbone scan service is active; do not run the
          preflight concurrently because the runner uses the same
          temporary GMP credentials path.

    - name: Require the deployed scan runner
      ansible.builtin.stat:
        path: "{{ greenbone_gmp_preflight_runner }}"
      register: greenbone_preflight_runner

    - name: Refuse to run when the deployed runner is absent
      ansible.builtin.assert:
        that:
          - greenbone_preflight_runner.stat.isreg | default(false)
          - greenbone_preflight_runner.stat.executable | default(false)
        fail_msg: >-
          Expected deployed Greenbone scan runner is unavailable.
          No remediation or scan will be started.

    - name: Check that no orphaned GMP temporary configuration exists
      ansible.builtin.stat:
        path: "{{ greenbone_gmp_preflight_config }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: greenbone_preflight_credential_stat

    - name: Refuse to overwrite an existing temporary GMP configuration
      ansible.builtin.assert:
        that:
          - not (greenbone_preflight_credential_stat.stat.exists | default(false))
        fail_msg: >-
          Unexpected temporary GMP configuration is already present.
          Stop and investigate using the read-only timeout diagnostic;
          do not overwrite credentials or repeat the preflight.

    - name: Probe authenticated GMP task lookup without starting a scan
      ansible.builtin.command:
        argv:
          - timeout
          - --signal=TERM
          - --kill-after=10s
          - 60s
          - flock
          - --nonblock
          - /run/lock/homelab-greenbone-scan.lock
          - "{{ greenbone_gmp_preflight_runner }}"
          - managed
          - --check
      register: greenbone_preflight_gmp
      changed_when: false
      failed_when: false

    - name: Confirm temporary GMP config is absent after preflight
      ansible.builtin.stat:
        path: "{{ greenbone_gmp_preflight_config }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: greenbone_preflight_config_after

    - name: Report GMP readiness result and last service state
      ansible.builtin.debug:
        msg:
          - "managed scan service state: {{ greenbone_preflight_scan_active.stdout | trim }}"
          - "GMP check exit code: {{ greenbone_preflight_gmp.rc }}"
          - "GMP output: {{ greenbone_preflight_gmp.stdout_lines | default([]) }}"
          - "GMP error: {{ greenbone_preflight_gmp.stderr_lines | default([]) }}"
          - "Legacy temporary GMP config absent: {{ not (greenbone_preflight_config_after.stat.exists | default(false)) }}"
          - >-
            GMP readiness: {{
              'PASS (authenticated managed task lookup succeeded)'
              if greenbone_preflight_gmp.rc == 0 and
              'CHECK=PASS' in (greenbone_preflight_gmp.stdout | default(''))
              else 'NOT VERIFIED; do not start a scan'
            }}
          - >-
            The --check mode holds the shared scan lock, reads protected runtime
            credentials into memory and directly queries the existing gvmd Unix
            socket; it creates no Docker helper or temporary credential file
            and never starts a vulnerability scan.

    - name: Require GMP readiness and transient-credential cleanup
      ansible.builtin.assert:
        that:
          - greenbone_preflight_gmp.rc == 0
          - "'CHECK=PASS' in (greenbone_preflight_gmp.stdout | default(''))"
          - not (greenbone_preflight_config_after.stat.exists | default(false))
        fail_msg: >-
          GMP check failed or transient credentials remain. Do not run a
          vulnerability scan. If credentials remain, use the reviewed,
          safety-gated orphan cleanup after verifying no active helper.
