---
# Targeted security patch for existing Grafana 13.2.1 -> 13.2.4.
# Does NOT reconcile the full monitoring Compose stack, restart other services,
# run vulnerability scans, alter Grafana credentials or touch Greenbone.
- name: Apply approval-gated Grafana 13.2.4 security patch only
  hosts: monitor-01
  become: true
  gather_facts: true

  vars_files:
    - ../roles/monitoring_stack/defaults/main.yml

  vars:
    grafana_patch_root: /opt/monitoring
    grafana_patch_compose: /opt/monitoring/docker-compose.yml
    grafana_patch_old_image: "grafana/grafana:13.2.1"
    grafana_patch_new_image: "grafana/grafana:13.2.4"
    grafana_patch_backup_dir: /var/backups/homelab-security/grafana

  pre_tasks:
    - name: Require explicit disruptive-change approval, source pin and exact identity
      ansible.builtin.assert:
        that:
          - grafana_security_patch_approved | default(false) | bool
          - inventory_hostname == 'monitor-01'
          - ansible_host == '192.168.2.52'
          - ansible_facts.hostname == 'monitor-01'
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.default_ipv4.address == '192.168.2.52'
          - monitoring_grafana_image == grafana_patch_new_image
        fail_msg: "Refusing Grafana security patch: explicit approval, exact monitor identity and reviewed target pin required."

    - name: Check existing Compose and Grafana configuration files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ grafana_patch_compose }}"
        - "{{ grafana_patch_root }}/.env"
        - "{{ grafana_patch_root }}/grafana/provisioning/dashboards/production/homelab-vulnerability-management.json"
      register: grafana_patch_existing_paths

    - name: Refuse absent or unexpected monitoring state
      ansible.builtin.assert:
        that:
          - grafana_patch_existing_paths.results | map(attribute='stat.isreg') | list == [true, true, true]

    - name: Assert only the expected old Grafana image line is in live Compose
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import pathlib,re,sys
            txt=pathlib.Path(sys.argv[1]).read_text()
            old=r"(?m)^    image: grafana/grafana:13\.2\.1$"
            new=r"(?m)^    image: grafana/grafana:13\.2\.4$"
            assert len(re.findall(old,txt))==1
            assert not re.search(new,txt)
            print("Grafana only: exact previous pin found in running stack Compose")
          - "{{ grafana_patch_compose }}"
      changed_when: false

    - name: Validate existing Compose without exposing rendered environment
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ grafana_patch_root }}", config, --quiet]
      changed_when: false
      no_log: true

    - name: Identify current Grafana container
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ grafana_patch_root }}", ps, -q, grafana]
      register: grafana_patch_old_id
      changed_when: false

    - name: Require existing running Grafana service container
      ansible.builtin.assert:
        that:
          - grafana_patch_old_id.stdout | trim | length >= 12

    - name: Inspect existing Grafana image and data mount
      ansible.builtin.command:
        argv: [docker, inspect, "{{ grafana_patch_old_id.stdout | trim }}"]
      register: grafana_patch_old_inspect
      changed_when: false
      no_log: true

    - name: Set expected Grafana data mount from read-only Docker evidence
      ansible.builtin.set_fact:
        grafana_patch_info: "{{ (grafana_patch_old_inspect.stdout | from_json)[0] }}"
      no_log: true

    - name: Require exact old running image and persistent data mount
      ansible.builtin.assert:
        that:
          - grafana_patch_info.Config.Image == grafana_patch_old_image
          - grafana_patch_info.State.Running | bool
          - grafana_patch_info.Mounts | selectattr('Destination', 'equalto', '/var/lib/grafana') | list | length == 1
        fail_msg: "Grafana running image or persistent data layout differs from reviewed change."
      no_log: true

    - name: Derive Grafana data directory for online SQLite backup
      ansible.builtin.set_fact:
        grafana_patch_data_path: >-
          {{ (grafana_patch_info.Mounts | selectattr('Destination', 'equalto', '/var/lib/grafana') | first).Source }}
      no_log: true

    - name: Check live Grafana SQLite database exists
      ansible.builtin.stat:
        path: "{{ grafana_patch_data_path }}/grafana.db"
      register: grafana_patch_sqlite

    - name: Require existing SQLite before service update
      ansible.builtin.assert:
        that:
          - grafana_patch_sqlite.stat.isreg | default(false)
          - grafana_patch_sqlite.stat.size | default(0) | int > 0
        fail_msg: "Grafana SQLite database missing or empty; no upgrade attempted."

    - name: Verify Grafana version and healthy API before patch
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
        status_code: 200
        return_content: true
      register: grafana_patch_before_api
      changed_when: false
      failed_when: >-
        grafana_patch_before_api.status != 200
        or grafana_patch_before_api.json.version | default('') != '13.2.1'

    - name: Capture IDs of unrelated running monitoring services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ grafana_patch_root }}"
          - ps
          - -q
          - prometheus
          - alertmanager
          - blackbox
          - loki
      register: grafana_patch_other_before
      changed_when: false

    - name: Require original monitoring services running
      ansible.builtin.assert:
        that:
          - grafana_patch_other_before.stdout_lines | length == 4
        fail_msg: "Unrelated monitoring services not all running; refuse patch."

  tasks:
    - name: Create protected Grafana backup directory
      ansible.builtin.file:
        path: "{{ grafana_patch_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Take consistent live online SQLite backup before any image change
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sqlite3,sys
            source=sys.argv[1]
            destination=sys.argv[2]
            with sqlite3.connect("file:"+source+"?mode=ro", uri=True, timeout=30) as src:
                with sqlite3.connect(destination, timeout=30) as dst:
                    src.backup(dst, pages=256, sleep=0.05)
                    assert dst.execute("PRAGMA quick_check").fetchone()[0]=="ok"
            print("Grafana SQLite online backup integrity OK")
          - "{{ grafana_patch_data_path }}/grafana.db"
          - "{{ grafana_patch_backup_dir }}/grafana-before-1324-{{ ansible_date_time.iso8601_basic_short }}.db"
      register: grafana_patch_backup
      changed_when: true
      no_log: true

    - name: Restrict online backup permissions
      ansible.builtin.file:
        path: "{{ grafana_patch_backup_dir }}/grafana-before-1324-{{ ansible_date_time.iso8601_basic_short }}.db"
        owner: root
        group: root
        mode: "0600"

    - name: Pull reviewed Grafana security patch image only
      ansible.builtin.command:
        argv: [docker, pull, "{{ grafana_patch_new_image }}"]
      changed_when: true

    - name: Update only Grafana image line in existing managed Compose
      ansible.builtin.replace:
        path: "{{ grafana_patch_compose }}"
        regexp: '(?m)^    image: grafana/grafana:13\.2\.1$'
        replace: '    image: grafana/grafana:13.2.4'
        backup: true
      register: grafana_patch_compose_edit

    - name: Refuse proceeding unless exactly one reviewed Compose change applied
      ansible.builtin.assert:
        that:
          - grafana_patch_compose_edit.changed | bool
        fail_msg: "Grafana image was not updated; refusing recreation."

    - name: Validate Compose after one-line image update
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, "{{ grafana_patch_root }}", config, --quiet]
      changed_when: false
      no_log: true

    - name: Recreate Grafana only, without dependencies or unrelated stacks
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ grafana_patch_root }}"
          - up
          - -d
          - --no-deps
          - --no-build
          - --force-recreate
          - grafana
      changed_when: true

    - name: Verify new Grafana version via live API
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
        status_code: 200
        return_content: true
      register: grafana_patch_after_api
      until:
        - grafana_patch_after_api.status | default(0) == 200
        - grafana_patch_after_api.json.version | default('') == '13.2.4'
      retries: 40
      delay: 3
      changed_when: false

    - name: Confirm no other monitoring containers were recreated
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ grafana_patch_root }}"
          - ps
          - -q
          - prometheus
          - alertmanager
          - blackbox
          - loki
      register: grafana_patch_other_after
      changed_when: false
      failed_when: >-
        (grafana_patch_other_after.stdout_lines | sort)
        != (grafana_patch_other_before.stdout_lines | sort)

    - name: Verify only Grafana is at the reviewed patched image reference
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ grafana_patch_root }}"
          - images
          - grafana
      register: grafana_patch_image_check
      changed_when: false
      failed_when: "'13.2.4' not in grafana_patch_image_check.stdout"

    - name: Report patch proof and recovery artifacts
      ansible.builtin.debug:
        msg: >-
          Grafana 13.2.1 -> 13.2.4 patched; local API version 13.2.4,
          other monitoring container IDs unchanged. Compose backup={{
          grafana_patch_compose_edit.backup_file | default('NOT CREATED') }}.
          Consistent SQLite backup={{ grafana_patch_backup_dir }}/grafana-before-1324-{{
          ansible_date_time.iso8601_basic_short }}.db.
          Rollback requires a separately approved service-specific change,
          and SQLite restore only if required by verified vendor compatibility.
