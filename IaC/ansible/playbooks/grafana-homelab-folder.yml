---
# Idempotent Grafana folder hierarchy:
# Dashboards / Homelab / Devices / Managed Devices
# Does not create dashboards or touch provisioning files.
- name: Ensure Grafana managed-device folders exist
  hosts: monitoring_hosts
  become: true
  gather_facts: true

  tasks:
    - name: Require monitor-01
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'monitor-01'
          - ansible_facts.hostname == 'monitor-01'

    - name: Ensure Homelab, Devices, and Managed Devices folders
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import base64
            import json
            import urllib.error
            import urllib.request
            from pathlib import Path

            lines = Path("/opt/monitoring/.env").read_text().splitlines()
            secrets = [
                line.partition("=")[2]
                for line in lines
                if line.startswith("GF_SECURITY_ADMIN_PASSWORD=")
            ]
            if len(secrets) != 1 or not secrets[0]:
                raise RuntimeError("Expected one configured Grafana admin password")

            auth = "Basic " + base64.b64encode(
                ("admin:" + secrets[0]).encode("utf-8")
            ).decode("ascii")
            root = "http://127.0.0.1:3000"
            headers = {
                "Authorization": auth,
                "Content-Type": "application/json",
            }

            def request(path, method="GET", body=None):
                req = urllib.request.Request(
                    root + path,
                    data=None if body is None else json.dumps(body).encode("utf-8"),
                    headers=headers,
                    method=method,
                )
                with urllib.request.urlopen(req, timeout=15) as response:
                    return json.load(response)

            def ensure(uid, title, parent_uid=None):
                try:
                    current = request("/api/folders/" + uid)
                except urllib.error.HTTPError as error:
                    if error.code != 404:
                        raise
                    current = None

                if current is None:
                    payload = {"uid": uid, "title": title}
                    if parent_uid:
                        payload["parentUid"] = parent_uid
                    current = request("/api/folders", "POST", payload)
                    action = "CREATED"
                else:
                    action = "EXISTS"

                if current.get("title") != title:
                    raise RuntimeError("Unexpected Grafana folder title for " + uid)
                if parent_uid and current.get("parentUid") != parent_uid:
                    raise RuntimeError("Unexpected Grafana parent for " + uid)
                print(action + ": " + title)

            ensure("homelab", "Homelab")
            ensure("homelab-devices", "Devices", "homelab")
            ensure("homelab-managed-devices", "Managed Devices", "homelab-devices")
      register: grafana_folders
      changed_when: "'CREATED:' in grafana_folders.stdout"
      no_log: true

    - name: Confirm folder hierarchy checked
      ansible.builtin.debug:
        msg: "Grafana folder hierarchy reconciled: Homelab / Devices / Managed Devices"
