---
# Upgrade the staged files; does not enable or start QoS.
- name: Harden staged CAKE upload persistence for slow USB WAN startup
  hosts: router-01
  become: true
  gather_facts: true
  vars:
    router_qos_persistence_harden_approved: false
  tasks:
    - name: Guard exact router and explicit authorisation
      ansible.builtin.assert:
        that:
          - router_qos_persistence_harden_approved | bool
          - not ansible_check_mode
          - inventory_hostname == 'router-01'
          - ansible_facts.hostname == 'raspberrypi'
          - "'192.168.2.1' in ansible_facts.all_ipv4_addresses"
    - name: Verify previously staged files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/sbin/router-qos-upload
        - /etc/systemd/system/router-qos-upload.service
      register: staged_files
    - name: Refuse missing preflight artifacts
      ansible.builtin.assert:
        that:
          - staged_files.results | map(attribute='stat.exists') | min
    - name: Require currently disabled service
      ansible.builtin.command:
        argv: [systemctl, is-enabled, router-qos-upload.service]
      register: enabled
      changed_when: false
      failed_when: enabled.stdout != 'disabled'
    - name: Require inactive service
      ansible.builtin.command:
        argv: [systemctl, is-active, router-qos-upload.service]
      register: active
      changed_when: false
      failed_when: active.stdout != 'inactive'
    - name: Observe live queue before staging changes
      ansible.builtin.command:
        argv: [tc, qdisc, show, dev, eth1]
      register: before
      changed_when: false
      failed_when: "'qdisc cake' not in before.stdout or 'bandwidth 13Mbit' not in before.stdout or 'ptm overhead 30' not in before.stdout"
    - name: Replace staged script with guarded interface wait and idempotent CAKE
      ansible.builtin.copy:
        dest: /usr/local/sbin/router-qos-upload
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu
          # A USB NIC may be enumerated after systemd-networkd starts.
          n=0
          while :; do
            if [ -e /sys/class/net/eth1 ] && /usr/sbin/ip link show dev eth1 | /bin/grep -q 'state UP'; then
              break
            fi
            n=$((n + 1))
            if [ "$n" -ge 60 ]; then
              echo "eth1 not ready after 120 seconds" >&2
              exit 1
            fi
            /bin/sleep 2
          done
          current=$(/usr/sbin/tc qdisc show dev eth1)
          case "$current" in
            *"qdisc cake "*"bandwidth 13Mbit "*"ptm overhead 30"*) exit 0 ;;
          esac
          /usr/sbin/tc qdisc replace dev eth1 root cake bandwidth 13mbit pppoe-ptm besteffort flows
          /usr/sbin/tc qdisc show dev eth1 | /bin/grep -q 'qdisc cake.*bandwidth 13Mbit'
    - name: Replace staged service with retry-on-failure settings
      ansible.builtin.copy:
        dest: /etc/systemd/system/router-qos-upload.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Apply CAKE upload shaping to physical WAN eth1
          Wants=systemd-networkd.service
          After=systemd-networkd.service
          StartLimitIntervalSec=0

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/router-qos-upload
          RemainAfterExit=yes
          TimeoutStartSec=150
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
    - name: Check shell syntax without executing
      ansible.builtin.command:
        argv: [/bin/sh, '-n', /usr/local/sbin/router-qos-upload]
      changed_when: false
    - name: Verify systemd unit syntax without starting
      ansible.builtin.command:
        argv: [systemd-analyze, verify, /etc/systemd/system/router-qos-upload.service]
      changed_when: false
    - name: Reload unit definitions without activation
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Verify live WAN queue unchanged
      ansible.builtin.command:
        argv: [tc, qdisc, show, dev, eth1]
      register: after
      changed_when: false
      failed_when: after.stdout != before.stdout
    - name: Confirm unit still disabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, router-qos-upload.service]
      register: final_enabled
      changed_when: false
      failed_when: final_enabled.stdout != 'disabled'
    - name: Confirm unit still inactive
      ansible.builtin.command:
        argv: [systemctl, is-active, router-qos-upload.service]
      register: final_active
      changed_when: false
      failed_when: final_active.stdout != 'inactive'
