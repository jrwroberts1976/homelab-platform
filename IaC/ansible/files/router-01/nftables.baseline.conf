#!/usr/sbin/nft -f
flush ruleset
table inet filter_router {
 chain input {
  type filter hook input priority 0; policy drop;
  iifname "lo" accept
  ct state established,related accept
  ct state invalid drop
  iifname "eth0" tcp dport {22,53} accept
  iifname "eth0" udp dport {53,67} accept
  iifname "eth0" ip protocol icmp accept
 }
 chain forward {
  type filter hook forward priority 0; policy drop;
  ct state established,related accept
  ct state invalid drop
  iifname "eth0" oifname "ppp0" ip saddr 192.168.2.0/24 accept
 }
 chain output { type filter hook output priority 0; policy accept; }
}
table ip nat_router {
 chain postrouting {
  type nat hook postrouting priority srcnat; policy accept;
  oifname "ppp0" ip saddr 192.168.2.0/24 masquerade
 }
}
# BEGIN ANSIBLE MANAGED: Router-01 PPPoE MSS
# PPPoE ppp0 MTU 1492 => IPv4 TCP MSS <= 1452.
# Existing filter_router / nat_router remain unchanged.
table ip router_pppoe_mss {
  chain forward {
    type filter hook forward priority mangle; policy accept;
    iifname "eth0" oifname "ppp0" tcp flags syn tcp option maxseg size > 1452 counter tcp option maxseg size set 1452
    iifname "ppp0" oifname "eth0" tcp flags syn tcp option maxseg size > 1452 counter tcp option maxseg size set 1452
  }
}
# END ANSIBLE MANAGED: Router-01 PPPoE MSS
