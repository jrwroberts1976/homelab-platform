---
- name: Ensure Debian Python virtual-environment support is present
  ansible.builtin.apt:
    name:
      - python3.13-venv
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Create dedicated privacy-test directory
  ansible.builtin.file:
    path: "{{ alloy_privacy_test_venv | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create disposable Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ alloy_privacy_test_venv }}"
    creates: "{{ alloy_privacy_test_venv }}/bin/python"

# Avoid ansible.builtin.pip: it imports 'packaging' in the remote system
# Python, which is intentionally minimal on the DNS resolvers.
- name: Install isolated Loki payload decoding dependencies
  ansible.builtin.command:
    argv: "{{ [alloy_privacy_test_venv ~ '/bin/python', '-m', 'pip', 'install', '--only-binary=:all:'] + alloy_privacy_test_packages }}"
  register: alloy_privacy_test_pip
  changed_when: "'Successfully installed' in alloy_privacy_test_pip.stdout"
  when: not ansible_check_mode

- name: Verify isolated Snappy and Protobuf imports
  ansible.builtin.command:
    argv:
      - "{{ alloy_privacy_test_venv }}/bin/python"
      - -c
      - 'import snappy, google.protobuf; print("Alloy privacy test dependencies: OK")'
  changed_when: false
  when: not ansible_check_mode
