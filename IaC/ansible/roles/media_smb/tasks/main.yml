---
- name: Validate SMB credential input
  ansible.builtin.assert:
    that:
      - media_smb_password | length >= 8
    fail_msg: >-
      MEDIA_SMB_PASSWORD must be supplied from the controller environment
      and be at least 8 characters long.
  no_log: true

- name: Install Samba
  ansible.builtin.apt:
    name:
      - samba
      - smbclient
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create media root
  ansible.builtin.file:
    path: "{{ media_smb_path }}"
    state: directory
    owner: "{{ media_smb_owner }}"
    group: "{{ media_smb_group }}"
    mode: "0777"

- name: Create media library directories
  ansible.builtin.file:
    path: "{{ media_smb_path }}/{{ item }}"
    state: directory
    owner: "{{ media_smb_owner }}"
    group: "{{ media_smb_group }}"
    mode: "0777"
  loop: "{{ media_smb_directories }}"

- name: Set Samba password for media user
  ansible.builtin.command:
    argv:
      - smbpasswd
      - -s
      - -a
      - "{{ media_smb_owner }}"
    stdin: "{{ media_smb_password }}\n{{ media_smb_password }}\n"
  changed_when: false
  no_log: true

- name: Configure signed authenticated LAN Samba media share
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "testparm -s %s"
  notify: Restart Samba

- name: Ensure Samba is enabled and running
  ansible.builtin.systemd_service:
    name: smbd
    enabled: true
    state: started

- name: Install Kodi source updater
  ansible.builtin.template:
    src: homelab-kodi-sources.py.j2
    dest: /usr/local/sbin/homelab-kodi-sources
    owner: root
    group: root
    mode: "0755"

- name: Add media directories to Kodi
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/homelab-kodi-sources
  register: media_smb_kodi_sources
  changed_when: media_smb_kodi_sources.stdout | trim == 'CHANGED'
  notify: Restart Kodi after source update

- name: Ensure Kodi sources remain owned by media user
  ansible.builtin.file:
    path: "/home/{{ media_smb_owner }}/.kodi/userdata/sources.xml"
    state: file
    owner: "{{ media_smb_owner }}"
    group: "{{ media_smb_group }}"
    mode: "0644"

- name: Apply service restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Kodi after media source restart
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ media_smb_owner }}"
      - -x
      - kodi.bin
  register: media_smb_kodi_running
  changed_when: false
  retries: 30
  delay: 2
  until: media_smb_kodi_running.rc == 0

- name: Verify one Kodi process after media source restart
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ media_smb_owner }}"
      - -x
      - kodi.bin
  register: media_smb_kodi_singleton
  changed_when: false
  failed_when: media_smb_kodi_singleton.stdout_lines | length != 1

- name: Verify Samba configuration
  ansible.builtin.command:
    argv:
      - testparm
      - -s
  changed_when: false

- name: Verify SMB listener
  ansible.builtin.command:
    argv:
      - ss
      - -ltn
      - "sport = :445"
  register: media_smb_listener
  changed_when: false
  failed_when: "'445' not in media_smb_listener.stdout"

- name: Verify authenticated share locally
  ansible.builtin.command:
    argv:
      - smbclient
      - "//127.0.0.1/{{ media_smb_share_name }}"
      - "-U"
      - "{{ media_smb_owner }}"
      - "-c"
      - "ls"
  environment:
    PASSWD: "{{ media_smb_password }}"
  changed_when: false
  no_log: true

- name: Verify Kodi media sources
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import xml.etree.ElementTree as E;
        r=E.parse('/home/{{ media_smb_owner }}/.kodi/userdata/sources.xml').getroot();
        v={s.findtext('name'):s.findtext('path') for s in r.find('video').findall('source')};
        m={s.findtext('name'):s.findtext('path') for s in r.find('music').findall('source')};
        assert v.get('Movies') == '{{ media_smb_path }}/Movies/';
        assert v.get('TV Shows') == '{{ media_smb_path }}/TV/';
        assert m.get('Music') == '{{ media_smb_path }}/Music/'
  changed_when: false
