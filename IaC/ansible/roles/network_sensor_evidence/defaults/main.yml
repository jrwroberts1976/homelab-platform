---
network_sensor_evidence_hours: 24

network_sensor_evidence_suricata_log: "/var/log/suricata/eve.json"
network_sensor_evidence_zeek_log_directory: "/opt/zeek/logs"

# Capture-health evidence. These measurements describe the quality of the
# passive observation path; they do not classify security events.
network_sensor_evidence_capture_interface: "{{ network_sensor_capture_interface | default('') }}"
network_sensor_evidence_suricata_stats_log: "/var/log/suricata/stats.log"
network_sensor_evidence_zeek_capture_loss_log: "/opt/zeek/logs/current/capture_loss.log"
network_sensor_evidence_suricata_service: "suricata.service"
network_sensor_evidence_zeek_service: "homelab-zeek.service"

# Conservative initial degradation thresholds. Capture health is reported
# separately from alert significance.
network_sensor_evidence_suricata_drop_warn_percent: 0.1
network_sensor_evidence_zeek_loss_warn_percent: 0.5

network_sensor_evidence_state_directory: "/var/lib/homelab-network-sensor-evidence"
network_sensor_evidence_file: "/var/lib/homelab-network-sensor-evidence/evidence.json"

network_sensor_evidence_internal_networks:
  - "192.168.2.0/24"
  - "10.8.0.0/24"

network_sensor_evidence_noise_signatures:
  - "SURICATA Ethertype unknown"
  - "SURICATA STREAM Packet with invalid ack"
  - "SURICATA STREAM SHUTDOWN RST invalid ack"

# Narrowly scoped, validated expected activity.
# Raw Suricata alerts remain untouched; these are excluded only from
# management evidence significance classification.
network_sensor_evidence_expected_activity:
  - signature_id: 2003068
    src_ip: "192.168.2.48"
    dest_ip: "20.26.156.215"
    dest_port: 22
    proto: "TCP"
    reason: "admin-01 GitHub SSH"

network_sensor_evidence_collection_minutes: 15
network_sensor_evidence_retention_hours: 26
network_sensor_evidence_sample_limit: 10
network_sensor_evidence_state_file: "/var/lib/homelab-network-sensor-evidence/state.json"

# Secure publication of sensor evidence to monitor-01.
#
# The private transfer key is deliberately NOT managed by Git/Ansible.
# It must already exist on sensor-01 with root-only permissions.
network_sensor_evidence_publish_enabled: true
network_sensor_evidence_publish_host: "{{ hostvars['monitor-01']['ansible_host'] }}"
network_sensor_evidence_publish_user: "evidence-sensor"
network_sensor_evidence_publish_remote_file: "incoming/evidence.json"

network_sensor_evidence_transfer_directory: "/etc/homelab/evidence-transfer"
network_sensor_evidence_transfer_private_key: "/etc/homelab/evidence-transfer/sensor-to-monitor"
network_sensor_evidence_transfer_public_key: "/etc/homelab/evidence-transfer/sensor-to-monitor.pub"
network_sensor_evidence_transfer_known_hosts: "/etc/homelab/evidence-transfer/known_hosts"

# Pinned monitor-01 ED25519 host key.
network_sensor_evidence_monitor_host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJH2QYkVmOSh71farN0ybXrpLgFw4s1ysEDt6AXKi8vh"
