---
komodo_periphery_expected_hostname: "{{ inventory_hostname }}"
komodo_periphery_expected_ipv4: "{{ ansible_host }}"

komodo_periphery_root: /etc/komodo
komodo_periphery_image: "ghcr.io/moghtech/komodo-periphery:2.3.3"

komodo_periphery_core_address: "http://192.168.2.58:9120"
komodo_periphery_connect_as: "{{ inventory_hostname }}"

komodo_periphery_onboarding_key_file: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.config/homelab-iac/{{ inventory_hostname }}-komodo-onboarding.key

komodo_periphery_allow_deploy: false

# Bootstrap is temporary and must only be enabled for initial enrolment
# or an explicitly approved identity-recovery operation.
komodo_periphery_bootstrap: false
