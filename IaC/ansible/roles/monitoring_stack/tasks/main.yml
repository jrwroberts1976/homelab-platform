---
- name: Validate monitor-01 identity
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
      - ansible_facts.hostname == monitoring_expected_hostname
      - ansible_facts.default_ipv4.address == monitoring_expected_ipv4
      - ansible_facts.default_ipv4.interface == "eth0"
    fail_msg: >-
      Refusing to deploy monitoring: expected Debian 13 monitor-01 at
      192.168.2.52 on eth0.

- name: Read monitor-01 systemd-resolved uplink DNS
  ansible.builtin.command:
    argv:
      - resolvectl
      - dns
      - eth0
  register: monitoring_resolvectl_dns
  changed_when: false
  failed_when: >-
    '192.168.2.51' not in monitoring_resolvectl_dns.stdout
    or '192.168.2.50' not in monitoring_resolvectl_dns.stdout
    or '192.168.2.48' in monitoring_resolvectl_dns.stdout

- name: Validate local DNS resolution
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - dns-01.jameshouse
  register: monitoring_local_dns
  changed_when: false
  failed_when: "'192.168.2.51' not in monitoring_local_dns.stdout"

- name: Require protected Grafana admin password
  ansible.builtin.assert:
    that:
      - monitoring_grafana_admin_password | length >= 24
    fail_msg: >-
      No valid Grafana admin password is available. On a first deployment,
      export GRAFANA_ADMIN_PASSWORD on the Ansible controller. Existing
      deployments may reuse the protected /opt/monitoring/.env value.
  no_log: true

- name: Install Docker and monitoring prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - docker.io
      - docker-compose
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Create monitoring configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ monitoring_root }}"
    - "{{ monitoring_root }}/prometheus"
    - "{{ monitoring_root }}/alertmanager"
    - "{{ monitoring_root }}/blackbox"
    - "{{ monitoring_root }}/loki"
    - "{{ monitoring_root }}/grafana"
    - "{{ monitoring_root }}/grafana/provisioning"
    - "{{ monitoring_root }}/grafana/provisioning/datasources"
    - "{{ monitoring_root }}/grafana/provisioning/dashboards"
    - "{{ monitoring_root }}/grafana/provisioning/dashboards/homelab"
    - "{{ monitoring_root }}/grafana/provisioning/dashboards/production"

- name: Ensure monitor node-exporter textfile directory exists
  ansible.builtin.file:
    path: "{{ monitoring_node_exporter_textfile_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Loki heartbeat freshness collector
  ansible.builtin.template:
    src: loki-heartbeat-metrics.py.j2
    dest: /usr/local/sbin/homelab-loki-heartbeat-metrics
    owner: root
    group: root
    mode: "0755"

- name: Install Loki heartbeat freshness service
  ansible.builtin.template:
    src: homelab-loki-heartbeat-metrics.service.j2
    dest: /etc/systemd/system/homelab-loki-heartbeat-metrics.service
    owner: root
    group: root
    mode: "0644"

- name: Install Loki heartbeat freshness timer
  ansible.builtin.template:
    src: homelab-loki-heartbeat-metrics.timer.j2
    dest: /etc/systemd/system/homelab-loki-heartbeat-metrics.timer
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd for Loki heartbeat collector
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false

- name: Install protected monitoring environment
  ansible.builtin.template:
    src: monitoring.env.j2
    dest: "{{ monitoring_root }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install Docker Compose definition
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_root }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Install Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ monitoring_root }}/loki/loki.yml"
    owner: root
    group: root
    mode: "0644"

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_root }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "0644"

- name: Install Prometheus alert rules
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: "{{ monitoring_root }}/prometheus/alerts.yml"
    owner: root
    group: root
    mode: "0644"

- name: Validate SMTP relay connectivity from monitor-01
  ansible.builtin.wait_for:
    host: "{{ monitoring_alert_smtp_smarthost.split(':')[0] }}"
    port: "{{ monitoring_alert_smtp_smarthost.split(':')[1] | int }}"
    timeout: 30
    state: started
  changed_when: false

- name: Install Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ monitoring_root }}/alertmanager/alertmanager.yml"
    owner: root
    group: root
    mode: "0644"
  register: monitoring_alertmanager_config

- name: Install Blackbox Exporter configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ monitoring_root }}/blackbox/blackbox.yml"
    owner: root
    group: root
    mode: "0644"

- name: Provision Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-prometheus-datasource.yml.j2
    dest: "{{ monitoring_root }}/grafana/provisioning/datasources/prometheus.yml"
    owner: root
    group: root
    mode: "0644"

- name: Provision Grafana Alertmanager datasource
  ansible.builtin.template:
    src: grafana-alertmanager-datasource.yml.j2
    dest: "{{ monitoring_root }}/grafana/provisioning/datasources/alertmanager.yml"
    owner: root
    group: root
    mode: "0644"

- name: Provision Grafana Loki datasource
  ansible.builtin.template:
    src: grafana-loki-datasource.yml.j2
    dest: "{{ monitoring_root }}/grafana/provisioning/datasources/loki.yml"
    owner: root
    group: root
    mode: "0644"

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboard-provider.yml.j2
    dest: "{{ monitoring_root }}/grafana/provisioning/dashboards/homelab.yml"
    owner: root
    group: root
    mode: "0644"
  register: monitoring_grafana_dashboard_provider

- name: Install provisioned Grafana dashboards
  ansible.builtin.copy:
    src: "grafana/dashboards/{{ item }}"
    dest: "{{ monitoring_root }}/grafana/provisioning/dashboards/homelab/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ monitoring_grafana_dashboard_files }}"
  register: monitoring_grafana_dashboard_files_result

- name: Install reviewed Grafana dashboards in production directory
  ansible.builtin.copy:
    src: "grafana/dashboards/production/{{ item }}"
    dest: "{{ monitoring_root }}/grafana/provisioning/dashboards/production/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ monitoring_grafana_production_dashboard_files }}"
  register: monitoring_grafana_production_dashboard_files_result

- name: Remove legacy copies of reviewed dashboards from Homelab provider
  ansible.builtin.file:
    path: "{{ monitoring_root }}/grafana/provisioning/dashboards/homelab/{{ item }}"
    state: absent
  loop: "{{ monitoring_grafana_production_dashboard_files }}"
  register: monitoring_grafana_legacy_dashboard_files_result

- name: Remove retired Patch & Software dashboard JSON
  ansible.builtin.file:
    path: "{{ monitoring_root }}/grafana/provisioning/dashboards/homelab/homelab-patch-estate.json"
    state: absent
  register: monitoring_grafana_retired_patch_result

- name: Validate reviewed Grafana dashboard JSON
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - json.tool
      - "{{ monitoring_root }}/grafana/provisioning/dashboards/production/{{ item }}"
  loop: "{{ monitoring_grafana_production_dashboard_files }}"
  changed_when: false

- name: Validate provisioned Grafana dashboard JSON
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - json.tool
      - "{{ monitoring_root }}/grafana/provisioning/dashboards/homelab/{{ item }}"
  loop: "{{ monitoring_grafana_dashboard_files }}"
  changed_when: false

- name: Validate Prometheus alert rules
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/promtool
      - -v
      - "{{ monitoring_root }}/prometheus:/etc/prometheus:ro"
      - "{{ monitoring_prometheus_image }}"
      - check
      - rules
      - /etc/prometheus/alerts.yml
  changed_when: false

- name: Validate Loki configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ monitoring_root }}/loki:/etc/loki:ro"
      - "{{ monitoring_loki_image }}"
      - -config.file=/etc/loki/loki.yml
      - -verify-config=true
  changed_when: false

- name: Validate Docker Compose configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ monitoring_root }}"
      - config
      - --quiet
  changed_when: false

- name: Pull pinned monitoring images
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ monitoring_root }}"
      - pull
  register: monitoring_compose_pull
  changed_when: false

- name: Reconcile monitoring containers
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ monitoring_root }}"
      - up
      - -d
      - --remove-orphans
  register: monitoring_compose_up
  changed_when: >-
    'Creating' in monitoring_compose_up.stderr
    or 'Created' in monitoring_compose_up.stderr
    or 'Recreating' in monitoring_compose_up.stderr
    or 'Recreated' in monitoring_compose_up.stderr
    or 'Starting' in monitoring_compose_up.stderr
    or 'Started' in monitoring_compose_up.stderr

- name: Restart Grafana after dashboard provisioning changes
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ monitoring_root }}"
      - restart
      - grafana
  when: >-
    monitoring_grafana_dashboard_provider.changed
    or monitoring_grafana_dashboard_files_result.changed
    or monitoring_grafana_production_dashboard_files_result.changed
    or monitoring_grafana_legacy_dashboard_files_result.changed
    or monitoring_grafana_retired_patch_result.changed
  changed_when: true

- name: Validate Alertmanager configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ monitoring_root }}"
      - exec
      - -T
      - alertmanager
      - amtool
      - check-config
      - /etc/alertmanager/alertmanager.yml
  changed_when: false

- name: Restart Alertmanager after configuration change
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ monitoring_root }}"
      - restart
      - alertmanager
  when: monitoring_alertmanager_config.changed
  changed_when: true

- name: Wait for Loki readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:3100/ready
    status_code: 200
    return_content: true
  register: monitoring_loki_ready
  until:
    - monitoring_loki_ready.status == 200
    - "'ready' in (monitoring_loki_ready.content | lower)"
  retries: 30
  delay: 2

- name: Verify Loki build information API
  ansible.builtin.uri:
    url: http://127.0.0.1:3100/loki/api/v1/status/buildinfo
    status_code: 200
    return_content: true
  register: monitoring_loki_buildinfo
  changed_when: false
  failed_when: >-
    monitoring_loki_buildinfo.status != 200
    or monitoring_loki_buildinfo.json.version is not defined

- name: Enable Loki heartbeat freshness timer
  ansible.builtin.systemd_service:
    name: homelab-loki-heartbeat-metrics.timer
    state: started
    enabled: true

- name: Prime Loki heartbeat freshness metrics
  ansible.builtin.command:
    argv:
      - systemctl
      - start
      - homelab-loki-heartbeat-metrics.service
  changed_when: false

- name: Verify node-exporter publishes Loki heartbeat metrics
  ansible.builtin.uri:
    url: http://127.0.0.1:9100/metrics
    status_code: 200
    return_content: true
  register: monitoring_heartbeat_metrics
  changed_when: false
  failed_when: >-
    monitoring_heartbeat_metrics.status != 200
    or 'homelab_loki_heartbeat_query_success' not in monitoring_heartbeat_metrics.content
    or 'homelab_loki_heartbeat_present' not in monitoring_heartbeat_metrics.content

- name: Wait for Prometheus readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    status_code: 200
    return_content: true
  register: monitoring_prometheus_ready
  until: monitoring_prometheus_ready.status == 200
  retries: 30
  delay: 2

- name: Reload Prometheus configuration
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/reload
    method: POST
    status_code: 200
  changed_when: false

- name: Verify Prometheus runtime config contains required jobs
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/status/config
    status_code: 200
    return_content: true
  register: monitoring_prometheus_runtime_config
  changed_when: false
  failed_when: >-
    'job_name: node-exporter' not in monitoring_prometheus_runtime_config.json.data.yaml
    or 'job_name: loki' not in monitoring_prometheus_runtime_config.json.data.yaml

- name: Verify production alert rules are loaded
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/rules
    status_code: 200
    return_content: true
  register: monitoring_prometheus_rules
  changed_when: false
  failed_when: >-
    'DNSServiceDown' not in monitoring_prometheus_rules.content
    or 'ProxmoxHTTPSDown' not in monitoring_prometheus_rules.content
    or 'CoreHostUnreachable' not in monitoring_prometheus_rules.content
    or 'NodeExporterDown' not in monitoring_prometheus_rules.content
    or 'AlloyServiceDown' not in monitoring_prometheus_rules.content
    or 'AlloyWriteDroppedEntries' not in monitoring_prometheus_rules.content
    or 'AlloyTelemetrySilent' not in monitoring_prometheus_rules.content
    or 'NodeFilesystemSpaceLow' not in monitoring_prometheus_rules.content
    or 'NodeMemoryHigh' not in monitoring_prometheus_rules.content
    or 'NodeCPUHigh' not in monitoring_prometheus_rules.content

- name: Wait for Grafana health
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/health
    status_code: 200
    return_content: true
  register: monitoring_grafana_health
  until:
    - monitoring_grafana_health.status == 200
    - monitoring_grafana_health.json.database == "ok"
  retries: 30
  delay: 2

- name: Verify provisioned Grafana dashboards
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/dashboards/uid/{{ item }}"
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
    return_content: false
  loop: "{{ monitoring_grafana_dashboard_uids }}"
  register: monitoring_grafana_dashboard_verify
  until: monitoring_grafana_dashboard_verify.status == 200
  retries: 15
  delay: 2
  no_log: true

- name: Wait for Alertmanager readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:9093/-/ready
    status_code: 200
    return_content: true
  register: monitoring_alertmanager_ready
  until: monitoring_alertmanager_ready.status == 200
  retries: 30
  delay: 2

- name: Wait for Blackbox Exporter
  ansible.builtin.uri:
    url: http://127.0.0.1:9115/
    status_code: 200
    return_content: true
  register: monitoring_blackbox_ready
  until: monitoring_blackbox_ready.status == 200
  retries: 30
  delay: 2

- name: Wait for Prometheus target discovery
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/targets
    status_code: 200
    return_content: true
  register: monitoring_prometheus_targets
  until:
    - monitoring_prometheus_targets.json.status == "success"
    - >-
      monitoring_prometheus_targets.json.data.activeTargets | length
      >= (
        3
        + (monitoring_node_exporter_targets | length)
        + (monitoring_icmp_targets | length)
        + (monitoring_pve_https_targets | length)
        + (monitoring_dns_tcp_targets | length)
      )
  retries: 30
  delay: 2

- name: Wait for Loki Prometheus target to become healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/targets
    status_code: 200
    return_content: true
  register: monitoring_loki_target_status
  changed_when: false
  until:
    - monitoring_loki_target_status.json.status == "success"
    - >-
      monitoring_loki_target_status.json.data.activeTargets
      | selectattr('labels.job', 'equalto', 'loki')
      | selectattr('health', 'equalto', 'up')
      | list
      | length == 1
  retries: 30
  delay: 2

- name: Wait for node exporter targets to become healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/targets
    status_code: 200
    return_content: true
  register: monitoring_node_exporter_target_status
  changed_when: false
  until:
    - monitoring_node_exporter_target_status.json.status == "success"
    - >-
      monitoring_node_exporter_target_status.json.data.activeTargets
      | selectattr('labels.job', 'equalto', 'node-exporter')
      | list
      | length == (monitoring_node_exporter_targets | length)
    - >-
      monitoring_node_exporter_target_status.json.data.activeTargets
      | selectattr('labels.job', 'equalto', 'node-exporter')
      | rejectattr('health', 'equalto', 'up')
      | list
      | length == 0
  retries: 30
  delay: 2

- name: Show monitoring container state
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ monitoring_root }}"
      - ps
  register: monitoring_compose_ps
  changed_when: false

- name: Verify monitor-01 has no failed systemd units
  ansible.builtin.command:
    argv:
      - systemctl
      - --failed
      - --no-legend
      - --plain
  register: monitoring_failed_units
  changed_when: false
  failed_when: monitoring_failed_units.stdout | trim | length > 0
