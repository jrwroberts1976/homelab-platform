---
network_host_ai_resolver_expected_hostname: monitor-01
network_host_ai_resolver_state_dir: /var/lib/homelab-network-hosts
network_host_ai_resolver_inventory: "{{ network_host_ai_resolver_state_dir }}/inventory.json"
network_host_ai_resolver_profiles: "{{ network_host_ai_resolver_state_dir }}/deep-profiles.json"
network_host_ai_resolver_dns: "{{ network_host_ai_resolver_state_dir }}/dns-evidence.json"
network_host_ai_resolver_enrichment: "{{ network_host_ai_resolver_state_dir }}/enrichment.json"
network_host_ai_resolver_router_db: /var/lib/asus-network-inventory/assets.db
network_host_ai_resolver_optional_zeek: "{{ network_host_ai_resolver_state_dir }}/zeek-flow-summary.json"
network_host_ai_resolver_greenbone: /var/lib/homelab-management-report/evidence-sources/greenbone-01/incoming/managed.json
network_host_ai_resolver_greenbone_freshness_seconds: 108000
network_host_ai_resolver_output: "{{ network_host_ai_resolver_state_dir }}/ai-identification.json"
network_host_ai_resolver_script: /usr/local/sbin/homelab-network-host-ai-resolver
network_host_ai_resolver_service_name: homelab-network-host-ai-resolver.service
network_host_ai_resolver_timer_name: homelab-network-host-ai-resolver.timer
network_host_ai_resolver_environment: /etc/homelab-network-hosts/ai-resolver.env
network_host_ai_resolver_model: gpt-5-mini
network_host_ai_resolver_max_devices_per_run: 10
network_host_ai_resolver_retry_seconds: 604800
network_host_ai_resolver_first_assessment_delay_seconds: 3600
network_host_ai_resolver_history_limit: 5
network_host_ai_resolver_on_calendar: hourly
network_host_ai_resolver_randomized_delay_seconds: 300
network_host_ai_resolver_allow_deploy: false
network_host_ai_resolver_enable_timer: false
