---
zabbix_version: "7.0"
zabbix_repository_family: "{{ 'debian-arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'debian' }}"
zabbix_server_packages:
  - zabbix-server-pgsql
  - zabbix-frontend-php
  - zabbix-nginx-conf
  - zabbix-sql-scripts
  - zabbix-agent2
  - postgresql-client
  - php8.4-pgsql
  - locales
zabbix_server_db_host: localhost
zabbix_server_db_port: 5432
zabbix_server_db_name: zabbix
zabbix_server_db_user: zabbix
zabbix_server_initialize_schema: true
zabbix_server_nginx_listen: 8080
zabbix_server_nginx_server_name: _
zabbix_server_service_name: zabbix-server
zabbix_server_agent_service_name: zabbix-agent2

# Optional trusted HTTPS frontend.
zabbix_server_https_enabled: false
zabbix_server_https_fqdn: ""
zabbix_server_https_listen: 443
zabbix_server_https_certificate: ""
zabbix_server_https_private_key: ""
zabbix_server_https_backend: "http://127.0.0.1:8080"
