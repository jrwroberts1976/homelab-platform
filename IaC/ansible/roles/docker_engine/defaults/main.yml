---
docker_engine_expected_hostname: ""
docker_engine_expected_ipv4: ""

docker_engine_supported_debian_major_versions:
  - "12"
  - "13"

docker_engine_repository_url: https://download.docker.com/linux/debian
docker_engine_repository_key_url: https://download.docker.com/linux/debian/gpg
docker_engine_repository_key_path: /etc/apt/keyrings/docker.asc
docker_engine_repository_file: /etc/apt/sources.list.d/docker.sources

docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_engine_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-doc
  - docker-buildx
  - podman-docker
  - containerd
  - runc
