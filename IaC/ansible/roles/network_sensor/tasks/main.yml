---
- name: Validate sensor target identity
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
      - ansible_facts.hostname == network_sensor_expected_hostname
      - network_sensor_expected_ipv4 in ansible_facts.all_ipv4_addresses
    fail_msg: >-
      Refusing to configure network sensor: expected Debian 13
      {{ network_sensor_expected_hostname }} with {{ network_sensor_expected_ipv4 }}.

- name: Validate system DNS before repository operations
  ansible.builtin.command:
    argv:
      - timeout
      - 10s
      - getent
      - ahostsv4
      - deb.debian.org
  register: network_sensor_dns_preflight
  changed_when: false
  failed_when: >-
    network_sensor_dns_preflight.rc != 0
    or network_sensor_dns_preflight.stdout | trim | length == 0

- name: Install network sensor baseline utilities
  ansible.builtin.apt:
    name: "{{ network_sensor_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Debian backports for Suricata 8
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/homelab-trixie-backports.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb https://deb.debian.org/debian trixie-backports main
  register: network_sensor_backports_source

- name: Download Zeek repository signing key
  ansible.builtin.get_url:
    url: "{{ network_sensor_zeek_repository }}Release.key"
    dest: /usr/share/keyrings/zeek-release.key
    owner: root
    group: root
    mode: "0644"
  register: network_sensor_zeek_key

- name: Convert Zeek repository key to keyring format
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /usr/share/keyrings/zeek.gpg
      - /usr/share/keyrings/zeek-release.key
  when: network_sensor_zeek_key.changed
  register: network_sensor_zeek_key_convert
  changed_when: network_sensor_zeek_key_convert.rc == 0

- name: Configure official Zeek Debian 13 repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/security-zeek.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/zeek.gpg] {{ network_sensor_zeek_repository }} /
  register: network_sensor_zeek_source

- name: Refresh apt metadata after repository changes
  ansible.builtin.apt:
    update_cache: true
  when: >-
    network_sensor_backports_source.changed
    or network_sensor_zeek_source.changed
    or network_sensor_zeek_key.changed

- name: Install Suricata 8 and rule manager without starting services
  ansible.builtin.apt:
    name:
      - suricata
      - suricata-update
    state: present
    default_release: "{{ network_sensor_suricata_backports_suite }}"
    policy_rc_d: 101

- name: Install Zeek LTS
  ansible.builtin.apt:
    name: "{{ network_sensor_zeek_package }}"
    state: present
    policy_rc_d: 101

- name: Keep Suricata disabled until capture interface exists
  ansible.builtin.systemd_service:
    name: suricata
    enabled: false
    state: stopped

- name: Verify Suricata binary
  ansible.builtin.command:
    argv:
      - suricata
      - --build-info
  register: network_sensor_suricata_build
  changed_when: false
  failed_when: network_sensor_suricata_build.rc != 0

- name: Verify suricata-update binary
  ansible.builtin.command:
    argv:
      - suricata-update
      - --version
  register: network_sensor_suricata_update_version
  changed_when: false

- name: Verify Zeek binary
  ansible.builtin.command:
    argv:
      - /opt/zeek/bin/zeek
      - --version
  register: network_sensor_zeek_version
  changed_when: false

- name: Verify packet troubleshooting tools
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - --version
  loop:
    - tcpdump
    - ethtool
  register: network_sensor_tool_versions
  changed_when: false
  failed_when: false

- name: Verify packet engines are not listening on management interface
  ansible.builtin.shell: |
    set -euo pipefail
    ! pgrep -x suricata >/dev/null
    ! pgrep -x zeek >/dev/null
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify no failed systemd units
  ansible.builtin.command:
    argv:
      - systemctl
      - --failed
      - --no-legend
      - --plain
  register: network_sensor_failed_units
  changed_when: false
  failed_when: network_sensor_failed_units.stdout | trim | length > 0
