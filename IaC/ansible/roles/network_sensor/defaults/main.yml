---
network_sensor_expected_hostname: sensor-01
network_sensor_expected_ipv4: 192.168.2.55

network_sensor_suricata_backports_suite: trixie-backports
network_sensor_zeek_repository: "https://download.opensuse.org/repositories/security:/zeek/Debian_13/"
network_sensor_zeek_package: zeek-lts

# Safe by default: packet capture is inactive unless the host explicitly opts in.
network_sensor_capture_enabled: false
network_sensor_capture_interface: ""
network_sensor_home_net: "192.168.2.0/24"
network_sensor_community_id_seed: 0

network_sensor_expected_suricata_major_minor: "8.0"
network_sensor_expected_zeek_major_minor: "8.0"

network_sensor_base_packages:
  - ca-certificates
  - curl
  - ethtool
  - gnupg
  - iproute2
  - jq
  - logrotate
  - pciutils
  - tcpdump
  - usbutils
