---
komodo_core_expected_hostname: komodo-01
komodo_core_expected_ipv4: 192.168.2.58

komodo_core_stack_root: /opt/komodo
komodo_core_backup_root: /var/backups/komodo
komodo_core_secret_root: /opt/komodo/secrets

# mongo:8.0.32 reads *_FILE secrets after dropping to mongodb.
# The official image defines the mongodb account as UID/GID 999.
komodo_core_mongo_secret_uid: "999"
komodo_core_mongo_secret_gid: "999"

komodo_core_allow_deploy: false

komodo_core_image: "ghcr.io/moghtech/komodo-core:2.3.3"
komodo_core_mongo_image: "mongo:8.0.32"

komodo_core_http_bind: "192.168.2.58"
komodo_core_http_port: 9120
komodo_core_host_url: "https://komodo-01.jameshouse:9120"

komodo_core_tls_enabled: true
komodo_core_tls_root: "{{ komodo_core_stack_root }}/tls"

komodo_core_tls_ca_source: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.config/homelab-iac/pki/komodo/komodo-ca.crt

komodo_core_tls_cert_source: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.config/homelab-iac/pki/komodo/komodo-01.crt

komodo_core_tls_key_source: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.config/homelab-iac/pki/komodo/komodo-01.key

komodo_core_tls_ca_path: "{{ komodo_core_tls_root }}/komodo-ca.crt"
komodo_core_tls_cert_path: "{{ komodo_core_tls_root }}/komodo-01.crt"
komodo_core_tls_key_path: "{{ komodo_core_tls_root }}/komodo-01.key"

komodo_core_title: "Komodo"
komodo_core_timezone: "Europe/London"

komodo_core_database_username: "komodo"

komodo_core_admin_username: >-
  {{
    lookup('ansible.builtin.env', 'KOMODO_INIT_ADMIN_USERNAME')
    | default('', true)
  }}

komodo_core_admin_password: >-
  {{
    lookup('ansible.builtin.env', 'KOMODO_INIT_ADMIN_PASSWORD')
    | default('', true)
  }}

komodo_core_database_password: >-
  {{
    lookup('ansible.builtin.env', 'KOMODO_DATABASE_PASSWORD')
    | default('', true)
  }}

komodo_core_jwt_secret: >-
  {{
    lookup('ansible.builtin.env', 'KOMODO_JWT_SECRET')
    | default('', true)
  }}

komodo_core_webhook_secret: >-
  {{
    lookup('ansible.builtin.env', 'KOMODO_WEBHOOK_SECRET')
    | default('', true)
  }}
