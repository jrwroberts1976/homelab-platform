---
mail_relay_expected_ipv4: "{{ ansible_host }}"
mail_relay_hostname: "{{ inventory_hostname }}"
mail_relay_domain: "jameshouse"
mail_relay_relayhost: "[smtp.gmail.com]:587"

# Relay is deliberately not open to the whole LAN. Add new service hosts here
# through Git when they need SMTP.
mail_relay_allowed_clients:
  - "127.0.0.0/8"
  - "192.168.2.50/32"
  - "192.168.2.51/32"
  - "192.168.2.52/32"
  - "192.168.2.70/32"
  - "192.168.2.71/32"

mail_relay_gmail_username: ""
mail_relay_gmail_app_password: ""
