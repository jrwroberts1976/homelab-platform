---
automated_patching_enabled: true
automated_patching_update_package_lists: 1
automated_patching_unattended_upgrade: 1
automated_patching_autoclean_interval: 7
automated_patching_automatic_reboot: false
automated_patching_remove_unused_kernel_packages: true
automated_patching_remove_new_unused_dependencies: true
automated_patching_remove_unused_dependencies: true
automated_patching_syslog_enable: true

automated_patching_status_dir: /var/lib/homelab-patching
automated_patching_textfile_dir: /var/lib/prometheus/node-exporter
automated_patching_status_script: /usr/local/sbin/homelab-patch-status
automated_patching_status_interval: 1h
automated_patching_status_randomized_delay_seconds: 300
automated_patching_publish_status: true
