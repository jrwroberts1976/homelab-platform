---
- name: Require Debian-family host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: "automated_patching currently supports Debian-family hosts only"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: automated_patching_enabled | bool

- name: Configure periodic APT automation
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: automated_patching_enabled | bool

- name: Configure homelab unattended-upgrades policy
  ansible.builtin.template:
    src: 52homelab-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: automated_patching_enabled | bool

- name: Ensure APT update timers are enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  when: automated_patching_enabled | bool

- name: Read effective unattended-upgrades configuration
  ansible.builtin.command:
    argv:
      - apt-config
      - dump
  register: automated_patching_apt_config
  changed_when: false
  when: automated_patching_enabled | bool

- name: Verify security-only policy and disabled automatic reboot
  ansible.builtin.assert:
    that:
      - "'label=Debian-Security' in automated_patching_apt_config.stdout"
      - "'Unattended-Upgrade::Automatic-Reboot \"false\"' in automated_patching_apt_config.stdout"
    fail_msg: "Effective unattended-upgrades policy is not security-only/no-auto-reboot as expected"
  when: automated_patching_enabled | bool
