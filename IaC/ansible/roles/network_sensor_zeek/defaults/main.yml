---
network_sensor_zeek_expected_hostname: sensor-01
network_sensor_zeek_expected_ipv4: 192.168.2.55
network_sensor_zeek_capture_gate_file: /etc/homelab-network-sensor/capture-enabled
network_sensor_zeek_prefix: /opt/zeek
network_sensor_zeek_service_name: homelab-zeek.service
