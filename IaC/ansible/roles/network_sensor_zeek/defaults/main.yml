network_sensor_zeek_conn_log: /opt/zeek/logs/current/conn.log
network_sensor_zeek_runtime_wait_seconds: 30
network_sensor_zeek_flow_summary_enabled: true
network_sensor_zeek_flow_summary_script: /usr/local/sbin/homelab-zeek-flow-summary
network_sensor_zeek_flow_summary_state_dir: /var/lib/homelab-network-hosts
