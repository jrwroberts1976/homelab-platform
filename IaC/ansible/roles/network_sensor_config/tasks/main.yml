---
- name: Validate network sensor target and capture intent
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
      - ansible_facts.hostname == network_sensor_config_expected_hostname
      - network_sensor_config_expected_ipv4 in ansible_facts.all_ipv4_addresses
      - not network_sensor_config_capture_enabled or network_sensor_config_capture_interface | length > 0
      - not network_sensor_config_capture_enabled or network_sensor_config_capture_mac is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
      - network_sensor_config_capture_enabled or network_sensor_config_capture_interface | length == 0
    fail_msg: >-
      Refusing network sensor configuration: expected Debian 13 sensor-01 at
      {{ network_sensor_config_expected_ipv4 }} and an explicit, valid capture
      interface/MAC pair when active capture is enabled.

- name: Verify sensor binaries exist
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - --help
  loop:
    - /usr/bin/suricata-update
    - /opt/zeek/bin/zeek
  register: network_sensor_config_binary_checks
  changed_when: false
  failed_when: false

- name: Keep Suricata disabled when active capture is not enabled
  ansible.builtin.systemd_service:
    name: suricata
    enabled: false
    state: stopped
  when: not network_sensor_config_capture_enabled

- name: Verify Zeek is not running before configuration
  ansible.builtin.shell: |
    set -euo pipefail
    ! pgrep -x zeek >/dev/null
  args:
    executable: /bin/bash
  changed_when: false

- name: Install network sensor configuration prerequisites
  ansible.builtin.apt:
    name:
      - openssl
      - ethtool
    state: present

- name: Install full Debian kernel for USB capture support
  ansible.builtin.apt:
    name: "{{ network_sensor_config_kernel_package }}"
    state: present
  when: network_sensor_config_capture_enabled

- name: Find newest installed generic Debian kernel
  ansible.builtin.shell: |
    set -euo pipefail
    ls -1 /boot/vmlinuz-*+deb13-amd64 2>/dev/null \
      | grep -v -- '-cloud-' \
      | sed 's#^/boot/vmlinuz-##' \
      | sort -V \
      | tail -1
  args:
    executable: /bin/bash
  register: network_sensor_config_generic_kernel
  changed_when: false
  failed_when: >-
    network_sensor_config_capture_enabled
    and network_sensor_config_generic_kernel.stdout | trim | length == 0
  when: network_sensor_config_capture_enabled

- name: Select generic Debian kernel as GRUB default
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_DEFAULT='
    line: >-
      GRUB_DEFAULT="Advanced options for Debian GNU/Linux>Debian GNU/Linux, with Linux {{ network_sensor_config_generic_kernel.stdout | trim }}"
    backup: true
  register: network_sensor_config_grub_default
  when: network_sensor_config_capture_enabled

- name: Regenerate GRUB after default-kernel change
  ansible.builtin.command:
    argv:
      - update-grub
  when:
    - network_sensor_config_capture_enabled
    - network_sensor_config_grub_default.changed
  register: network_sensor_config_update_grub
  changed_when: network_sensor_config_update_grub.rc == 0

- name: Require running generic kernel before activating capture
  ansible.builtin.assert:
    that:
      - "'cloud' not in ansible_facts.kernel"
      - ansible_facts.kernel is search('\\+deb13-amd64$')
    fail_msg: >-
      The generic Debian kernel has been installed and selected, but sensor-01
      is still running {{ ansible_facts.kernel }}. Reboot sensor-01 and rerun
      this playbook before enabling packet capture.
  when: network_sensor_config_capture_enabled

- name: Create sensor capture gate directory
  ansible.builtin.file:
    path: "{{ network_sensor_config_gate_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove capture enable marker when capture is disabled
  ansible.builtin.file:
    path: "{{ network_sensor_config_capture_gate_file }}"
    state: absent
  when: not network_sensor_config_capture_enabled

- name: Install passive capture NIC configurator
  ansible.builtin.template:
    src: configure-sensor-capture-nic.j2
    dest: "{{ network_sensor_config_capture_script }}"
    owner: root
    group: root
    mode: "0755"
  register: network_sensor_config_capture_script_result
  when: network_sensor_config_capture_enabled

- name: Install passive capture NIC systemd unit
  ansible.builtin.template:
    src: sensor-capture-nic.service.j2
    dest: "{{ network_sensor_config_capture_service }}"
    owner: root
    group: root
    mode: "0644"
  register: network_sensor_config_capture_service_result
  when: network_sensor_config_capture_enabled

- name: Create Suricata systemd drop-in directory
  ansible.builtin.file:
    path: "{{ network_sensor_config_suricata_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Suricata capture safety gate
  ansible.builtin.copy:
    dest: "{{ network_sensor_config_suricata_dropin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by homelab-platform IaC.
      [Unit]
      ConditionPathExists={{ network_sensor_config_capture_gate_file }}
  register: network_sensor_config_suricata_gate_result

- name: Install Suricata capture-interface ordering
  ansible.builtin.template:
    src: suricata-capture-interface.conf.j2
    dest: "{{ network_sensor_config_suricata_capture_dropin }}"
    owner: root
    group: root
    mode: "0644"
  register: network_sensor_config_suricata_capture_dropin_result
  when: network_sensor_config_capture_enabled

- name: Remove Suricata capture-interface ordering when capture is disabled
  ansible.builtin.file:
    path: "{{ network_sensor_config_suricata_capture_dropin }}"
    state: absent
  register: network_sensor_config_suricata_capture_dropin_absent
  when: not network_sensor_config_capture_enabled

- name: Reload systemd after capture unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >-
    network_sensor_config_suricata_gate_result.changed
    or (network_sensor_config_capture_enabled and
        (network_sensor_config_capture_service_result.changed
         or network_sensor_config_suricata_capture_dropin_result.changed))
    or (not network_sensor_config_capture_enabled and
        network_sensor_config_suricata_capture_dropin_absent.changed)

- name: Restart capture NIC service after managed-file change
  ansible.builtin.systemd_service:
    name: sensor-capture-nic.service
    enabled: true
    state: restarted
  when:
    - network_sensor_config_capture_enabled
    - network_sensor_config_capture_script_result.changed or network_sensor_config_capture_service_result.changed

- name: Ensure capture NIC service is enabled and started
  ansible.builtin.systemd_service:
    name: sensor-capture-nic.service
    enabled: true
    state: started
  when:
    - network_sensor_config_capture_enabled
    - not (network_sensor_config_capture_script_result.changed or network_sensor_config_capture_service_result.changed)

- name: Verify passive capture NIC state
  ansible.builtin.shell: |
    set -euo pipefail
    IFACE='{{ network_sensor_config_capture_interface }}'
    EXPECTED_MAC='{{ network_sensor_config_capture_mac | lower }}'

    test -d "/sys/class/net/${IFACE}"
    test "$(cat "/sys/class/net/${IFACE}/address")" = "$EXPECTED_MAC"
    ! ip -4 -o addr show dev "$IFACE" | grep -q ' inet '
    ! ip -6 -o addr show dev "$IFACE" | grep -q ' inet6 '
    ip link show dev "$IFACE" | grep -q 'PROMISC'
    ethtool -k "$IFACE" | grep -Fq 'tcp-segmentation-offload: off'
    ethtool -k "$IFACE" | grep -Fq 'generic-segmentation-offload: off'
    ethtool -k "$IFACE" | grep -Fq 'generic-receive-offload: off'
  args:
    executable: /bin/bash
  changed_when: false
  when: network_sensor_config_capture_enabled

- name: Create capture enable marker after NIC validation
  ansible.builtin.copy:
    dest: "{{ network_sensor_config_capture_gate_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      managed_by=homelab-platform
      interface={{ network_sensor_config_capture_interface }}
      mac={{ network_sensor_config_capture_mac | lower }}
  register: network_sensor_config_capture_gate_result
  when: network_sensor_config_capture_enabled

- name: Back up packaged Suricata configuration once
  ansible.builtin.copy:
    src: "{{ network_sensor_config_suricata_file }}"
    dest: "{{ network_sensor_config_suricata_backup }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Select effective capture interface
  ansible.builtin.set_fact:
    network_sensor_config_effective_capture_interface: >-
      {{ network_sensor_config_capture_interface
         if network_sensor_config_capture_enabled
         else network_sensor_config_capture_sentinel }}

- name: Set Suricata HOME_NET to homelab LAN
  ansible.builtin.replace:
    path: "{{ network_sensor_config_suricata_file }}"
    regexp: '^    HOME_NET:.*$'
    replace: '    HOME_NET: "[{{ network_sensor_config_home_net }}]"'
  register: network_sensor_config_suricata_home_net_result

- name: Enable Suricata Community ID
  ansible.builtin.replace:
    path: "{{ network_sensor_config_suricata_file }}"
    regexp: '^      community-id:.*$'
    replace: '      community-id: true'
  register: network_sensor_config_suricata_community_result

- name: Set Suricata Community ID seed
  ansible.builtin.replace:
    path: "{{ network_sensor_config_suricata_file }}"
    regexp: '^      community-id-seed:.*$'
    replace: '      community-id-seed: {{ network_sensor_config_community_id_seed }}'
  register: network_sensor_config_suricata_seed_result

- name: Set Suricata AF_PACKET capture interface
  ansible.builtin.replace:
    path: "{{ network_sensor_config_suricata_file }}"
    regexp: '(^af-packet:\n[ \t]+- interface:[ \t]+)[^\n]+$'
    replace: '\1{{ network_sensor_config_effective_capture_interface }}'
  register: network_sensor_config_suricata_interface_result

- name: Verify managed Suricata settings are present
  ansible.builtin.shell: |
    set -euo pipefail
    grep -Fq 'HOME_NET: "[{{ network_sensor_config_home_net }}]"' '{{ network_sensor_config_suricata_file }}'
    grep -Fq 'community-id: true' '{{ network_sensor_config_suricata_file }}'
    grep -Fq 'community-id-seed: {{ network_sensor_config_community_id_seed }}' '{{ network_sensor_config_suricata_file }}'
    grep -Fq -- '- interface: {{ network_sensor_config_effective_capture_interface }}' '{{ network_sensor_config_suricata_file }}'
  args:
    executable: /bin/bash
  changed_when: false

- name: Install Emerging Threats Open rules once
  ansible.builtin.command:
    argv:
      - suricata-update
  args:
    creates: "{{ network_sensor_config_suricata_rules_file }}"
  register: network_sensor_config_suricata_update

- name: Validate Suricata configuration offline
  ansible.builtin.command:
    argv:
      - suricata
      - -T
      - -c
      - "{{ network_sensor_config_suricata_file }}"
  register: network_sensor_config_suricata_test
  changed_when: false
  failed_when: network_sensor_config_suricata_test.rc != 0

- name: Back up packaged ZeekControl configuration once
  ansible.builtin.copy:
    src: "{{ network_sensor_config_zeek_node_file }}"
    dest: "{{ network_sensor_config_zeek_node_file }}.before-homelab-phase1"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Back up packaged Zeek local policy once
  ansible.builtin.copy:
    src: "{{ network_sensor_config_zeek_local_file }}"
    dest: "{{ network_sensor_config_zeek_local_file }}.before-homelab-phase1"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Generate stable Zeek digest salt once
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    openssl rand -hex 32 > '{{ network_sensor_config_zeek_digest_salt_file }}'
  args:
    executable: /bin/bash
    creates: "{{ network_sensor_config_zeek_digest_salt_file }}"

- name: Read Zeek digest salt
  ansible.builtin.slurp:
    src: "{{ network_sensor_config_zeek_digest_salt_file }}"
  register: network_sensor_config_zeek_digest_salt_raw
  no_log: true

- name: Hold Zeek digest salt for policy rendering
  ansible.builtin.set_fact:
    network_sensor_config_zeek_digest_salt: >-
      {{ network_sensor_config_zeek_digest_salt_raw.content | b64decode | trim }}
  no_log: true

- name: Install ZeekControl node configuration
  ansible.builtin.template:
    src: node.cfg.j2
    dest: "{{ network_sensor_config_zeek_node_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Define Zeek local networks
  ansible.builtin.template:
    src: networks.cfg.j2
    dest: "{{ network_sensor_config_zeek_networks_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Install homelab Zeek policy
  ansible.builtin.template:
    src: homelab.zeek.j2
    dest: "{{ network_sensor_config_zeek_policy_file }}"
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Load managed homelab policy from local.zeek
  ansible.builtin.blockinfile:
    path: "{{ network_sensor_config_zeek_local_file }}"
    marker: '# {mark} HOMELAB MANAGED NETWORK SENSOR POLICY'
    block: |
      @load ./homelab

- name: Validate Zeek configuration without deployment
  ansible.builtin.command:
    argv:
      - /opt/zeek/bin/zeekctl
      - check
  register: network_sensor_config_zeek_check
  changed_when: false
  failed_when: network_sensor_config_zeek_check.rc != 0

- name: Verify Zeek capture interface configuration
  ansible.builtin.command:
    argv:
      - grep
      - -F
      - "interface={{ network_sensor_config_effective_capture_interface }}"
      - "{{ network_sensor_config_zeek_node_file }}"
  changed_when: false

- name: Verify Zeek JSON and Community ID policies
  ansible.builtin.shell: |
    set -euo pipefail
    grep -Fq '@load policy/tuning/json-logs' '{{ network_sensor_config_zeek_policy_file }}'
    grep -Fq '@load policy/protocols/conn/community-id-logging' '{{ network_sensor_config_zeek_policy_file }}'
    grep -Fq 'redef CommunityID::seed = {{ network_sensor_config_community_id_seed }};' '{{ network_sensor_config_zeek_policy_file }}'
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Restart Suricata when managed configuration changed
  ansible.builtin.systemd_service:
    name: suricata
    enabled: true
    state: restarted
  when:
    - network_sensor_config_capture_enabled
    - >-
      network_sensor_config_suricata_home_net_result.changed
      or network_sensor_config_suricata_community_result.changed
      or network_sensor_config_suricata_seed_result.changed
      or network_sensor_config_suricata_interface_result.changed
      or network_sensor_config_suricata_gate_result.changed
      or network_sensor_config_suricata_capture_dropin_result.changed
      or network_sensor_config_capture_gate_result.changed

- name: Ensure Suricata is enabled and running for active capture
  ansible.builtin.systemd_service:
    name: suricata
    enabled: true
    state: started
  when: network_sensor_config_capture_enabled

- name: Keep Suricata disabled and stopped in safe mode
  ansible.builtin.systemd_service:
    name: suricata
    enabled: false
    state: stopped
  when: not network_sensor_config_capture_enabled

- name: Keep Zeek stopped pending separate activation
  ansible.builtin.shell: |
    set -euo pipefail
    ! pgrep -x zeek >/dev/null
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify Suricata active-capture state
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl is-enabled suricata | grep -Fxq enabled
    systemctl is-active suricata | grep -Fxq active
    pgrep -x suricata >/dev/null
    grep -Fq -- '- interface: {{ network_sensor_config_capture_interface }}' '{{ network_sensor_config_suricata_file }}'
  args:
    executable: /bin/bash
  changed_when: false
  when: network_sensor_config_capture_enabled

- name: Verify no failed systemd units
  ansible.builtin.command:
    argv:
      - systemctl
      - --failed
      - --no-legend
      - --plain
  register: network_sensor_config_failed_units
  changed_when: false
  failed_when: network_sensor_config_failed_units.stdout | trim | length > 0
