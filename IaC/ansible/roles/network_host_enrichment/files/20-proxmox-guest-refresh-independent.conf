# Scoped monitor-01 replacement for the legacy mandatory guest-refresh gate.
# Retain the authorised single-owner discovery cutover condition.
# Do not add Requires= or After= against Proxmox refresh here.
# Trusted Proxmox guest mapping is independently validated in the worker
# (snapshot_optional), and is omitted when absent/stale/invalid.
[Unit]
ConditionPathExists=/etc/homelab-network-hosts/network-discovery-cutover-approved
