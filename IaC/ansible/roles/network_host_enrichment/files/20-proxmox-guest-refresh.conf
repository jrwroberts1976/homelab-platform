# Install ONLY as an inert monitor-01 enrichment service drop-in.
# Every subsequent enrichment start must first complete a fresh, trusted
# guest snapshot refresh. A refresh failure blocks enrichment.
[Unit]
ConditionPathExists=/etc/homelab-network-hosts/network-discovery-cutover-approved
Requires=homelab-proxmox-guest-refresh.service
After=homelab-proxmox-guest-refresh.service
