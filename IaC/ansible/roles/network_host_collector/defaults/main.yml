---
# Historical active owner is Proxmox-2 until the monitor-01 cutover is proven.
# Staging playbooks explicitly override these values, leaving old playbooks safe.
network_host_collector_expected_hostname: "Proxmox-2"
network_host_collector_expected_ipv4: "192.168.2.71"

network_host_collector_subnet: "192.168.2.0/24"
network_host_collector_interface: "vmbr0"

network_host_collector_script:
  "/usr/local/sbin/homelab-network-host-collector"

network_host_collector_state_dir:
  "/var/lib/homelab-network-hosts"

network_host_collector_inventory:
  "{{ network_host_collector_state_dir }}/inventory.json"

network_host_collector_events_dir:
  "/var/log/homelab-network-hosts"

network_host_collector_events:
  "{{ network_host_collector_events_dir }}/events.jsonl"

network_host_collector_textfile_dir:
  "/var/lib/prometheus/node-exporter"

network_host_collector_metrics:
  "{{ network_host_collector_textfile_dir }}/homelab_network_hosts.prom"

network_host_collector_service:
  "homelab-network-host-collector.service"

network_host_collector_timer:
  "homelab-network-host-collector.timer"

network_host_collector_interval: "5min"

network_host_collector_offline_after_seconds: 900

# Optional ASUS DHCP/ARP inventory. When present, its DHCP hostname is used
# only as a fallback when reverse DNS does not provide a hostname.
network_host_collector_router_hostname_snapshot:
  "/var/lib/homelab-network-hosts/router-hostnames.json"

network_host_collector_alert_enabled: true

network_host_collector_alert_script:
  "/usr/local/sbin/homelab-network-device-email-alert"

network_host_collector_alert_config_dir:
  "/etc/homelab-network-hosts"

network_host_collector_alert_environment:
  "{{ network_host_collector_alert_config_dir }}/alerts.env"

network_host_collector_alert_registry:
  "{{ network_host_collector_state_dir }}/alerted-macs.json"

network_host_collector_alert_smtp_host: "192.168.2.54"
network_host_collector_alert_smtp_port: 25
network_host_collector_alert_from: "homelab-network@jameshouse"

# Deployment and periodic scanning are deliberately separate gates.
network_host_collector_allow_deploy: false
network_host_collector_enable_timer: false
