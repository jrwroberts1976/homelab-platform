# Install only during explicitly approved Gate 3d activation.
# Prevent manual collector starts before a validated final protected sync.
[Unit]
ConditionPathExists=/etc/homelab-network-hosts/network-discovery-cutover-approved

[Service]
EnvironmentFile=/etc/homelab-network-hosts/alerts.env
ExecStartPre=/usr/local/sbin/homelab-network-firstseen-guard
ExecStartPost=-/usr/local/sbin/homelab-network-device-email-alert
