---
management_report_expected_hosts:
  - PROXMOX
  - Proxmox-2
  - admin-01
  - cloud-01
  - dns-01
  - dns-02
  - docker-01
  - edge-01
  - greenbone-01
  - komodo-01
  - mail-relay-01
  - media-01
  - monitor-01
  - sensor-01
  - zabbix-01
management_report_evidence_hours: 24

management_report_loki_url: "http://192.168.2.52:3100"
management_report_prometheus_url: "http://192.168.2.52:9090"
management_report_alertmanager_url: "http://192.168.2.52:9093"
management_report_zabbix_url: "http://192.168.2.59:8080/api_jsonrpc.php"

management_report_state_directory: "/var/lib/homelab-management-report"
management_report_output_directory: "/var/lib/homelab-management-report/reports"
management_report_evidence_file: "/var/lib/homelab-management-report/evidence.json"

management_report_patch_freshness_minutes: 90

# Factual network-inventory evidence from the sole active collector owner.
management_report_network_inventory_target: "monitor-01"
management_report_network_inventory_textfile: "/var/lib/prometheus/node-exporter/homelab_network_hosts.prom"
management_report_network_inventory_freshness_minutes: 15

management_report_zabbix_token_file: "/etc/homelab-management-report/zabbix-api-token"

# Active Zabbix Agent 2 host-availability evidence.
management_report_zabbix_agent_ping_freshness_seconds: 180

# Specialist evidence received from dedicated producer hosts.
management_report_evidence_sources_directory: "{{ management_report_state_directory }}/evidence-sources"

# Greenbone specialist evidence.
management_report_greenbone_evidence_file: "{{ management_report_evidence_sources_directory }}/greenbone-01/incoming/managed.json"
management_report_greenbone_freshness_hours: 30

# Passive network-security evidence from sensor-01.
management_report_sensor_evidence_file: "{{ management_report_evidence_sources_directory }}/sensor-01/incoming/evidence.json"
management_report_sensor_freshness_minutes: 45

management_report_evidence_producers:
  - name: sensor-01
    user: evidence-sensor
  - name: greenbone-01
    user: evidence-greenbone
    public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOpjrYAfyc3HKsbH70Pb6vJMEAqIaeffe5FbeljHheC3 greenbone-01 evidence transfer to monitor-01"

# Human-readable daily management report.
management_report_mail_host: "mail-relay-01"
management_report_mail_port: 25
management_report_mail_from: "management-report@jameshouse"
management_report_mail_to: "jrwroberts1976@gmail.com"

# Daily management-report automation.
management_report_enable_timer: true
management_report_schedule: "*-*-* 06:00:00"
management_report_randomized_delay_seconds: 0

# AI briefing approved 2026-09-23 after isolated live, fallback, and systemd tests.
# The factual report remains authoritative and is retained on AI failure.
management_report_ai_enabled: true
management_report_ai_model: "gpt-4.1-mini"
management_report_ai_key_file: "/etc/homelab-management-report/openai-api-key"
management_report_ai_output_file: "{{ management_report_output_directory }}/ai-latest.txt"
