---
media_firewall_expected_ipv4: "192.168.2.195"
media_firewall_lan_subnet: "192.168.2.0/24"

# qBittorrent Web UI LAN cutover approved after successful HTTPS login.
# Keep HTTPS 443 LAN-reachable. qBittorrent's port 8081 stays accessible only
# locally via the Nginx reverse proxy (lo is accepted earlier in nftables).
# A scoped rollback playbook may temporarily override HTTP back to true.
media_firewall_qbittorrent_https_lan_enabled: true
media_firewall_qbittorrent_http_lan_enabled: false
media_firewall_monitor_ipv4: "192.168.2.52"
media_firewall_dhcp_server_ipv4: "192.168.2.1"
media_firewall_backup_nfs_clients:
  - "192.168.2.70"
  - "192.168.2.71"
