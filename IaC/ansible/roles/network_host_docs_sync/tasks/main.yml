---
- name: Validate network host docs sync target
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.hostname == network_host_docs_sync_expected_hostname
      - network_host_docs_sync_repo_path | length > 0
      - network_host_docs_sync_sensor_host | length > 0
      - network_host_docs_sync_ai_host | length > 0
    fail_msg: >-
      Refusing host-doc sync deployment: target must be the expected monitoring host
      with an explicit repository path, sensor hostname and AI source.

- name: Prepare reusable GitHub repository access
  ansible.builtin.import_role:
    name: github_repo_access
  vars:
    github_repo_access_user: "{{ network_host_docs_sync_user }}"
    github_repo_access_group: "{{ network_host_docs_sync_group }}"
    github_repo_access_repo_url: "{{ network_host_docs_sync_repo_url }}"
    github_repo_access_repo_path: "{{ network_host_docs_sync_repo_path }}"
    github_repo_access_branch: "{{ network_host_docs_sync_git_branch }}"
    github_repo_access_remote: "{{ network_host_docs_sync_git_remote }}"
    github_repo_access_ssh_key: "{{ network_host_docs_sync_git_ssh_key }}"
    github_repo_access_ssh_key_comment: "{{ network_host_docs_sync_git_key_comment }}"
    github_repo_access_verify_push: true
    github_repo_access_git_user_name: "{{ network_host_docs_sync_git_user_name }}"
    github_repo_access_git_user_email: "{{ network_host_docs_sync_git_user_email }}"

- name: Verify required local evidence for docs publisher
  ansible.builtin.shell: |
    set -euo pipefail
    REPO='{{ network_host_docs_sync_repo_path }}'
    test -f "$REPO/docs/network/hosts/README.md"
    test "$(git -C "$REPO" branch --show-current)" = '{{ network_host_docs_sync_git_branch }}'
    test -z "$(git -C "$REPO" status --porcelain)"
    test -n "$(git -C "$REPO" config user.name)"
    test -n "$(git -C "$REPO" config user.email)"
    test -r '{{ network_host_docs_sync_ai_summary }}'
    test "$(head -c 1 '{{ network_host_docs_sync_ai_summary }}')" = "{"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ network_host_docs_sync_user }}"
  changed_when: false

- name: Validate optional Zeek flow summary when present
  ansible.builtin.shell: |
    set -euo pipefail
    FLOW='{{ network_host_docs_sync_flow_summary }}'
    if [ -e "$FLOW" ]; then
      test -r "$FLOW"
      test "$(head -c 1 "$FLOW")" = "{"
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ network_host_docs_sync_user }}"
  changed_when: false

- name: Install network host docs sync publisher
  ansible.builtin.template:
    src: homelab-network-host-docs-sync.py.j2
    dest: "{{ network_host_docs_sync_script }}"
    owner: root
    group: root
    mode: "0755"
  register: network_host_docs_sync_script_template

- name: Install network host docs sync service
  ansible.builtin.template:
    src: homelab-network-host-docs-sync.service.j2
    dest: "/etc/systemd/system/{{ network_host_docs_sync_service_name }}"
    owner: root
    group: root
    mode: "0644"
  register: network_host_docs_sync_service_template

- name: Install network host docs sync timer
  ansible.builtin.template:
    src: homelab-network-host-docs-sync.timer.j2
    dest: "/etc/systemd/system/{{ network_host_docs_sync_timer_name }}"
    owner: root
    group: root
    mode: "0644"
  register: network_host_docs_sync_timer_template

- name: Reload systemd for network host docs sync
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >-
    network_host_docs_sync_service_template.changed
    or network_host_docs_sync_timer_template.changed

- name: Run initial bounded host docs sync
  ansible.builtin.systemd_service:
    name: "{{ network_host_docs_sync_service_name }}"
    state: started
  when: network_host_docs_sync_run_initial | bool

- name: Enable hourly network host docs sync timer
  ansible.builtin.systemd_service:
    name: "{{ network_host_docs_sync_timer_name }}"
    enabled: true
    state: started
  when: network_host_docs_sync_enable_timer | bool

- name: Verify network host docs sync timer
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl is-enabled '{{ network_host_docs_sync_timer_name }}' | grep -Fxq enabled
    systemctl is-active '{{ network_host_docs_sync_timer_name }}' | grep -Fxq active
  args:
    executable: /bin/bash
  changed_when: false
  when: network_host_docs_sync_enable_timer | bool

- name: Verify managed docs sync units are not failed
  ansible.builtin.shell: |
    set -euo pipefail
    for unit in \
      '{{ network_host_docs_sync_service_name }}' \
      '{{ network_host_docs_sync_timer_name }}'; do
      state="$(systemctl is-failed "$unit" 2>/dev/null || true)"
      test "$state" != "failed"
    done
  args:
    executable: /bin/bash
  changed_when: false
