---
- name: Validate Komodo hypervisor identity for cloud-init snippet
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.hostname == komodo_cloud_init_expected_hypervisor_hostname
      - ansible_facts.default_ipv4.address == komodo_cloud_init_expected_hypervisor_ipv4
      - ansible_facts.default_ipv4.interface == "vmbr0"
      - komodo_cloud_init_public_key is match('^ssh-')
    fail_msg: >-
      Refusing to manage komodo-01 cloud-init: expected
      {{ komodo_cloud_init_expected_hypervisor_hostname }} at
      {{ komodo_cloud_init_expected_hypervisor_ipv4 }}/vmbr0 and a valid
      controller SSH public key.

- name: Ensure Proxmox snippets directory exists
  ansible.builtin.file:
    path: "{{ komodo_cloud_init_snippet_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install managed komodo-01 cloud-init snippet
  ansible.builtin.template:
    src: komodo-01-user-data.yaml.j2
    dest: "{{ komodo_cloud_init_snippet_dir }}/{{ komodo_cloud_init_snippet_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Verify Komodo cloud-init snippet is present
  ansible.builtin.stat:
    path: "{{ komodo_cloud_init_snippet_dir }}/{{ komodo_cloud_init_snippet_name }}"
  register: komodo_cloud_init_snippet_stat

- name: Require non-empty Komodo cloud-init snippet
  ansible.builtin.assert:
    that:
      - komodo_cloud_init_snippet_stat.stat.exists
      - komodo_cloud_init_snippet_stat.stat.isreg
      - komodo_cloud_init_snippet_stat.stat.size > 0
    fail_msg: komodo-01 cloud-init snippet was not installed correctly.
