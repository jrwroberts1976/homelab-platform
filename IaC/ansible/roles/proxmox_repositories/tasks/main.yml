---
- name: Check for Ceph enterprise repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/ceph.sources
  register: proxmox_ceph_repo

- name: Disable Ceph enterprise repository when present
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/ceph.sources
    regexp: '^Enabled:'
    line: 'Enabled: no'
    insertafter: EOF
  when: proxmox_ceph_repo.stat.exists

- name: Refresh APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Verify Ceph enterprise repository is disabled
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - '^Enabled:[[:space:]]*(no|false)[[:space:]]*$'
      - /etc/apt/sources.list.d/ceph.sources
  register: proxmox_ceph_disabled
  changed_when: false
  when:
    - proxmox_ceph_repo.stat.exists
    - not ansible_check_mode

- name: Confirm repository policy
  ansible.builtin.debug:
    msg: >-
      Ceph enterprise repository is absent or explicitly disabled;
      APT cache refresh succeeded.
