---
# Safety gate. Deployment must be explicitly approved at runtime.
zabbix_platform_allow_deploy: false

# Runtime secret contract:
#
# HOMELAB_ZABBIX_DB_PASSWORD must exist in the environment of the
# Ansible controller. No database password is stored in Git.
zabbix_server_db_password: >-
  {{
    lookup(
      'ansible.builtin.env',
      'HOMELAB_ZABBIX_DB_PASSWORD'
    )
  }}

zabbix_server_db_name: zabbix
zabbix_server_db_user: zabbix

postgresql_users:
  - name: zabbix
    password: "{{ zabbix_server_db_password }}"
    role_attr_flags: LOGIN

postgresql_databases:
  - name: zabbix
    owner: zabbix
    encoding: UTF8

timescaledb_databases:
  - zabbix

zabbix_timescaledb_database: zabbix

zabbix_server_nginx_listen: 8080
zabbix_server_nginx_server_name: _


# zabbix-01 monitors its local passive Agent 2 interface through
# 127.0.0.1 while retaining LAN access from the Zabbix server address.
zabbix_agent_server_passive: "127.0.0.1,192.168.2.59"

# Unprivileged Proxmox LXC systemd baseline.
# These standard mount units are not applicable to the approved
# zabbix-01 container runtime and previously produced failed units.
lxc_systemd_mount_baseline_units:
  - tmp.mount
  - run-lock.mount
  - dev-mqueue.mount
