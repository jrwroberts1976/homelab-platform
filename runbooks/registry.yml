---
schema_version: 1

registry:
  authority: runbooks/registry.yml
  purpose: >-
    Machine-readable index of operational runbooks, the systems and services
    they apply to, where they are normally executed from, and the IaC used to
    implement or recover them.
  default_controller:
    name: admin-01
    address: 192.168.2.48
    user: james
    repository_path: ~/projects/homelab-platform
  lifecycle_values:
    - active
    - planned
    - deprecated
    - retired
  service_state_values:
    - operational
    - implementation_in_progress
    - planned
    - blocked
    - maintenance_planned
    - retired
  excluded_active_hosts:
    - name: ids-01
      reason: decommissioned
    - name: TestServer
      reason: retired identity; physical Raspberry Pi 4 is now docker-01
    - name: DietPi
      reason: retired identity; physical Raspberry Pi 3 is now admin-01

runbooks:
  dns_service_recovery:
    title: DNS Service Recovery Plan
    category: network
    document_type: recovery_runbook
    document: "production docs/DNS-SERVICE-RECOVERY-PLAN.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: dns-01, address: 192.168.2.51, role: primary_dns_resolver}
        - {name: dns-02, address: 192.168.2.50, role: secondary_dns_resolver}
        - {name: PROXMOX, address: 192.168.2.70, role: dns-02_hypervisor}
        - {name: Proxmox-2, address: 192.168.2.71, role: dns-01_hypervisor}
        - {name: RT-AC86U, address: 192.168.2.1, role: dhcp_dns_advertisement}
      services: [pihole, unbound, dns, dhcp_dns_advertisement]
    run_from: {name: admin-01, address: 192.168.2.48}
    iac:
      scripts:
        - IaC/scripts/deploy-dns-resolver.sh
        - IaC/scripts/bootstrap-proxmox-node.sh
      playbooks:
        - IaC/ansible/playbooks/dns-resolver.yml
        - IaC/ansible/playbooks/dns-local-records.yml
      roles:
        - IaC/ansible/roles/dns_resolver/
      terraform:
        - IaC/terraform/proxmox/dns-resolver/
    triggers:
      - dns_resolution_failure
      - pihole_failure
      - unbound_failure
      - dns_lxc_loss
      - proxmox_node_loss_affecting_dns
      - iac_controller_recovery
    notes:
      - 192.168.2.48 is admin-01 and is not a DNS fallback
      - total DNS outage recovery may require a temporary known-good upstream resolver on admin-01
      - local-record parity was corrected and validated on 2026-09-12
      - full destructive DNS recovery validation was last completed on 2026-09-08
    last_validated: 2026-09-08

  router_syslog_service:
    title: ASUS Router Syslog Service
    category: network
    document_type: service_runbook
    document: "production docs/ROUTER-SYSLOG-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: RT-AC86U, address: 192.168.2.1, role: syslog_source}
        - {name: monitor-01, address: 192.168.2.52, role: syslog_receiver_and_loki_ingest}
      services: [rsyslog, logrotate, alloy, loki]
    run_from: {name: admin-01, address: 192.168.2.48}
    network:
      protocol: udp
      port: 5514
      source: 192.168.2.1
      destination: 192.168.2.52
    paths:
      - /var/log/homelab/router/rt-ac86u.log
    iac:
      scripts:
        - IaC/scripts/deploy-router-syslog-receiver.sh
      playbooks:
        - IaC/ansible/playbooks/router-syslog.yml
        - IaC/ansible/playbooks/monitor-router-alloy.yml
      roles:
        - IaC/ansible/roles/router_syslog_receiver/
        - IaC/ansible/roles/monitor_router_alloy/
    monitoring:
      loki_selector: '{job="network-infrastructure",service="router-syslog",device="rt-ac86u"}'
      local_file_retention: active
      alloy_loki_pipeline: operational
      openvpn_events_observed: proven_2026-09-16
    last_validated: 2026-09-16

  remote_access_vpn:
    title: ASUS Router OpenVPN Remote Access
    category: network_security
    document_type: implementation_runbook
    document: docs/network/VPN-REMOTE-ACCESS-DESIGN.md
    status: active
    service_state: implementation_in_progress
    applies_to:
      hosts:
        - {name: RT-AC86U, address: 192.168.2.1, role: openvpn_server}
        - {name: monitor-01, address: 192.168.2.52, role: vpn_log_ingest}
      services: [openvpn, router_syslog, alloy, loki]
    run_from: {name: admin-01, address: 192.168.2.48}
    network:
      transport: udp
      vpn_subnet: 10.8.0.0/24
      lan_route: 192.168.2.0/24
      dns_servers: [192.168.2.51, 192.168.2.50]
    monitoring:
      log_source: /var/log/homelab/router/rt-ac86u.log
      loki_selector: '{job="network-infrastructure",service="router-syslog",device="rt-ac86u"}'
    validation:
      server_running: proven_2026-09-16
      external_authentication: proven_2026-09-16
      external_tunnel_establishment: proven_2026-09-16
      internal_admin_access_from_external_client: pending
      internal_dns_over_vpn: pending
      ddns_endpoint: pending
      router_recovery_and_client_reenrolment: pending
    notes:
      - the former dedicated vpn-01 WireGuard design is superseded
      - no vpn-01 VMID or LAN address is allocated
      - client profiles, passwords and protected certificate material must remain outside Git
    last_validated: 2026-09-16

