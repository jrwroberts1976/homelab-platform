  proxmox_backup_recovery:
    title: Proxmox Guest Backup and Recovery
    category: backup
    document_type: recovery_runbook
    document: "production docs/PROXMOX-BACKUP-RECOVERY.md"
    status: active
    service_state: operational
    applies_to:
      cluster:
        name: jameshouse-pve
        qdevice_host: admin-01
      hosts:
        - {name: PROXMOX, address: 192.168.2.70, role: backup_source_hypervisor}
        - {name: Proxmox-2, address: 192.168.2.71, role: backup_source_hypervisor}
        - {name: media-01, address: 192.168.2.195, role: primary_nfs_backup_target}
        - {name: mail-relay-01, address: 192.168.2.54, role: backup_notification_relay}
      services: [vzdump, nfs, postfix, proxmox_notifications]
      storage:
        - id: media-backup-proxmox
          source_host: PROXMOX
          node_scope: PROXMOX
          server: 192.168.2.195
          export: /srv/backup/pve-proxmox
          protocol: nfs4
        - id: media-backup-proxmox-2
          source_host: Proxmox-2
          node_scope: Proxmox-2
          server: 192.168.2.195
          export: /srv/backup/pve-proxmox-2
          protocol: nfs4
        - id: media-backup
          state: legacy_rollback_preserved
          server: 192.168.2.195
          export: /srv/backup/pve
          protocol: nfs4
    run_from: {name: admin-01, address: 192.168.2.48}
    iac:
      playbooks:
        - IaC/ansible/playbooks/media-backup-target.yml
        - IaC/ansible/playbooks/media-backup-split-prep.yml
        - IaC/ansible/playbooks/proxmox-backup-storage.yml
        - IaC/ansible/playbooks/proxmox-backup-storage-split.yml
        - IaC/ansible/playbooks/proxmox-vzdump-runtime.yml
        - IaC/ansible/playbooks/proxmox-notification-recipient.yml
        - IaC/ansible/playbooks/proxmox-mail-relay-client.yml
        - IaC/ansible/playbooks/proxmox-backup-schedule.yml
      roles:
        - IaC/ansible/roles/media_backup_target/
        - IaC/ansible/roles/media_backup_split_prep/
        - IaC/ansible/roles/proxmox_backup_storage/
        - IaC/ansible/roles/proxmox_backup_storage_split/
        - IaC/ansible/roles/proxmox_vzdump_runtime/
        - IaC/ansible/roles/proxmox_notification_recipient/
        - IaC/ansible/roles/proxmox_mail_relay_client/
        - IaC/ansible/roles/proxmox_backup_schedule/
    schedule_policy:
      PROXMOX:
        job_id: homelab-nightly-proxmox
        schedule: "02:15"
        storage: media-backup-proxmox
        guests: [100, 102, 200, 201]
      Proxmox-2:
        job_id: homelab-nightly-proxmox-2
        schedule: "03:15"
        storage: media-backup-proxmox-2
        guests: [101, 103, 202, 203]
      mode: snapshot
      compression: zstd
      keep_last: 3
      post_cluster_live_validation: vm203_unattended_cycle_pending
    validation:
      nfs_write_read_delete: proven_both_hypervisors_precluster
      node_scoped_storage_after_cluster_join: proven_2026-09-14
      all_seven_guest_backups: proven_precluster_2026-09-14
      unprivileged_lxc_backup: proven_ct103_2026-09-14
      archive_integrity: proven_precluster
      isolated_lxc_restore_boot: proven_ct103_2026-09-14
      notification_delivery: proven_both_hypervisors_2026-09-14
      old_standalone_schedule_policy: proven_2026-09-14
      final_cluster_schedule_iac_reconciliation: proven_2026-09-16
      fresh_vm202_backup: proven_2026-09-16
      first_unattended_run_including_vm203: pending
      qemu_restore: pending
      application_consistent_cloud_restore: pending
    notes:
      - monitor-01 is VM202; the former Proxmox-2 VM200 identity is historical
      - retained precluster LVs on Proxmox-2 are rollback evidence and are not active guest disks
      - cluster quorum does not make node-local local-lvm guest disks highly available
    last_validated: 2026-09-16

