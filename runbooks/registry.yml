---
schema_version: 1

registry:
  authority: runbooks/registry.yml
  purpose: >-
    Machine-readable index of operational runbooks, the systems and services
    they apply to, where they are normally executed from, and the IaC used to
    implement or recover them.
  default_controller:
    name: admin-01
    address: 192.168.2.48
    user: james
    repository_path: ~/projects/homelab-platform
  lifecycle_values:
    - active
    - planned
    - deprecated
    - retired
  service_state_values:
    - operational
    - implementation_in_progress
    - planned
    - blocked
    - maintenance_planned
    - retired
  excluded_active_hosts:
    - name: ids-01
      reason: decommissioned
    - name: TestServer
      reason: retired identity; physical Raspberry Pi 4 is now docker-01
    - name: DietPi
      reason: retired identity; physical Raspberry Pi 3 is now admin-01
    - name: k3s-node-01
      reason: retired identity; physical Raspberry Pi 5 is now media-01

runbooks:
  dns_service_recovery:
    title: DNS Service Recovery Plan
    category: network
    document_type: recovery_runbook
    document: "production docs/DNS-SERVICE-RECOVERY-PLAN.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: dns-01, address: 192.168.2.51, role: primary_dns_resolver}
        - {name: dns-02, address: 192.168.2.50, role: secondary_dns_resolver}
        - {name: PROXMOX, address: 192.168.2.70, role: dns-02_hypervisor}
        - {name: Proxmox-2, address: 192.168.2.71, role: dns-01_hypervisor}
        - {name: RT-AC86U, address: 192.168.2.1, role: dhcp_dns_advertisement}
      services: [pihole, unbound, dns, dhcp_dns_advertisement]
    run_from: {name: admin-01, address: 192.168.2.48}
    iac:
      scripts:
        - IaC/scripts/deploy-dns-resolver.sh
        - IaC/scripts/bootstrap-proxmox-node.sh
      playbooks:
        - IaC/ansible/playbooks/dns-resolver.yml
        - IaC/ansible/playbooks/dns-local-records.yml
      roles:
        - IaC/ansible/roles/dns_resolver/
      terraform:
        - IaC/terraform/proxmox/dns-resolver/
    validation:
      resolver_pair: proven
      cross_resolver_local_records: reconciled_in_current_iac
    notes:
      - 192.168.2.48 is admin-01 and is not a DNS fallback
      - full destructive DNS recovery validation was last completed on 2026-09-08
    last_validated: 2026-09-08

  router_syslog_service:
    title: ASUS Router Syslog Service
    category: network
    document_type: service_runbook
    document: "production docs/ROUTER-SYSLOG-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: RT-AC86U, address: 192.168.2.1, role: syslog_source}
        - {name: monitor-01, address: 192.168.2.52, role: syslog_receiver_and_loki_ingest}
      services: [rsyslog, logrotate, alloy, loki]
    run_from: {name: admin-01, address: 192.168.2.48}
    network:
      protocol: udp
      port: 5514
      source: 192.168.2.1
      destination: 192.168.2.52
    paths:
      - /var/log/homelab/router/rt-ac86u.log
    iac:
      playbooks:
        - IaC/ansible/playbooks/router-syslog.yml
        - IaC/ansible/playbooks/monitor-router-alloy.yml
    last_validated: 2026-09-16

  remote_access_vpn:
    title: ASUS Router OpenVPN Remote Access
    category: network_security
    document_type: implementation_runbook
    document: docs/network/VPN-REMOTE-ACCESS-DESIGN.md
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: RT-AC86U, address: 192.168.2.1, role: openvpn_server}
        - {name: monitor-01, address: 192.168.2.52, role: vpn_log_ingest}
      services: [openvpn, router_syslog, alloy, loki]
    run_from: {name: admin-01, address: 192.168.2.48}
    network:
      transport: udp
      vpn_subnet: 10.8.0.0/24
      lan_route: 192.168.2.0/24
      dns_servers: [192.168.2.51, 192.168.2.50]
    validation:
      server_running: proven_2026-09-16
      external_authentication: proven_2026-09-16
      external_tunnel_establishment: proven_2026-09-16
      external_laptop_lan_access: proven_2026-09-18
      split_tunnel_internet: proven_2026-09-18
      production_acceptance: proven_2026-09-18
      ddns_recovery_check: maintenance_follow_up
      router_recovery_and_client_reenrolment: maintenance_follow_up
    notes:
      - the former dedicated vpn-01 WireGuard design is superseded
      - no vpn-01 VMID or LAN address is allocated
      - client profiles, passwords and protected certificate material remain outside Git
    last_validated: 2026-09-18

  monitoring_service:
    title: Homelab Monitoring Service
    category: monitoring
    document_type: service_runbook
    document: "production docs/MONITORING-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: monitor-01, address: 192.168.2.52, role: monitoring_and_discovery_platform}
        - {name: Proxmox-2, address: 192.168.2.71, role: monitoring_hypervisor_and_former_discovery_source}
      monitored_targets:
        - {name: admin-01, address: 192.168.2.48}
        - {name: dns-02, address: 192.168.2.50}
        - {name: dns-01, address: 192.168.2.51}
        - {name: monitor-01, address: 192.168.2.52}
        - {name: cloud-01, address: 192.168.2.53}
        - {name: mail-relay-01, address: 192.168.2.54}
        - {name: sensor-01, address: 192.168.2.55}
        - {name: edge-01, address: 192.168.2.56}
        - {name: greenbone-01, address: 192.168.2.57}
        - {name: komodo-01, address: 192.168.2.58}
        - {name: zabbix-01, address: 192.168.2.59}
        - {name: PROXMOX, address: 192.168.2.70}
        - {name: Proxmox-2, address: 192.168.2.71}
        - {name: media-01, address: 192.168.2.195}
        - {name: docker-01, address: 192.168.2.220}
      services: [prometheus, grafana, alertmanager, blackbox_exporter, loki, alloy]
    run_from: {name: admin-01, address: 192.168.2.48}
    iac:
      playbooks:
        - IaC/ansible/playbooks/monitoring.yml
        - IaC/ansible/playbooks/node-exporters.yml
      roles:
        - IaC/ansible/roles/monitoring_stack/
        - IaC/ansible/roles/node_exporter/
    validation:
      prometheus: operational
      grafana: operational
      alertmanager: operational
      blackbox_exporter: operational
      loki: operational
      network_discovery_owner: monitor-01_since_2026-09-27
      grafana_step_10: complete_2026-10-05
      patch_telemetry: 15_reporting_0_pending_0_security_0_reboot_15_unattended_0_auto_reboot
      ansible_idempotence: changed_0_failed_0_unreachable_0
    last_validated: 2026-10-05

  network_sensor_service:
    title: Homelab Network Sensor Service
    category: security
    document_type: service_runbook
    document: "production docs/NETWORK-SENSOR-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: sensor-01, address: 192.168.2.55, role: passive_network_sensor}
        - {name: PROXMOX, address: 192.168.2.70, role: sensor_hypervisor}
      infrastructure:
        - {name: HP ProCurve port 24, role: active_span_destination}
      services: [suricata, zeek, node_exporter, alloy]
    run_from: {name: admin-01, address: 192.168.2.48}
    validation:
      capture_path: operational
      switch_mirroring: active_ports_1_23_to_24
    last_validated: 2026-09-14

  greenbone_service:
    title: Greenbone Vulnerability Scanner Service
    category: security
    document_type: service_runbook
    document: "production docs/GREENBONE-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: greenbone-01, address: 192.168.2.57, role: vulnerability_scanner}
        - {name: Proxmox-2, address: 192.168.2.71, role: scanner_hypervisor}
        - {name: monitor-01, address: 192.168.2.52, role: evidence_consumer}
      services: [greenbone, docker, node_exporter, alloy]
    run_from: {name: admin-01, address: 192.168.2.48}
    validation:
      managed_scan: operational
      evidence_publish: operational
      management_report_integration: operational
      vm203_unattended_backup: observed_2026-09-17
    last_validated: 2026-09-20

  time_service:
    title: Homelab Time Service
    category: core_infrastructure
    document_type: service_runbook
    document: "production docs/TIME-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: PROXMOX, address: 192.168.2.70, role: ntp-01}
        - {name: Proxmox-2, address: 192.168.2.71, role: ntp-02}
      network_scope: 192.168.2.0/24
      services: [chrony, ntp]
    run_from: {name: admin-01, address: 192.168.2.48}
    network: {protocol: udp, port: 123}
    last_validated: 2026-09-12

  media_service:
    title: media-01 Production Service
    category: media
    document_type: service_runbook
    document: "production docs/MEDIA-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: media-01, address: 192.168.2.195, role: kodi_and_primary_pve_backup_target}
      services: [kodi, samba, nfs, chrony, node_exporter, alloy]
    run_from: {name: admin-01, address: 192.168.2.48}
    last_validated: 2026-09-14

  cloud_service:
    title: Homelab Cloud Data Service
    category: cloud
    document_type: service_runbook
    document: "production docs/CLOUD-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: cloud-01, address: 192.168.2.53, role: nextcloud_service}
        - {name: PROXMOX, address: 192.168.2.70, role: cloud_hypervisor}
      services: [nextcloud, postgresql, redis, cron]
    run_from: {name: admin-01, address: 192.168.2.48}
    current_state:
      data_disk: 200_GiB_dedicated_VM_disk
      data_mount: /srv/cloud-01-data
      application_port: 8080
      external_cloudflare_access: not_deployed
      vm_snapshot_backup: proven
      application_consistent_recovery: pending
    last_validated: 2026-09-14

  mail_relay_service:
    title: Homelab Mail Relay Service
    category: core_infrastructure
    document_type: service_runbook
    document: "production docs/MAIL-RELAY-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: mail-relay-01, address: 192.168.2.54, role: smtp_relay}
        - {name: PROXMOX, address: 192.168.2.70, role: smtp_client}
        - {name: Proxmox-2, address: 192.168.2.71, role: smtp_client}
      services: [postfix, smtp, node_exporter, alloy]
    run_from: {name: admin-01, address: 192.168.2.48}
    network:
      internal_smtp_port: 25
      upstream_relay: smtp.gmail.com:587
      upstream_tls: required
    last_validated: 2026-09-14

  proxmox_backup_recovery:
    title: Proxmox Guest Backup and Recovery
    category: backup
    document_type: recovery_runbook
    document: "production docs/PROXMOX-BACKUP-RECOVERY.md"
    status: active
    service_state: operational
    applies_to:
      cluster:
        name: jameshouse-pve
        qdevice_host: admin-01
      hosts:
        - {name: PROXMOX, address: 192.168.2.70, role: backup_source_hypervisor}
        - {name: Proxmox-2, address: 192.168.2.71, role: backup_source_hypervisor}
        - {name: media-01, address: 192.168.2.195, role: primary_nfs_backup_target}
        - {name: mail-relay-01, address: 192.168.2.54, role: backup_notification_relay}
      services: [vzdump, nfs, postfix, proxmox_notifications]
    run_from: {name: admin-01, address: 192.168.2.48}
    schedule_policy:
      PROXMOX:
        job_id: homelab-nightly-proxmox
        schedule: "02:15"
        storage: media-backup-proxmox
        guests: [100, 102, 104, 105, 200, 201, 204]
      Proxmox-2:
        job_id: homelab-nightly-proxmox-2
        schedule: "03:15"
        storage: media-backup-proxmox-2
        guests: [101, 103, 202, 203]
      mode: snapshot
      compression: zstd
      keep_last: 3
    validation:
      isolated_lxc_restore_boot: proven_ct103_2026-09-14
      unattended_ct105: observed_2026-09-17
      unattended_vm203: observed_2026-09-17
      unattended_ct104: evidence_gap
      unattended_vm204: evidence_gap
      qemu_restore: pending
      application_consistent_cloud_restore: pending
    last_validated: 2026-09-17

  birdnet_service:
    title: BirdNET-Go Production Service
    category: application
    document_type: service_runbook
    document: "production docs/BIRDNET-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: docker-01, address: 192.168.2.220, role: birdnet_docker_host}
      services: [docker, birdnet-go, node_exporter, alloy]
    run_from: {name: admin-01, address: 192.168.2.48}
    monitoring:
      icmp: active
      node_exporter: active
      komodo_periphery: commissioned
    last_validated: 2026-09-12

  home_automation:
    title: Home Automation / Home Assistant
    category: application
    document_type: implementation_runbook
    document: docs/architecture/HOME-AUTOMATION-DESIGN.md
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: home-01, address: 192.168.2.60, role: home_assistant_os_vm}
        - {name: PROXMOX, address: 192.168.2.70, role: home_assistant_hypervisor}
      services: [home_assistant_os, home_assistant_core, supervisor]
    run_from: {name: admin-01, address: 192.168.2.48}
    validation:
      application_reachable: proven_2026-09-17
      dns_both_resolvers: proven_2026-09-17
      native_backup: proven
      manual_proxmox_backup_integrity: proven
      nightly_schedule_member: true
      external_monitoring: pending
      deeper_restore: pending
    last_validated: 2026-09-17

  cloudflare_pages_production:
    title: Cloudflare Pages Production Deployment Pipeline
    category: public_web
    document_type: deployment_runbook
    document: "production docs/CLOUDFLARE-PAGES-PRODUCTION-PIPELINE.md"
    status: active
    service_state: operational
    applies_to:
      repositories:
        - jrwroberts1976/engineering-portfolio
      external_services:
        - cloudflare_pages
        - github_actions
      endpoints:
        - me.jrwroberts.co.uk
    run_from:
      type: github_actions_or_admin_workstation

  router_clean_rebuild:
    title: Router Clean-Rebuild Plan
    category: network
    document_type: maintenance_runbook
    document: docs/network/ROUTER-RESET-PLAN.md
    status: planned
    service_state: maintenance_planned
    applies_to:
      hosts:
        - {name: RT-AC86U, address: 192.168.2.1, role: primary_router}
        - {name: AiMesh-node-1, address: 192.168.2.181, role: aimesh_node}
        - {name: AiMesh-node-2, address: 192.168.2.218, role: aimesh_node}
      services: [wan, lan, dhcp, wifi, aimesh, qos, firewall, openvpn, ddns, syslog_forwarding]
    run_from:
      type: local_wired_admin_session

coverage_gaps:
  backup_unattended_evidence:
    priority: medium
    category: backup
    applies_to:
      - {name: komodo-01, address: 192.168.2.58, vmid: 104}
      - {name: home-01, address: 192.168.2.60, vmid: 204}
    reason: >-
      Current evidence explicitly proves unattended CT105 and VM203. Retain CT104/VM204
      as evidence gaps only until their successful scheduled runs are explicitly recorded.

  backup_secondary_copy:
    priority: high
    category: backup
    applies_to:
      - {name: media-01, address: 192.168.2.195}
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: primary guest backup is proven but important data lacks an independent failure-domain copy

  application_backup_recovery:
    priority: high
    category: backup
    applies_to:
      - {name: cloud-01, address: 192.168.2.53}
      - {name: docker-01, address: 192.168.2.220}
      - {name: media-01, address: 192.168.2.195}
      - {name: admin-01, address: 192.168.2.48}
    reason: QEMU restore and application/non-Proxmox recovery are not proven estate-wide

  proxmox_cluster_resilience:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
      - {name: admin-01, address: 192.168.2.48, role: qnetd}
    reason: deliberate link0 failover and controlled single-node quorum behaviour remain untested

  proxmox_node_health:
    priority: medium
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated node-health/service-recovery runbook exists yet

  proxmox_storage_health:
    priority: medium
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated SMART/disk/Proxmox-storage recovery runbook exists yet

  edge_cloudflare_tunnel:
    priority: low
    category: edge
    applies_to:
      - {name: edge-01, address: 192.168.2.56}
    reason: cloudflared is intentionally not deployed; implement only when a real service requirement is approved

  mail_relay_recovery_testing:
    priority: medium
    category: core_infrastructure
    applies_to:
      - {name: mail-relay-01, address: 192.168.2.54}
    reason: service/client delivery are operational but full destructive rebuild/credential recovery is not proven

  komodo_hardening:
    priority: medium
    category: container_management
    applies_to:
      - {name: komodo-01, address: 192.168.2.58}
    reason: HTTPS and low-risk update/rollback ownership proof remain open

  runbook_coverage:
    priority: medium
    category: documentation
    applies_to:
      - {name: komodo-01, address: 192.168.2.58}
      - {name: zabbix-01, address: 192.168.2.59}
    reason: dedicated operational service runbooks should be added if existing architecture/IaC documentation is insufficient
