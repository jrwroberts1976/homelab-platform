---
schema_version: 1

registry:
  authority: runbooks/registry.yml
  purpose: >-
    Machine-readable index of operational runbooks, the systems and services
    they apply to, where they are normally executed from, and the IaC used to
    implement or recover them.
  default_controller:
    name: admin-01
    address: 192.168.2.48
    user: james
    repository_path: ~/projects/homelab-platform
  lifecycle_values:
    - active
    - planned
    - deprecated
    - retired
  service_state_values:
    - operational
    - implementation_in_progress
    - planned
    - blocked
    - maintenance_planned
    - retired
  excluded_active_hosts:
    - name: ids-01
      former_address: 192.168.2.242
      reason: decommissioned

runbooks:
  admin_control_plane:
    title: Homelab Administration Control Plane
    category: core_infrastructure
    document_type: architecture_runbook
    document: docs/architecture/CURRENT-STATE.md
    status: active
    service_state: operational
    applies_to:
      hosts:
        - name: admin-01
          address: 192.168.2.48
          role: administration_and_iac_controller
      services:
        - ssh
        - git
        - ansible
        - sops
        - age
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      inventory:
        - IaC/ansible/inventory/hosts.yml
    validation:
      - estate_ssh_reachability
      - git_repository_access
      - ansible_inventory_parse
      - ansible_ping_managed_hosts
    last_validated: 2026-09-10

  dns_service_recovery:
    title: DNS Service Recovery Plan
    category: network
    document_type: recovery_runbook
    document: "production docs/DNS-SERVICE-RECOVERY-PLAN.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - name: dns-01
          address: 192.168.2.51
          role: primary_dns_resolver
          placement: CT101_on_Proxmox-2
        - name: dns-02
          address: 192.168.2.50
          role: secondary_dns_resolver
          placement: CT100_on_PROXMOX
        - name: PROXMOX
          address: 192.168.2.70
          role: dns-02_hypervisor
        - name: Proxmox-2
          address: 192.168.2.71
          role: dns-01_hypervisor
        - name: RT-AC86U
          address: 192.168.2.1
          role: dhcp_dns_advertisement
      services:
        - pihole
        - unbound
        - dns
        - dhcp_dns_advertisement
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      playbooks:
        - IaC/ansible/playbooks/dns-resolver.yml
        - IaC/ansible/playbooks/dns-local-records.yml
      roles:
        - IaC/ansible/roles/dns_resolver/
    triggers:
      - dns_resolution_failure
      - pihole_failure
      - unbound_failure
      - dns_lxc_loss
      - proxmox_node_loss_affecting_dns
    validation:
      - both_resolvers_answer_udp_and_tcp_dns
      - local_records_match_managed_state
      - dnssec_validation_behaviour
    last_validated: 2026-09-10

  router_syslog_service:
    title: ASUS Router Syslog Service
    category: network
    document_type: service_runbook
    document: "production docs/ROUTER-SYSLOG-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - name: RT-AC86U
          address: 192.168.2.1
          role: syslog_source
        - name: monitor-01
          address: 192.168.2.52
          role: syslog_receiver
      services:
        - rsyslog
        - logrotate
    run_from:
      name: admin-01
      address: 192.168.2.48
    network:
      protocol: udp
      port: 5514
      source: 192.168.2.1
      destination: 192.168.2.52
    paths:
      - /var/log/homelab/router/rt-ac86u.log
    iac:
      scripts:
        - IaC/scripts/deploy-router-syslog-receiver.sh
      playbooks:
        - IaC/ansible/playbooks/router-syslog.yml
      roles:
        - IaC/ansible/roles/router_syslog_receiver/
    monitoring:
      future_loki_selector: '{job="router_syslog",device="rt-ac86u"}'
      logging_pipeline_state: pending_alloy_loki_integration
    triggers:
      - router_logs_missing
      - udp_5514_not_listening
      - router_packets_not_arriving
      - router_log_file_not_updating
    validation:
      - packet_capture_confirms_router_udp_5514
      - dedicated_log_receives_real_router_events
    last_validated: 2026-09-10

  monitoring_service:
    title: Homelab Monitoring Service
    category: monitoring
    document_type: service_runbook
    document: "production docs/MONITORING-SERVICE.md"
    status: active
    service_state: implementation_in_progress
    applies_to:
      hosts:
        - name: monitor-01
          address: 192.168.2.52
          role: monitoring_platform
          placement: VM200_on_Proxmox-2
        - name: Proxmox-2
          address: 192.168.2.71
          role: monitoring_hypervisor
      monitored_targets:
        - {name: RT-AC86U, address: 192.168.2.1}
        - {name: dns-02, address: 192.168.2.50}
        - {name: dns-01, address: 192.168.2.51}
        - {name: monitor-01, address: 192.168.2.52}
        - {name: cloud-01, address: 192.168.2.53}
        - {name: mail-relay-01, address: 192.168.2.54}
        - {name: sensor-01, address: 192.168.2.55}
        - {name: edge-01, address: 192.168.2.56, state: monitoring_pending}
        - {name: PROXMOX, address: 192.168.2.70}
        - {name: Proxmox-2, address: 192.168.2.71}
        - {name: media-01, address: 192.168.2.195}
        - {name: TestServer, address: 192.168.2.220, state: retirement_target}
      services:
        - prometheus
        - grafana
        - alertmanager
        - blackbox_exporter
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      playbooks:
        - IaC/ansible/playbooks/monitoring.yml
      roles:
        - IaC/ansible/roles/monitoring_stack/
      terraform:
        - IaC/terraform/proxmox/monitor-01/
    triggers:
      - monitoring_platform_failure
      - prometheus_unavailable
      - grafana_unavailable
      - alertmanager_unavailable
      - blackbox_probe_failure
    validation:
      - prometheus_targets_up
      - blackbox_probes_successful
      - grafana_prometheus_datasource_healthy
    last_validated: 2026-09-10

  central_logging_service:
    title: Central Logging Service
    category: logging
    document_type: service_runbook
    document: "production docs/CENTRAL-LOGGING-SERVICE.md"
    status: active
    service_state: planned
    applies_to:
      hosts:
        - name: monitor-01
          address: 192.168.2.52
          role: loki_platform
      initial_sources:
        - name: RT-AC86U
          source_path: /var/log/homelab/router/rt-ac86u.log
        - name: edge-01
          address: 192.168.2.56
          state: after_cloudflared_deployment
      services:
        - alloy
        - loki
        - grafana
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      roles:
        - IaC/ansible/roles/monitoring_stack/
    triggers:
      - log_ingestion_missing
      - alloy_failure
      - loki_failure
      - logging_storage_pressure

  edge_service:
    title: Cloudflare Edge Service
    category: edge_access
    document_type: service_runbook
    document: "production docs/EDGE-SERVICE.md"
    status: active
    service_state: implementation_in_progress
    applies_to:
      hosts:
        - name: edge-01
          address: 192.168.2.56
          role: cloudflare_tunnel_connector
          placement: CT103_on_Proxmox-2
        - name: Proxmox-2
          address: 192.168.2.71
          role: edge_hypervisor
      external_services:
        - cloudflare_zero_trust
        - cloudflare_tunnel
        - cloudflare_access
      services:
        - cloudflared
    run_from:
      name: admin-01
      address: 192.168.2.48
    network:
      ingress_model: outbound_tunnel_only
      router_port_forward_required: false
      validated_outbound:
        - https_443
        - cloudflare_tunnel_7844
    security:
      lxc_unprivileged: true
      lxc_nesting: true
      tmp_cap_mib: 192
      interactive_access_policy: cloudflare_access_mfa
      machine_access_policy: service_auth
    iac:
      inventory:
        - IaC/ansible/inventory/hosts.yml
      dns:
        - IaC/ansible/roles/dns_resolver/defaults/main.yml
    triggers:
      - cloudflared_failure
      - tunnel_disconnected
      - access_policy_failure
      - published_origin_unreachable
    validation:
      - base_host_systemd_running_zero_failed_units
      - ssh_fingerprint_verified
      - outbound_cloudflare_connectivity
      - dns_record_on_both_resolvers
    last_validated: 2026-09-10

  network_sensor_service:
    title: Homelab Network Sensor Service
    category: security
    document_type: service_runbook
    document: "production docs/NETWORK-SENSOR-SERVICE.md"
    status: active
    service_state: implementation_in_progress
    applies_to:
      hosts:
        - name: sensor-01
          address: 192.168.2.55
          role: passive_network_sensor
          placement: VM201_on_PROXMOX
        - name: PROXMOX
          address: 192.168.2.70
          role: sensor_hypervisor
      infrastructure:
        - name: HP ProCurve port 24
          role: span_destination
      services:
        - suricata
        - zeek
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      playbooks:
        - IaC/ansible/playbooks/network-sensor.yml
        - IaC/ansible/playbooks/network-sensor-config.yml
      roles:
        - IaC/ansible/roles/network_sensor/
        - IaC/ansible/roles/network_sensor_config/
      terraform:
        - IaC/terraform/proxmox/sensor-01/
    triggers:
      - sensor_build_or_rebuild
      - capture_interface_validation
      - suricata_failure
      - zeek_failure
      - span_capture_failure

  time_service:
    title: Homelab Time Service
    category: core_infrastructure
    document_type: service_runbook
    document: "production docs/TIME-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - name: PROXMOX
          address: 192.168.2.70
          role: ntp-01
        - name: Proxmox-2
          address: 192.168.2.71
          role: ntp-02
      network_scope: 192.168.2.0/24
      services:
        - chrony
        - ntp
    run_from:
      name: admin-01
      address: 192.168.2.48
    network:
      protocol: udp
      port: 123
    iac:
      playbooks:
        - IaC/ansible/playbooks/proxmox-time.yml
      roles:
        - IaC/ansible/roles/chrony_server/
    triggers:
      - clock_drift
      - chrony_failure
      - ntp_unreachable

  media_service:
    title: media-01 Production Service
    category: media
    document_type: service_runbook
    document: "production docs/MEDIA-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - name: media-01
          address: 192.168.2.195
          hardware: Raspberry_Pi_5
          role: kodi_media_endpoint
      services:
        - kodi
        - samba
        - node_exporter
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      playbooks:
        - IaC/ansible/playbooks/media-01.yml
        - IaC/ansible/playbooks/media-01-preflight.yml
      roles:
        - IaC/ansible/roles/media_endpoint/
        - IaC/ansible/roles/media_smb/
        - IaC/ansible/roles/media_firewall/
    triggers:
      - kodi_failure
      - media_share_failure
      - media_host_rebuild

  cloud_service:
    title: Homelab Cloud Data Service
    category: cloud
    document_type: service_runbook
    document: "production docs/CLOUD-SERVICE.md"
    status: active
    service_state: blocked
    applies_to:
      hosts:
        - name: cloud-01
          address: 192.168.2.53
          role: nextcloud_service
          placement: VM200_on_PROXMOX
        - name: PROXMOX
          address: 192.168.2.70
          role: cloud_hypervisor
      services:
        - nextcloud
        - postgresql
        - redis
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      playbooks:
        - IaC/ansible/playbooks/cloud-01.yml
        - IaC/ansible/playbooks/cloud-stack.yml
      roles:
        - IaC/ansible/roles/cloud_baseline/
        - IaC/ansible/roles/cloud_stack/
      terraform:
        - IaC/terraform/proxmox/cloud-01/
    blockers:
      - production_data_disk_validation
      - independent_backup_required_for_important_data
    triggers:
      - cloud_build_or_rebuild
      - nextcloud_failure
      - database_failure
      - persistent_data_recovery

  cloudflare_pages_production:
    title: Cloudflare Pages Production Deployment Pipeline
    category: public_web
    document_type: deployment_runbook
    document: "production docs/CLOUDFLARE-PAGES-PRODUCTION-PIPELINE.md"
    status: active
    service_state: operational
    applies_to:
      repositories:
        - jrwroberts1976/engineering-portfolio
      external_services:
        - cloudflare_pages
        - github_actions
      endpoints:
        - me.jrwroberts.co.uk
    run_from:
      type: github_actions_or_admin_workstation
    triggers:
      - production_site_deployment
      - cloudflare_pages_failure
      - deployment_pipeline_failure
      - manual_production_fallback
    last_validated: 2026-09-07

  testserver_retirement:
    title: TestServer Retirement Plan
    category: migration
    document_type: migration_runbook
    document: docs/migrations/TESTSERVER-RETIREMENT.md
    status: active
    service_state: implementation_in_progress
    applies_to:
      hosts:
        - name: TestServer
          address: 192.168.2.220
          hardware: Raspberry_Pi_4
          role: legacy_migration_source
      target_role:
        name: birdnet-01
        role: garden_birdnet_go_host
    run_from:
      name: admin-01
      address: 192.168.2.48
    blockers:
      - homelab_backup_testserver_recovery_gate
      - remaining_external_access_dependencies
      - remaining_ci_and_container_dependencies
    triggers:
      - legacy_workload_retirement
      - testserver_reimage
      - birdnet_host_rebuild
    last_validated: 2026-09-10

  router_clean_rebuild:
    title: Router Clean-Rebuild Plan
    category: network
    document_type: maintenance_runbook
    document: docs/network/ROUTER-RESET-PLAN.md
    status: planned
    service_state: maintenance_planned
    applies_to:
      hosts:
        - name: RT-AC86U
          address: 192.168.2.1
          role: primary_router
        - name: AiMesh-node-1
          address: 192.168.2.181
          role: aimesh_node
        - name: AiMesh-node-2
          address: 192.168.2.218
          role: aimesh_node
      services:
        - wan
        - lan
        - dhcp
        - wifi
        - aimesh
        - qos
        - firewall
        - syslog_forwarding
    run_from:
      type: local_wired_admin_session
    triggers:
      - planned_factory_reset
      - clean_router_rebuild
      - router_configuration_drift_removal

coverage_gaps:
  proxmox_node_health:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated node health and service recovery runbook exists yet

  proxmox_storage_health:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated SMART, disk and Proxmox storage recovery runbook exists yet

  mail_relay_recovery:
    priority: medium
    category: core_infrastructure
    applies_to:
      - {name: mail-relay-01, address: 192.168.2.54}
    reason: mail relay exists in IaC inventory but has no dedicated production recovery runbook

  birdnet_service_recovery:
    priority: medium
    category: edge_appliance
    applies_to:
      - {name: birdnet-01, address: TBD, state: planned}
    reason: garden BirdNET-Go host will need a clean-build, monitoring, backup and recovery runbook after TestServer retirement
