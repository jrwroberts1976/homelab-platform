---
schema_version: 1

registry:
  authority: runbooks/registry.yml
  purpose: >-
    Machine-readable index of operational runbooks, the systems and services
    they apply to, where they are normally executed from, and the IaC used to
    implement or recover them.
  default_controller:
    name: admin-01
    address: 192.168.2.48
    user: james
    repository_path: ~/projects/homelab-platform
  lifecycle_values:
    - active
    - planned
    - deprecated
    - retired
  service_state_values:
    - operational
    - implementation_in_progress
    - planned
    - blocked
    - maintenance_planned
    - retired
  excluded_active_hosts:
    - name: ids-01
      reason: decommissioned
    - name: TestServer
      reason: retired identity; physical Raspberry Pi 4 is now docker-01
    - name: DietPi
      reason: retired identity; physical Raspberry Pi 3 is now admin-01

runbooks:
  dns_service_recovery:
    title: DNS Service Recovery Plan
    category: network
    document_type: recovery_runbook
    document: "production docs/DNS-SERVICE-RECOVERY-PLAN.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: dns-01, address: 192.168.2.51, role: primary_dns_resolver}
        - {name: dns-02, address: 192.168.2.50, role: secondary_dns_resolver}
        - {name: PROXMOX, address: 192.168.2.70, role: dns-02_hypervisor}
        - {name: Proxmox-2, address: 192.168.2.71, role: dns-01_hypervisor}
        - {name: RT-AC86U, address: 192.168.2.1, role: dhcp_dns_advertisement}
      services: [pihole, unbound, dns, dhcp_dns_advertisement]
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      scripts:
        - IaC/scripts/deploy-dns-resolver.sh
        - IaC/scripts/bootstrap-proxmox-node.sh
      playbooks:
        - IaC/ansible/playbooks/dns-resolver.yml
      roles:
        - IaC/ansible/roles/dns_resolver/
      terraform:
        - IaC/terraform/proxmox/dns-resolver/
    triggers:
      - dns_resolution_failure
      - pihole_failure
      - unbound_failure
      - dns_lxc_loss
      - proxmox_node_loss_affecting_dns
      - iac_controller_recovery
    notes:
      - 192.168.2.48 is admin-01 and is not a DNS fallback
      - total DNS outage recovery may require a temporary known-good upstream resolver on admin-01
      - dns-02 currently lacks the dns-01.jameshouse local record because of a known IaC parity defect
    last_validated: 2026-09-08

  router_syslog_service:
    title: ASUS Router Syslog Service
    category: network
    document_type: service_runbook
    document: "production docs/ROUTER-SYSLOG-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: RT-AC86U, address: 192.168.2.1, role: syslog_source}
        - {name: monitor-01, address: 192.168.2.52, role: syslog_receiver}
      services: [rsyslog, logrotate]
    run_from:
      name: admin-01
      address: 192.168.2.48
    network:
      protocol: udp
      port: 5514
      source: 192.168.2.1
      destination: 192.168.2.52
    paths:
      - /var/log/homelab/router/rt-ac86u.log
    iac:
      scripts:
        - IaC/scripts/deploy-router-syslog-receiver.sh
      playbooks:
        - IaC/ansible/playbooks/router-syslog.yml
      roles:
        - IaC/ansible/roles/router_syslog_receiver/
    monitoring:
      future_loki_selector: '{job="router_syslog",device="rt-ac86u"}'
      logging_pipeline_state: pending_alloy_loki_integration
    last_validated: 2026-09-10

  monitoring_service:
    title: Homelab Monitoring Service
    category: monitoring
    document_type: service_runbook
    document: "production docs/MONITORING-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: monitor-01, address: 192.168.2.52, role: monitoring_platform}
        - {name: Proxmox-2, address: 192.168.2.71, role: monitoring_hypervisor}
      monitored_targets:
        - {name: RT-AC86U, address: 192.168.2.1}
        - {name: dns-02, address: 192.168.2.50}
        - {name: dns-01, address: 192.168.2.51}
        - {name: monitor-01, address: 192.168.2.52}
        - {name: cloud-01, address: 192.168.2.53}
        - {name: sensor-01, address: 192.168.2.55}
        - {name: PROXMOX, address: 192.168.2.70}
        - {name: Proxmox-2, address: 192.168.2.71}
        - {name: media-01, address: 192.168.2.195}
        - {name: docker-01, address: 192.168.2.220}
      services: [prometheus, grafana, alertmanager, blackbox_exporter]
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      scripts:
        - IaC/scripts/deploy-monitoring-platform.sh
        - IaC/scripts/preflight-monitoring.sh
      playbooks:
        - IaC/ansible/playbooks/monitoring.yml
      roles:
        - IaC/ansible/roles/monitoring_stack/
      terraform:
        - IaC/terraform/proxmox/monitor-01/
    monitoring:
      active_targets_last_observed: 23
      healthy_targets_last_observed: 23
      active_alerts_last_observed: 0
      loki_state: not_deployed
      alloy_state: not_deployed_on_monitor_01
    last_validated: 2026-09-12

  network_sensor_service:
    title: Homelab Network Sensor Service
    category: security
    document_type: service_runbook
    document: "production docs/NETWORK-SENSOR-SERVICE.md"
    status: active
    service_state: implementation_in_progress
    applies_to:
      hosts:
        - {name: sensor-01, address: 192.168.2.55, role: passive_network_sensor}
        - {name: PROXMOX, address: 192.168.2.70, role: sensor_hypervisor}
      infrastructure:
        - {name: HP ProCurve port 24, role: planned_future_span_destination}
      services: [suricata, zeek, node_exporter]
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      scripts:
        - IaC/scripts/deploy-sensor-01-vm.sh
        - IaC/scripts/plan-sensor-01.sh
        - IaC/scripts/validate-sensor-01-vm.sh
        - IaC/scripts/deploy-network-sensor-toolchain.sh
        - IaC/scripts/configure-network-sensor-phase1.sh
      playbooks:
        - IaC/ansible/playbooks/network-sensor.yml
        - IaC/ansible/playbooks/network-sensor-config.yml
      roles:
        - IaC/ansible/roles/network_sensor/
        - IaC/ansible/roles/network_sensor_config/
      terraform:
        - IaC/terraform/proxmox/sensor-01/
    phase_state:
      phase_1_management_and_toolchain: complete_validated
      phase_2_capture_activation: pending_usb_capture_nic
      switch_mirroring: disabled_until_repatch
    last_validated: 2026-09-12

  time_service:
    title: Homelab Time Service
    category: core_infrastructure
    document_type: service_runbook
    document: "production docs/TIME-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: PROXMOX, address: 192.168.2.70, role: ntp-01}
        - {name: Proxmox-2, address: 192.168.2.71, role: ntp-02}
      network_scope: 192.168.2.0/24
      services: [chrony, ntp]
    run_from:
      name: admin-01
      address: 192.168.2.48
    network:
      protocol: udp
      port: 123
    iac:
      playbooks:
        - IaC/ansible/playbooks/proxmox-time.yml
      roles:
        - IaC/ansible/roles/chrony_server/
    last_validated: 2026-09-12

  media_service:
    title: media-01 Production Service
    category: media
    document_type: service_runbook
    document: "production docs/MEDIA-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: media-01, address: 192.168.2.195, role: kodi_media_endpoint}
      services: [kodi, samba, chrony, node_exporter]
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      playbooks:
        - IaC/ansible/playbooks/media-01.yml
        - IaC/ansible/playbooks/media-01-preflight.yml
      roles:
        - IaC/ansible/roles/media_endpoint/
        - IaC/ansible/roles/media_smb/
        - IaC/ansible/roles/media_firewall/
    notes:
      - nftables policy remains a follow-up gate and is not deployed
      - Prometheus ICMP and Node Exporter targets are live
    last_validated: 2026-09-12

  cloud_service:
    title: Homelab Cloud Data Service
    category: cloud
    document_type: service_runbook
    document: "production docs/CLOUD-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: cloud-01, address: 192.168.2.53, role: nextcloud_service}
        - {name: PROXMOX, address: 192.168.2.70, role: cloud_hypervisor}
      services: [nextcloud, postgresql, redis, cron]
    run_from:
      name: admin-01
      address: 192.168.2.48
    iac:
      scripts:
        - IaC/scripts/deploy-cloud-01.sh
        - IaC/scripts/preflight-cloud-01.sh
        - IaC/scripts/deploy-cloud-stack.sh
      playbooks:
        - IaC/ansible/playbooks/cloud-01.yml
        - IaC/ansible/playbooks/cloud-01-storage.yml
        - IaC/ansible/playbooks/cloud-stack.yml
      roles:
        - IaC/ansible/roles/cloud_baseline/
        - IaC/ansible/roles/cloud_stack/
      terraform:
        - IaC/terraform/proxmox/cloud-01/
    current_state:
      data_disk: 200_GiB_dedicated_VM_disk
      data_mount: /srv/cloud-01-data
      application_port: 8080
      external_cloudflare_access: not_deployed
      backup_restore_proof: not_proven
    last_validated: 2026-09-12

  mail_relay_service:
    title: Homelab Mail Relay Service
    category: core_infrastructure
    document_type: service_runbook
    document: "production docs/MAIL-RELAY-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: mail-relay-01, address: 192.168.2.54, role: smtp_relay}
        - {name: PROXMOX, address: 192.168.2.70, role: relay_hypervisor}
      services: [postfix, smtp]
    run_from:
      name: admin-01
      address: 192.168.2.48
    network:
      internal_smtp_port: 25
      upstream_relay: smtp.gmail.com:587
      upstream_tls: required
    iac:
      playbooks:
        - IaC/ansible/playbooks/mail-relay.yml
      terraform:
        - IaC/terraform/proxmox/mail-relay/
    monitoring:
      node_exporter: not_deployed
      prometheus_target: not_configured
    last_validated: 2026-09-12

  birdnet_service:
    title: BirdNET-Go Production Service
    category: application
    document_type: service_runbook
    document: "production docs/BIRDNET-SERVICE.md"
    status: active
    service_state: operational
    applies_to:
      hosts:
        - {name: docker-01, address: 192.168.2.220, role: birdnet_docker_host}
      services: [docker, birdnet-go, node_exporter]
    run_from:
      name: admin-01
      address: 192.168.2.48
    paths:
      - /opt/birdnet-go/compose.yml
    iac:
      playbooks:
        - IaC/ansible/playbooks/birdnet-01.yml
    monitoring:
      icmp: active
      node_exporter: active
      application_specific_monitoring: future
    last_validated: 2026-09-12

  cloudflare_pages_production:
    title: Cloudflare Pages Production Deployment Pipeline
    category: public_web
    document_type: deployment_runbook
    document: "production docs/CLOUDFLARE-PAGES-PRODUCTION-PIPELINE.md"
    status: active
    service_state: operational
    applies_to:
      repositories:
        - jrwroberts1976/engineering-portfolio
      external_services:
        - cloudflare_pages
        - github_actions
      endpoints:
        - me.jrwroberts.co.uk
    run_from:
      type: github_actions_or_admin_workstation

  router_clean_rebuild:
    title: Router Clean-Rebuild Plan
    category: network
    document_type: maintenance_runbook
    document: docs/network/ROUTER-RESET-PLAN.md
    status: planned
    service_state: maintenance_planned
    applies_to:
      hosts:
        - {name: RT-AC86U, address: 192.168.2.1, role: primary_router}
        - {name: AiMesh-node-1, address: 192.168.2.181, role: aimesh_node}
        - {name: AiMesh-node-2, address: 192.168.2.218, role: aimesh_node}
      services: [wan, lan, dhcp, wifi, aimesh, qos, firewall, syslog_forwarding]
    run_from:
      type: local_wired_admin_session

coverage_gaps:
  backup_recovery:
    priority: high
    category: backup
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
      - {name: cloud-01, address: 192.168.2.53}
    reason: no active PBS or Restic backup platform and no proven estate-wide restore path currently exists

  proxmox_node_health:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated node health and service recovery runbook exists yet

  proxmox_storage_health:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated SMART, disk and Proxmox storage recovery runbook exists yet

  alloy_loki_pipeline:
    priority: high
    category: monitoring
    applies_to:
      - {name: monitor-01, address: 192.168.2.52}
    reason: router local syslog is validated but Alloy and Loki are not deployed on monitor-01

  edge_cloudflare_tunnel:
    priority: medium
    category: edge
    applies_to:
      - {name: edge-01, address: 192.168.2.56}
    reason: LXC host is provisioned but cloudflared and the Cloudflare Tunnel workload are not deployed

  mail_relay_recovery_testing:
    priority: medium
    category: core_infrastructure
    applies_to:
      - {name: mail-relay-01, address: 192.168.2.54}
    reason: service is documented and operational but an end-to-end rebuild/recovery test has not been proven
