coverage_gaps:
  proxmox_cluster_backup_reconcile:
    priority: high
    category: backup
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
      - {name: greenbone-01, address: 192.168.2.57, vmid: 203}
    reason: >-
      The final cluster-era schedule is reconciled to 101,103,202,203 and VM203
      has manual backup/integrity proof, but the first unattended 03:15 cycle
      that includes VM203 still needs to be observed and recorded.

  remote_access_vpn_completion:
    priority: high
    category: network_security
    applies_to:
      - {name: RT-AC86U, address: 192.168.2.1}
      - {name: admin-01, address: 192.168.2.48}
      - {name: monitor-01, address: 192.168.2.52}
    reason: >-
      Router OpenVPN external authentication and tunnel establishment are proven,
      but intended internal administration access, internal DNS, DDNS endpoint
      behaviour and router recovery/client re-enrolment remain to be proven.

  backup_secondary_copy:
    priority: high
    category: backup
    applies_to:
      - {name: media-01, address: 192.168.2.195}
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: >-
      The primary Proxmox guest backup and LXC restore path is proven, but
      important data does not yet have an independent secondary backup copy.

  application_backup_recovery:
    priority: high
    category: backup
    applies_to:
      - {name: cloud-01, address: 192.168.2.53}
      - {name: docker-01, address: 192.168.2.220}
      - {name: media-01, address: 192.168.2.195}
      - {name: admin-01, address: 192.168.2.48}
    reason: >-
      QEMU restore, application-consistent cloud recovery and non-Proxmox data
      recovery are not yet proven estate-wide.

  proxmox_cluster_resilience:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
      - {name: admin-01, address: 192.168.2.48, role: qnetd}
    reason: >-
      Cluster membership, dual Corosync links and QDevice are proven healthy,
      but deliberate link0 failover and controlled single-node quorum behaviour
      have not yet been exercised.

  proxmox_node_health:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated node health and service recovery runbook exists yet

  proxmox_storage_health:
    priority: high
    category: proxmox
    applies_to:
      - {name: PROXMOX, address: 192.168.2.70}
      - {name: Proxmox-2, address: 192.168.2.71}
    reason: no dedicated SMART, disk and Proxmox storage recovery runbook exists yet

  edge_cloudflare_tunnel:
    priority: medium
    category: edge
    applies_to:
      - {name: edge-01, address: 192.168.2.56}
    reason: LXC host is provisioned but cloudflared and the Cloudflare Tunnel workload are not deployed

  mail_relay_recovery_testing:
    priority: medium
    category: core_infrastructure
    applies_to:
      - {name: mail-relay-01, address: 192.168.2.54}
    reason: service and client delivery are operational but a full destructive rebuild/recovery test has not been proven
